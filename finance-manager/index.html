<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ledger — Personal Finance</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- ?v= is the only thing that reliably replaces a tab icon: the files are
     served with a week of max-age, and browsers cache favicons harder still,
     so changing the bytes behind the same URL leaves the old one on screen.
     Bump the number whenever public/*.png or favicon.svg changes. -->
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="theme-color" content="#0E332C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#14453C; --pine-deep:#0E332C; --pine-soft:#1C5A4E;
  --porcelain:#F2F4F1; --card:#FFFFFF; --ink:#182420; --ink-soft:#51625C;
  --line:#DDE4DF; --line-soft:#E9EEEA;
  --pos:#1E7F5C; --neg:#C24936; --brass:#A87718; --brass-soft:#F3EAD4;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Be Vietnam Pro',-apple-system,'Segoe UI',sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(20,40,35,.06),0 4px 14px rgba(20,40,35,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--porcelain);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
/* No pinch / double-tap zoom, and no rubber-band text resize when iOS rotates */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{touch-action:manipulation;overscroll-behavior-y:none}
body.modal-open{overflow:hidden}
button{font-family:var(--sans);cursor:pointer;touch-action:manipulation}
input,select,textarea{font-family:var(--sans);font-size:15px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.hidden{display:none!important}

/* ---------- Boot splash (prevents login flash on refresh) ---------- */
#boot{position:fixed;inset:0;background:var(--pine-deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:60}
#boot .boot-mark{width:46px;height:46px;border-radius:12px;background:var(--pine);color:var(--brass-soft);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:24px}

/* ---------- Auth ---------- */
#authView{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--pine-deep);padding:20px}
.auth-card{background:var(--card);border-radius:16px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--pine);color:var(--brass-soft);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:20px}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
.auth-sub{color:var(--ink-soft);font-size:13px;margin-bottom:22px}
.auth-tabs{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:18px}
.auth-tabs button{flex:1;padding:9px;border:none;background:transparent;font-weight:600;color:var(--ink-soft)}
.auth-tabs button.on{background:var(--pine);color:#fff}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#FAFBFA;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pine);background:#fff;box-shadow:0 0 0 3px rgba(20,69,60,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:9px;border:1px solid transparent;font-weight:600;font-size:14px;transition:.15s}
.btn-primary{background:var(--pine);color:#fff;width:100%}
.btn-primary:hover{background:var(--pine-soft)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--pine);color:var(--pine)}
.btn-danger{background:transparent;border-color:transparent;color:var(--neg);padding:6px 10px}
.btn-sm{padding:6px 12px;font-size:13px}
.auth-msg{margin-top:12px;font-size:13px;color:var(--ink-soft);text-align:center;min-height:18px}
.auth-msg.err{color:var(--neg)}

/* ---------- Shell ---------- */
#app{display:flex;min-height:100vh}
.sidebar{width:224px;background:var(--pine-deep);color:#CDE0DA;display:flex;flex-direction:column;padding:20px 12px;position:fixed;top:0;bottom:0;left:0}
.sidebar .brand{margin-bottom:22px;padding:0 8px;gap:10px}
.sidebar .brand-mark{width:34px;height:34px;font-size:19px}
.sidebar .brand h1{color:#fff;font-size:16.5px;font-weight:700}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border:none;background:transparent;color:#9FBCB4;border-radius:9px;font-size:14px;font-weight:500;text-align:left}
.nav button svg{width:17px;height:17px;flex:none}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:var(--pine-soft);color:#fff;font-weight:600}
/* The two views you visit occasionally sit under a rule, a size down, so the
   four you live in read as the list. */
.nav-sep{height:1px;background:rgba(255,255,255,.12);margin:14px 8px}
.nav.sub{flex:1}
.nav.sub button{padding:9px 12px;font-size:13.5px;color:#7FA096}
.nav.sub button svg{width:16px;height:16px}
.nav.sub button.on{color:#fff;font-weight:600}
.side-foot{font-size:12px}
.side-foot button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:none;
  background:transparent;color:#7FA096;border-radius:9px;font-size:13px;font-weight:500;text-align:left}
.side-foot button svg{width:16px;height:16px;flex:none}
.side-foot button:hover{background:rgba(255,255,255,.06);color:#fff}
.side-foot button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{flex:1;margin-left:224px;padding:0 0 90px;max-width:1600px;width:100%}
/* One hairline under the bar, and nothing under the title: the old rule under
   every heading read as a second, competing divider. */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:20px 30px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar .tb-left,.topbar .tb-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
/* A view with no month stepper and no actions shouldn't reserve a row for them. */
.topbar .actions:empty,.space-switch:empty{display:none}
.topbar h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
.topbar .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#viewBody{padding:16px 30px 0}

/* ---------- Cards & tables ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);margin-bottom:12px}
.grid{display:grid;gap:14px}
.grid-3{grid-template-columns:repeat(3,1fr)}
.hero{background:var(--pine);color:#fff;border-radius:14px;padding:18px 22px;margin-bottom:14px;position:relative}
.hero .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#AECFC6;margin-bottom:2px}
.hero .big{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.hero .row{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap}
.hero .row .lbl{margin-bottom:2px}
.hero .row .val{font-family:var(--mono);font-size:14px;font-weight:500}
.hero-div{width:1px;align-self:stretch;background:rgba(255,255,255,.14);flex:none}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line-soft);font-size:14px;vertical-align:middle}
.tbl tr:hover td{background:#F7FAF8}
.tbl .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .actions-cell{text-align:right;white-space:nowrap}
.icon-btn{background:none;border:none;padding:4px 6px;color:var(--ink-soft);border-radius:6px}
.icon-btn:hover{background:var(--line-soft);color:var(--ink)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--line-soft);color:var(--ink-soft)}
.tag.income{background:#DFF0E8;color:var(--pos)}
.tag.brass{background:var(--brass-soft);color:var(--brass)}
.empty{padding:26px;text-align:center;color:var(--ink-soft);font-size:14px}
.clr-dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:11px;line-height:1;color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0}
.clr-dot.on{background:var(--pos);border-color:var(--pos)}
.clr-dot.lock{border:none;background:transparent;font-size:12px;cursor:pointer}
.bar{height:5px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--pos)}
.bar i.over{background:var(--neg)}

/* ---------- ⓘ — every sentence the screens used to print ---------- */
/* The explanations were three lines of prose under a number nobody re-read
   after the first week. They live behind this dot now: tap it, read it once. */
.ibtn{width:15px;height:15px;border-radius:50%;border:1px solid var(--line);background:#fff;
  color:var(--ink-soft);font-size:9.5px;font-weight:700;font-style:normal;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;vertical-align:middle}
.ibtn:hover{border-color:var(--pine);color:var(--pine)}
.ibtn.on-dark{border-color:rgba(255,255,255,.35);background:transparent;color:#AECFC6}
.ibtn.on-dark:hover{border-color:#fff;color:#fff}
.info-pop{position:absolute;z-index:70;width:min(340px,calc(100vw - 28px));background:#fff;
  border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(20,40,35,.18);padding:14px 16px}
.info-pop .ih{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.info-pop b{font-size:13px;font-weight:700}
.info-pop p{font-size:12.5px;color:var(--ink-soft);line-height:1.55}
.info-pop p+p{margin-top:8px}
.info-x{border:none;background:none;color:var(--ink-soft);font-size:13px;line-height:1;padding:2px}

/* ---------- Overflow menus (the ⋯ that replaces a dropped column) ---------- */
.omenu{position:absolute;z-index:70;width:214px;background:#fff;border:1px solid var(--line);
  border-radius:11px;box-shadow:0 12px 30px rgba(20,40,35,.18);padding:5px}
.omenu button{width:100%;text-align:left;padding:9px 10px;border:none;background:none;
  border-radius:7px;font-size:13.5px;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:10px}
.omenu button:hover{background:#F1F6F3;color:var(--pine)}
.omenu button.danger{color:var(--neg)}
.omenu button.danger:hover{background:#FBE9E5}
.omenu button em{font-style:normal;font-size:11.5px;color:var(--ink-soft)}
.omenu hr{border:none;border-top:1px solid var(--line-soft);margin:4px 0}
@media(max-width:760px){.omenu{width:min(280px,calc(100vw - 24px))}.omenu button{padding:12px 10px;font-size:15px;min-height:46px}}

/* modal */
#overlay{position:fixed;inset:0;background:rgba(14,51,44,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:24px 26px}
@media(max-width:760px){.modal{max-width:430px;padding:24px}}
.modal h3{font-size:17px;font-weight:800;margin-bottom:4px}
.modal .chip{padding:10px 16px;font-size:13.5px}
.modal .chiprow{gap:8px}
@media(max-width:760px){.modal .chip{padding:8px 13px;font-size:12.5px}}
.modal .m-sub{font-size:13px;color:var(--ink-soft);margin-bottom:16px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
.seg button{flex:1;padding:8px;border:none;background:#fff;font-weight:600;font-size:13px;color:var(--ink-soft)}
.seg button.on{background:var(--pine);color:#fff}
.row2{display:flex;gap:10px}.row2>.field{flex:1}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:99;box-shadow:var(--shadow);max-width:90vw}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--pine);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.5s}}


/* ---------- Transactions: an Actual-style register ---------- */
/* One line per transaction, on real columns — Date, Note and Balance stopped
   being crammed into a subtitle, and the pine hero with its 31-bar chart is
   behind “Daily flow” instead of taking the top third of the screen. */
:root{--reg:34px 128px minmax(120px,1fr) 164px 148px minmax(100px,1fr) 132px 130px 32px}
.reg{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:visible}
.tx-strip{display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tx-strip .cell{padding:12px 20px;display:flex;align-items:baseline;gap:9px;border-left:1px solid var(--line-soft)}
.tx-strip .cell:first-child{padding-left:0;border-left:none}
.tx-strip .cell .l{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft)}
.tx-strip .cell b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;white-space:nowrap}
.tx-strip .right{margin-left:auto;display:flex;align-items:center;gap:8px;padding:12px 0}
.tx-strip .right span{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.minibtn{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--ink-soft)}
.minibtn:hover{border-color:var(--pine);color:var(--pine)}
.minibtn.on{background:var(--pine);border-color:var(--pine);color:#fff}
.flow{padding:14px 20px;border-bottom:1px solid var(--line);background:#FAFBFA}
.flow-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
.flow-head b{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600}
.flow-bars{display:flex;align-items:flex-end;gap:3px;height:74px}
.flow-bars .day{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%;min-width:0}
.flow-bars i{display:block;border-radius:2px 2px 0 0}
.flow-bars i.in{background:#5FBCA0}
.flow-bars i.out{background:#E08D7B}
.flow-bars i.base{height:2px;border-radius:1px;background:var(--line);flex:none}
.flow-axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);border-top:1px solid var(--line-soft);padding-top:5px;margin-top:5px}
.flow-legend{display:flex;gap:14px;font-size:11px;color:var(--ink-soft);align-items:center}
.flow-legend span{display:flex;align-items:center;gap:5px}
.flow-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.tx-search{display:flex;align-items:center;height:36px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 10px;gap:8px;width:250px}
.tx-search svg{width:14px;height:14px;flex:none;color:#9AAAA4}
.tx-search input{flex:1;min-width:0;border:none;outline:none;font-size:13px;background:transparent}
/* Inline search + filter row: desktop only, sits above the register in place
   of the old Filter button and its sheet — every filter is one click away
   and its state is always visible, not hidden behind a count badge. */
.filt-row{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;z-index:10}
.filt-search{width:230px;flex:none}
.filt-dd{position:relative;height:36px;flex:none}
.filt-btn{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.filt-btn:hover{border-color:var(--pine)}
.filt-btn.open{border-color:var(--pine);background:#F1F6F3}
.filt-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600}
.filt-btn em{font-size:10px;color:var(--ink-soft);font-style:normal}
.filt-ic{display:flex;flex:none}
.filt-ic svg{width:13px;height:13px;display:block}
.filt-pop{position:absolute;top:44px;left:0;width:190px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(20,40,35,.18);padding:8px;z-index:30}
.filt-pop-acc{width:220px}
.filt-pop-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600;padding:6px 10px 4px}
.filt-opt{width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;margin-bottom:3px;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer}
.filt-opt:hover{border-color:var(--pine)}
.filt-opt.on{border-color:var(--pine);background:#F1F6F3}
.filt-opt .filt-ic svg{width:14px;height:14px}
.filt-opt-name{flex:1}
.filt-check{color:var(--pine);font-weight:700}
.filt-uncl{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--ink);cursor:pointer}
.filt-uncl input{width:16px;height:16px;accent-color:var(--pine);margin:0}
.filt-clear{margin-left:auto;background:transparent;border:none;color:var(--ink-soft);font-size:13px;font-weight:600;cursor:pointer;padding:4px 6px}
.filt-clear:hover{color:var(--pine)}
.ledger{padding:0 0 12px}
.led-head{display:grid;grid-template-columns:var(--reg);padding:0 14px;background:#FAFBFA;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.led-head span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600;padding:9px 6px}
.led-head span.r{text-align:right}
.day-head{display:flex;justify-content:space-between;align-items:baseline;padding:8px 20px;
  background:#FAFBFA;border-bottom:1px solid var(--line-soft);border-top:1px solid #F1F5F2}
.day-head b{font-weight:700;font-size:11px;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase}
.day-head span{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)}
/* In the register, the day's total is a sum of the Amount column, so it stands
   in that column, on the register's own grid. Pushed to the right edge of the
   card it lined up with nothing — it cleared the Balance column and sat over
   the empty actions one, reading as a balance that disagreed with every balance
   under it. */
.day-head.reg{display:grid;grid-template-columns:var(--reg);padding:8px 14px}
.day-head.reg>*{padding:0 6px}
.day-head.reg b{grid-column:1/7}
.day-head.reg span{grid-column:7;text-align:right;font-variant-numeric:tabular-nums}
.led-row{display:grid;grid-template-columns:var(--reg);align-items:center;padding:0 14px;
  border-bottom:1px solid #F1F5F2;min-height:38px;cursor:pointer}
.led-row>span{padding:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.led-row:hover{background:#F7FAF8}
.led-row.locked{cursor:default}
.led-row.locked>span:not(.led-clr){color:#9AAAA4}
.led-clr{display:flex;align-items:center;justify-content:center}
.led-main{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.led-main svg{width:13px;height:13px;flex:none;color:var(--brass)}
/* The Payee column is left empty when there is no payee. The category is in its
   own column right beside it, so repeating it here only made the two disagree
   about what the row is called. The phone has no category column, so its title
   keeps the fallback — and drops the category from the subtitle to match. */
.led-main .nm-m,.led-main .sub-m{display:none}
.led-date{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft)}
.led-cat{font-size:13.5px;color:var(--pos)}
.led-cat.soft{color:var(--brass)}
.led-acc{font-size:13.5px;color:var(--ink-soft)}
.led-note{font-size:13px;color:var(--ink-soft)}
.led-amt{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:500}
.led-amt .led-bal-m{display:none}
.led-bal{text-align:right;font-family:var(--mono);font-size:12.5px;color:#9AAAA4}
.amt-soft{color:#9AAAA4;font-weight:400}
.led-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 0;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft)}
.fab{display:none;position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:none;background:var(--pine);color:#fff;font-size:26px;font-weight:500;line-height:1;box-shadow:0 6px 20px rgba(14,51,44,.35);z-index:30;align-items:center;justify-content:center}
/* amount-first modal */
.flabel{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.amt-panel{background:#FAFBFA;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.amt-line{display:flex;align-items:baseline;gap:8px}
.amt-line input{flex:1;min-width:0;border:none;background:transparent;outline:none;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:32px;font-weight:600;letter-spacing:-.01em;padding:0}
.amt-line .cursym{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--ink-soft)}
.amt-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink-soft)}
@media(max-width:760px){.chip{padding:6px 12px;font-size:12.5px}}
.chip:hover{border-color:var(--pine);color:var(--pine)}
.chip.on{background:var(--pine);border-color:var(--pine);color:#fff}
.qchip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--ink-soft)}
.qchip:hover{border-color:var(--pine);color:var(--pine)}

/* ---------- Register: one cell at a time, Actual-style ---------- */
/* The editor is the row, on the register's own columns. Everything that used
   to need a second line — the sign words, the +10k chips, the space picker,
   the keyboard legend — now has a column or a hint band of its own. */
.led-kbd{display:flex;align-items:center;gap:16px;padding:7px 20px;background:#F4F9F6;
  border-bottom:1px solid var(--line-soft);font-size:11.5px;color:var(--ink-soft);font-family:var(--mono);flex-wrap:wrap}
.led-kbd b{color:var(--ink)}
.led-kbd .sp{margin-left:auto}
.led-row.edit{background:#F4F9F6;cursor:default;box-shadow:inset 3px 0 0 var(--pine);
  border-bottom:1px solid var(--line);min-height:44px}
.led-row.edit:hover{background:#F4F9F6}
.led-row.edit>span{overflow:visible}
.led-row.edit input,.led-row.edit select{width:100%;min-width:0;height:32px;border:1px solid var(--line);
  border-radius:6px;background:#fff;padding:0 8px;font-size:13.5px;outline:none;color:var(--ink)}
.led-row.edit input:focus,.led-row.edit select:focus{border-color:var(--pine);box-shadow:0 0 0 3px rgba(20,69,60,.12)}
.led-row.edit input:disabled{background:var(--line-soft);color:var(--ink-soft)}
.ed-date{font-family:var(--mono);font-size:12.5px!important}
.ed-amt{display:flex;align-items:center;gap:4px}
.ed-amt input{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
/* One button cycles expense → income → transfer; the glyph is the sign the
   amount will be saved with, so the row shows its own direction. */
.ed-sign{flex:none;width:26px;height:32px;border:1px solid var(--line);border-radius:6px;
  background:#fff;font-size:14px;font-weight:700;color:var(--neg);line-height:1}
.ed-sign:hover:not(:disabled){border-color:var(--pine)}
.ed-sign:disabled{opacity:.45}
.led-row.edit.income .ed-sign{color:var(--pos)}
.led-row.edit.transfer .ed-sign{color:var(--brass)}
.ed-acts{display:flex;gap:5px;justify-content:flex-end;align-items:center}
.ed-save{height:32px;padding:0 12px;border:none;border-radius:6px;background:var(--pine);color:#fff;
  font-size:12.5px;font-weight:700;flex:none}
.ed-save:hover{background:var(--ink)}
.ed-x{width:24px;height:24px;border:none;background:none;color:var(--ink-soft);font-size:13px;
  display:flex;align-items:center;justify-content:center;flex:none}
.ed-x:hover{color:var(--ink)}
/* The pickers float over the rows below instead of pushing the row open. They
   are the phone composer's panels (.tf-pop), anchored under their cell. */
.led-row.edit .combo-btn{height:32px;padding:0 8px;font-size:13.5px;background:#fff;border-radius:6px;font-weight:400}
.led-row.edit .combo-pop{position:absolute;top:calc(100% + 6px);left:0;min-width:290px;z-index:25;margin:0;
  border-radius:14px;box-shadow:0 12px 34px rgba(20,40,35,.18)}
.led-row.edit .combo-opt{font-size:13.5px}
.led-row.edit .ed-dd{position:relative}
#txSplitBand:empty{display:none}
/* 5px + the row's 6px under its inputs + its 1px (hidden) border = 12px,
   the same as the gap under the card. */
#txSplitBand{background:#F4F9F6;box-shadow:inset 3px 0 0 var(--pine);border-bottom:1px solid var(--line);padding:5px 20px 12px 54px}
.led-row.edit:has(+ #txSplitBand:not(:empty)){border-bottom-color:transparent}
.led-split{max-width:560px;cursor:pointer}
.led-split:hover{border-color:var(--pine)}
/* Desktop split sheet: the phone's split screen, with typed shares. */
.spd-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.spd-head .tf-num{cursor:default}
.spd-head .tf-num b{font-size:30px}
.spd-head .tf-num span{font-size:18px}
.spd-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.spd-person{cursor:text;min-height:52px;padding:6px 8px 6px 14px}
.spd-person .sw{width:10px;height:10px;border-radius:3px;flex:none;display:block}
.spd-amt{width:150px;flex:none;height:36px;border:1px solid transparent;border-radius:8px;background:transparent;padding:0 8px;outline:none;
  text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;color:var(--ink)}
.spd-amt:hover{border-color:var(--line)}
.spd-amt:focus{border-color:var(--pine);background:#fff}
.spd-cur{font-family:var(--mono);font-size:13px;color:var(--ink-soft);flex:none}
.spd-x{width:28px;height:28px;border:none;border-radius:7px;background:none;color:#9AAAA4;font-size:12px;flex:none}
.spd-x:hover{background:var(--line-soft);color:var(--neg)}
.spd-add{display:flex;gap:8px}
.spd-add input{flex:1;min-width:0;height:44px;border:1px solid var(--pine);border-radius:12px;padding:0 14px;font-size:14.5px;outline:none;box-shadow:0 0 0 3px rgba(20,69,60,.12)}
.spd-add .btn{width:auto;height:44px}
.spd-list .tf-quick-people{margin-top:2px}
.tf-split-chips button:hover,.tf-quick-people button:hover{border-color:var(--pine);color:var(--pine)}
.spd-err{font-size:12.5px;color:var(--neg);font-weight:500}
.ed-space{display:block;flex:none}
.ed-space .ed-pick{width:auto;gap:6px;padding:0 7px}
.ed-pick .dot,.tf-pop-opt .dot{width:10px;height:10px;border-radius:3px;flex:none;display:block}
.ed-pick{width:100%;height:32px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px;
  border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13.5px;color:var(--ink);text-align:left}
.ed-pick>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-pick>span.soft{color:#9AAAA4}
.ed-pick em{font-style:normal;color:var(--ink-soft);font-size:11px;flex:none}
.ed-pick:hover{border-color:var(--pine)}
.ed-pick.open,.ed-pick:focus-visible{border-color:var(--pine);box-shadow:0 0 0 3px rgba(20,69,60,.12);outline:none}
.led-row.edit .tf-pop.ed-pop{position:absolute;top:calc(100% + 6px);left:0;width:280px;max-height:min(60vh,420px);
  z-index:25;white-space:normal;cursor:default}
.led-row.edit .tf-pop.ed-pop.r{left:auto;right:0;width:220px}
.led-row.edit .tf-pop.ed-pop.cal{width:292px;padding:12px}
.ed-pop .tf-pop-opt:hover,.ed-pop .tf-pop-opt.hl{border-color:var(--pine)}
.ed-pop .tf-pop-opt.hl{background:#F7FAF8}
.ed-pop .tf-cal-q button:hover,.ed-pop .tf-cal-nav button:hover{border-color:var(--pine);color:var(--pine)}
.ed-pop .tf-cal-grid button,.ed-pop .tf-cal-grid span{height:34px}
.ed-pop .tf-cal-grid button:hover:not(.sel){background:#F1F6F3;color:var(--pine)}

/* ---------- Budget ---------- */
/* One number, one bar, one ⓘ. The old strip printed the same total four ways
   — a legend, a footer sentence and two paragraphs — before you got to a row. */
.alloc{display:flex;align-items:center;gap:32px}
.alloc .left{flex:none}
.alloc .lbl{display:flex;align-items:center;gap:7px}
.alloc .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.alloc .stats{display:flex;gap:26px;flex-wrap:wrap}
.alloc .lbl.sm{font-size:10.5px;letter-spacing:.09em;margin-bottom:0}
.alloc .val{font-family:var(--mono);font-size:14px;font-weight:500;white-space:nowrap}
.alloc .days{flex:none;text-align:right}
.alloc-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.12)}
.alloc-bar i{display:block;height:100%}
.budtable{padding:0 18px 12px}
/* Just the left-to-budget number: the bar and five totals under it are gone. */
.bud-left{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px}
.bud-left .lbl{display:flex;align-items:center;gap:7px;margin-bottom:0}
.bud-left .big{font-size:22px}
.bud-cols{display:grid;grid-template-columns:1fr 160px 92px;gap:10px;padding:12px 8px 8px;border-bottom:1px solid var(--line)}
.bud-cols span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600}
.bud-cols .r{text-align:right}
/* A tinted band, not a 2px pine rule: the rule under every group read as a
   heavier divider than the one under the column heads. */
.bgrp-head{display:grid;grid-template-columns:1fr 160px 92px;gap:10px;align-items:center;
  padding:8px;background:#F7FAF8;border-bottom:1px solid var(--line-soft);border-top:1px solid var(--line-soft);cursor:pointer}
.bgrp-head:hover{background:#F1F6F3}
.bgrp-name{display:flex;align-items:center;gap:8px;min-width:0}
.bgrp-name .caret{width:10px;flex:none;font-size:9px;color:var(--ink-soft);font-style:normal}
.bgrp-name b{font-weight:700;font-size:11.5px;color:var(--pine);letter-spacing:.06em;text-transform:uppercase}
.bgrp-name .meta{font-size:11px;color:var(--brass);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bgrp-head .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500;white-space:nowrap}
.bgrp-head .num.zero{color:#9AAAA4;font-weight:400}
.mini{height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:11.5px;font-weight:600;color:var(--ink-soft)}
.mini:hover{border-color:var(--pine);color:var(--pine)}
/* Name and what is left in it. Budgeted and Spent are in the sheet the row opens. */
.benv{display:grid;grid-template-columns:1fr 160px 92px;gap:10px;align-items:center;padding:9px 8px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.benv:hover{background:#F7FAF8}
.benv:hover .benv-actions .sq{border-color:var(--line);background:#fff;color:var(--ink-soft)}
.benv-title{display:flex;align-items:center;gap:8px;min-width:0}
.benv-title b{font-size:14px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pillmini{flex:none;font-size:12px;font-weight:600;color:var(--brass)}
.pillmini.danger{color:var(--neg);font-size:12px}
/* The bar says how much is used; the sentence that repeated it in words is gone. */
.benv-bar{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.benv-bar .bar{flex:1;max-width:180px;height:4px;margin:0}
.benv-bar .hint{font-size:11.5px;color:var(--ink-soft);white-space:nowrap}
.benv .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:500;white-space:nowrap}
.benv .num.zero{color:#9AAAA4;font-weight:400}
.benv-actions{display:flex;justify-content:flex-end;gap:4px}
.benv-actions .sq{border-color:transparent;background:transparent;color:#9AAAA4}
/* Income rows: just what came in */
.binc{display:grid;grid-template-columns:1fr 160px 92px;gap:10px;align-items:center;padding:9px 8px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.binc:hover{background:#F7FAF8}
.binc .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:500;white-space:nowrap}
.binc .num.zero{color:#9AAAA4;font-weight:400}
.sq{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--ink-soft)}
.sq svg{width:13px;height:13px}
.sq:hover{border-color:var(--pine);color:var(--pine)}
.sq.del:hover{border-color:var(--neg);color:var(--neg)}
.sq.on{background:var(--brass-soft);border-color:var(--brass-soft);color:var(--brass)}
.ro-card{width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.ro-card.on{background:#F4F9F6;border-color:var(--pos)}
/* Outside .field on purpose: .field input{width:100%} stretches a checkbox
   across the whole modal. */
.checkrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:2px;
  font-size:13.5px;font-weight:500;color:var(--ink);cursor:pointer}
.checkrow input{width:17px;height:17px;flex:none;accent-color:var(--pine);margin:0}
.ro-card span{display:flex;flex-direction:column;gap:2px}
.ro-card b{font-size:13.5px;font-weight:600;color:var(--ink)}
.ro-card span span{font-size:12.5px;color:var(--ink-soft)}
.ro-card svg{width:18px;height:18px;flex:none;stroke-width:2}
.statbox{flex:1;border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px}
.statbox .lbl2{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);margin-bottom:3px}
.statbox .v{font-family:var(--mono);font-size:14px;font-weight:500}
.danger-box{border:1px solid var(--neg);background:#FBE9E5;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.danger-box b{display:block;font-size:13.5px;font-weight:700;color:var(--neg);margin-bottom:4px}


/* ---------- Accounts: rows, not a table ---------- */
/* A 4-column table has to drop a column on a phone — that is how Edit and
   Reconcile used to disappear. A row with one ⋯ is identical on both. */
.acct-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:4px 16px 10px;margin-bottom:12px}
.acct-head{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);
  font-weight:600;padding:12px 4px 8px;border-bottom:1px solid var(--line)}
.acct-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line-soft)}
.acct-row:last-child{border-bottom:none}
.acct-row.closed{opacity:.5}
.acct-row .an{flex:1;min-width:0}
.acct-row .an b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-row .an span{font-size:11.5px;color:#9AAAA4}
.acct-row .ab{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:500;white-space:nowrap}
.acct-row .sq{width:28px;height:28px;border-radius:7px;font-size:13px}

/* ---------- More: a screen, not a sheet ---------- */
.more-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:0 14px;margin-bottom:14px}
.more-row{width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:15px 2px;
  border:none;background:none;border-bottom:1px solid var(--line-soft);font-size:15.5px;
  font-weight:500;color:var(--ink);min-height:58px}
.more-row:last-child{border-bottom:none}
.more-row svg{width:19px;height:19px;flex:none;color:var(--pine)}
.more-row>span{flex:1;min-width:0}
.more-row em{font-style:normal;color:#9AAAA4;font-size:12.5px;font-family:var(--mono)}
.more-row .chev{font-family:var(--sans);font-size:15px}
.more-row.on{color:var(--pine);font-weight:600}
.more-row.out{color:var(--neg);justify-content:center;font-weight:600;border:1px solid var(--line);
  border-radius:11px;min-height:50px;padding:13px}
.more-row.out svg{color:var(--neg)}
.more-mail{font-size:12.5px;color:var(--ink-soft);word-break:break-all;margin-bottom:12px}

/* ---------- Labelled 52px buttons, for the phone sheets ---------- */
.sfield{display:flex;flex-direction:column;gap:2px;padding:9px 14px;border:1px solid var(--line);
  border-radius:11px;background:#fff;margin-bottom:9px;min-height:52px;justify-content:center}
.sfield>label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600}
.sfield input{border:none;outline:none;background:transparent;padding:0;font-size:15px;font-weight:500;width:100%;color:var(--ink)}
.sfield .combo-btn{border:none;background:transparent;padding:0;font-size:15px;height:auto}
.sfield .combo-btn>span{font-weight:500}
.srow{display:flex;gap:9px}
.srow>.sfield{flex:1;min-width:0}

/* ---------- Debts ---------- */
.tag.debt{background:#E8EEF5;color:#4A6C8C}
.debt-row{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.debt-row:hover{background:#F7FAF8}
.debt-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.debt-title{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.debt-title b{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.debt-note{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.debt-amt{flex:none;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14.5px;font-weight:500;white-space:nowrap}
.debt-amt.soft{color:var(--ink-soft);font-weight:400;font-size:13px}


/* ---------- Budget spaces ---------- */
.space-switch{display:flex;align-items:center;gap:6px}
.space-switch select{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13px;font-weight:600;color:var(--pine)}


/* ---------- Unified 36px toolbar ---------- */
.topbar .actions{display:flex;align-items:center;gap:10px;height:36px}
.bar-seg{display:flex;align-items:center;height:36px;flex:none;border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden}
.bar-seg button{width:32px;flex:none;height:34px;border:none;background:transparent;font-size:15px;color:var(--ink)}
.bar-seg button:hover{background:#F1F6F3;color:var(--pine)}
.bar-seg b{font-family:var(--mono);font-size:13.5px;font-weight:600;flex:none;min-width:88px;text-align:center;border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft);line-height:34px}
.btn36{height:36px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.btn36.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn36.ghost:hover{border-color:var(--pine);color:var(--pine)}
.btn36.primary{background:var(--pine);color:#fff;padding:0 16px}
.btn36.primary:hover{background:var(--pine-soft)}
.btn36.ic{display:inline-flex;align-items:center;gap:7px}
.btn36.ic.only{justify-content:center;padding:0;width:36px}
.bar-hair{width:1px;height:20px;background:var(--line);flex:none;display:block}
.space-wrap{position:relative;height:36px;flex:none}
.sp-btn{display:flex;align-items:center;gap:9px;padding:0 11px 0 12px;background:#fff;border-color:var(--line);color:var(--pine)}
.sp-btn i{width:9px;height:9px;border-radius:3px;flex:none;font-style:normal}
.sp-btn em{font-size:10px;color:var(--ink-soft);font-style:normal}
.sp-btn.open,.sp-btn:hover{border-color:var(--pine);background:#F1F6F3}
.sp-pop{position:absolute;top:44px;left:0;width:min(326px,calc(100vw - 28px));background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(20,40,35,.18);padding:8px;z-index:45}
.sp-pop-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600;padding:6px 10px 8px}
.sp-row{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;margin-bottom:3px}
.sp-row:hover{border-color:var(--pine)}
.sp-row.on{background:#F1F6F3;border-color:var(--pine)}
.sp-row>i{width:10px;height:10px;border-radius:3px;flex:none;font-style:normal}
.sp-row>span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sp-row>span b{font-size:13.5px;font-weight:600;color:var(--ink)}
.sp-row>span span{font-size:11.5px;color:var(--ink-soft)}
.sp-row>em{font-family:var(--mono);font-size:12px;color:var(--pine);font-weight:600;font-style:normal}
.sp-pop-f{border-top:1px solid var(--line-soft);margin-top:5px;padding:8px 10px 4px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sp-pop-f span{font-size:11.5px;color:var(--ink-soft);max-width:186px}

/* ---------- Reports ---------- */
.rp-top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:12px}
.rp-sum{display:flex;gap:18px;font-size:12.5px;color:var(--ink-soft)}
.rp-sum b{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);margin-left:4px}
.rp-sum b.pos{color:var(--pos)} .rp-sum b.neg{color:var(--neg)}
.rp-cmp{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-soft)}
.rp-cmp>span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.rp-cmp .tf-seg button{padding:7px 12px;white-space:nowrap}
.chip{padding:1px 7px;border-radius:99px;font-size:10.5px;font-weight:600;font-family:var(--mono);white-space:nowrap}
.linkbtn{border:none;background:none;padding:0;color:var(--pine);font-weight:600;font-size:12px;cursor:pointer;font-family:var(--sans)}
.linkbtn:hover{text-decoration:underline}
.rp-ins-card{padding:14px 20px}
.rp-ins{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}
.rp-irow{display:flex;align-items:baseline;gap:9px;font-size:12.5px;line-height:1.45;padding:3px 0;border-radius:6px}
.rp-irow>i{width:7px;height:7px;border-radius:99px;flex:none;transform:translateY(-1px)}
.rp-irow b{font-weight:600}
.rp-irow.go{cursor:pointer}
.rp-irow.go:hover span{text-decoration:underline;text-decoration-color:var(--line)}
.rp-charts{display:flex;gap:12px;align-items:flex-start}
.rp-charts .card{margin-bottom:12px}
.rp-col{flex:1.55;min-width:0}
.rp-col.rp-side{flex:1}
.rp-chead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.rp-chead b{font-size:13.5px;font-weight:700}
.rp-cnote{font-size:10.5px;color:var(--ink-soft);font-family:var(--mono);display:flex;align-items:center;gap:6px}
.tickleg{width:2px;height:11px;background:var(--ink);display:inline-block}
.rp-cnote .line{width:12px;height:3px;display:inline-block;border-radius:2px;margin-right:5px;vertical-align:middle}
.rp-cnote .line.solid{background:var(--pine)}
.rp-cnote .line.dash{background:#9AAAA4}
/* An SVG chevron centred in a fixed box, so it turns about its own middle
   and stays level with the name when open. */
.rp-car{width:12px;height:12px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink-soft);transition:transform .15s}
.rp-car svg{width:10px;height:10px;display:block}
.open .rp-car{transform:rotate(90deg)}
.rp-nm{display:flex;align-items:center;gap:4px;min-width:0}
.rp-nm>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-nm>em{flex:none}
/* Rows reach 8px past the card's content edge on both sides, so the hover
   wash has room around the text while names and bars stay aligned with the
   card title. */
.rp-crow,.rp-erow,.rp-prow{cursor:pointer;border-radius:8px;margin:0 -8px}
.rp-crow:hover,.rp-erow:hover,.rp-prow:hover{background:#F6F9F7}
.rp-crow{display:grid;grid-template-columns:132px 1fr 64px 64px;gap:10px;align-items:center;padding:6px 8px}
.rp-crow .cn{font-size:12px;min-width:0}
.rp-crow .cb{position:relative;height:18px;background:var(--porcelain);border-radius:5px;display:block;min-width:0}
.rp-crow .cb .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.rp-crow .cb .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.rp-crow .ca{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500;white-space:nowrap}
.rp-crow .cd{display:flex;justify-content:flex-end}
.rp-x{background:var(--porcelain);border-radius:10px;padding:8px 12px 10px;margin:8px -8px 10px}
.rp-xfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft);font-family:var(--mono);margin-top:6px}
.rp-xfoot>span{display:flex;align-items:center;gap:6px}
.rp-dash{width:14px;border-top:2px dashed #9AAAA4;display:inline-block}
.rp-tk{width:12px;height:2px;background:var(--ink);display:inline-block}
.rp-mini-plot{position:relative;display:flex;gap:8px;height:84px;padding-top:14px;border-bottom:1px solid var(--line)}
.rp-mini-plot .col{flex:1;position:relative;min-width:0}
.rp-mini-plot .col i.b{position:absolute;left:18%;right:18%;bottom:0;border-radius:3px 3px 0 0;background:#AECFC6}
.rp-mini-plot .col.cur i.b{background:var(--pine)}
.rp-mini-plot .col i.b.over{background:#E08D7B}
.rp-mini-plot .col i.t{position:absolute;left:8%;right:8%;height:2px;background:var(--ink)}
.rp-mini-plot .col em{position:absolute;left:-4px;right:-4px;text-align:center;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink-soft);white-space:nowrap}
.rp-mini-plot .ref{position:absolute;left:0;right:0;border-top:2px dashed #9AAAA4;pointer-events:none}
.rp-mini-axis{display:flex;gap:8px;padding-top:4px}
.rp-mini-axis span{flex:1;text-align:center;font-size:10.5px;color:var(--ink-soft);font-family:var(--mono)}
.rp-pacebox{height:130px}
.rp-paceaxis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);font-family:var(--mono);border-top:1px solid var(--line-soft);padding-top:5px;margin-top:4px}
.rp-pacenote{font-size:12px;color:var(--ink-soft);margin-top:8px}
.rp-pacenote b{font-family:var(--mono);color:var(--ink);font-weight:600}
.rp-pacenote span{font-family:var(--mono)}
.rp-erow{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px 72px;gap:10px;align-items:center;padding:7px 8px}
.rp-erow .en{min-width:0;display:flex;flex-direction:column;gap:4px;font-size:12px}
.rp-erow .en>.rp-nm{white-space:nowrap}
.rp-erow .en em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--pos)}
.rp-erow .en .bar{margin:0}
.rp-erow .ev{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
.rp-erow .el{font-weight:600}
.rp-erow.rp-ehead{cursor:default;padding-top:0;padding-bottom:0}
.rp-erow.rp-ehead:hover{background:none}
.rp-erow.rp-ehead .ev{font-family:var(--sans);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600}
.rp-egrp{border-top:1px solid var(--line-soft);margin-top:6px;padding-top:6px}
.rp-erow.grp .en>.rp-nm>span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.rp-erow.grp .ev{font-weight:600}
.rp-prow{display:grid;grid-template-columns:1fr 52px 52px;gap:8px;align-items:center;padding:6px 8px}
.rp-prow .pn{min-width:0;display:flex;flex-direction:column;gap:4px;font-size:12px}
.rp-prow .pn>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-prow .pn em{color:var(--ink-soft);font-family:var(--mono);font-size:11px;font-style:normal}
.rp-prow .pn .bar{margin:0}
.rp-prow .pa{text-align:right;font-family:var(--mono);font-size:12.5px;font-weight:500}
.rp-prow .pd{display:flex;justify-content:flex-end}
.rp-rng-f{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.rp-rng-f .tf-row{flex:1;min-height:52px;cursor:pointer}
.rp-rng-f .tf-row.on{border-color:var(--pine);box-shadow:0 0 0 1px var(--pine);background:#F7FAF8}
.rp-rng-arr{color:var(--ink-soft);flex:none}
.tf-cal-grid.rp-mgrid{grid-template-columns:repeat(4,1fr);gap:4px}
.tf-cal-grid.rp-mgrid button{height:42px;font-family:var(--sans);font-size:13px;font-weight:500}
.rp-mgrid button:hover:not(.sel){background:#F1F6F3;color:var(--pine)}
.rp-mgrid button.in{background:#E6F0EB;color:var(--pine)}
.rp-rng-sum{font-size:12px;color:var(--ink-soft);margin-top:10px}

/* ---------- Mobile ---------- */
/* Nothing is hidden here any more. Where a column can't fit, its control moves
   into a sheet the tab bar can always reach — it doesn't vanish. */
@media(max-width:760px){
  .sidebar{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:auto;flex-direction:row;
    align-items:center;padding:6px 10px calc(14px + env(safe-area-inset-bottom));z-index:40}
  .sidebar .brand,.side-foot,.nav-sep,.nav.sub{display:none}
  .nav{flex-direction:row;flex:1;gap:0}
  .nav button{flex-direction:column;gap:4px;font-size:11.5px;padding:9px 4px;flex:1;
    align-items:center;min-width:0;border-radius:11px}
  /* Three wide tabs and a narrow More: the labels are legible instead of
     four-and-a-half squeezed 10px words. */
  .nav button[data-v="more"]{flex:0 0 64px}
  .nav button svg{width:21px;height:21px}
  .nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .main{margin-left:0;padding:0 0 110px}
  .topbar{padding:10px 16px 12px;gap:10px}
  .topbar h2{font-size:20px}
  .topbar .tb-left,.topbar .tb-right{width:100%;justify-content:space-between}
  /* No space switcher on this view: keep the actions on the right anyway. */
  .space-switch:empty + .actions{margin-left:auto}
  #viewBody{padding:12px 16px 0}
  .grid-3{grid-template-columns:1fr}
  .hero{padding:16px 18px}
  .hero .big{font-size:28px}
  .hero .row{gap:14px;justify-content:space-between}
  .tbl th:nth-child(4),.tbl td:nth-child(4){display:none}

  /* Register → a list. Category and account fold into the subtitle, the
     balance sits under the amount, and the row is 62px so nine fit. */
  .reg{border-radius:var(--r)}
  .tx-strip{padding:0 16px}
  .tx-strip .cell{padding:10px 14px}
  .tx-strip .cell b{font-size:14px}
  .tx-strip .right{width:100%;padding:0 0 10px;margin-left:0;justify-content:space-between}
  .flow{padding:12px 16px}
  .flow-bars{height:44px;gap:2px}
  .flow-legend span:last-child{display:none}
  .led-head,.led-bal,.led-cat,.led-acc,.led-note,.led-date,.led-row>span:last-child{display:none}
  .led-main .sub-m{display:block;max-width:100%;font-size:12.5px;color:var(--ink-soft);font-weight:400;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .led-row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:62px}
  .led-row>span{padding:0}
  /* No columns to line up with here — the phone's rows are flex. */
  .day-head.reg{display:flex;padding:8px 16px}
  .day-head.reg>*{padding:0}
  .led-clr{display:none}
  .led-main{flex:1;min-width:0;flex-direction:column;align-items:flex-start;gap:1px}
  .led-main .nm{display:none}
  .led-main .nm-m{font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .led-amt{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:15px}
  .led-amt .led-bal-m{display:block;font-family:var(--mono);font-size:11px;color:#9AAAA4;font-weight:400}
  .led-foot{padding:12px 16px 0}
  .fab{display:flex}

  /* Budget: a list of envelopes and what's in each. Tap one to budget it. */
  .alloc{display:block}
  .alloc .big{font-size:28px}
  .alloc .mid{margin:12px 0 0}
  .alloc-bar{height:7px}
  .alloc .stats{gap:10px 14px;justify-content:space-between}
  .alloc .lbl.sm{font-size:10px}
  .alloc .val{font-size:13.5px}
  .alloc .days{display:none}
  .bud-left{padding:12px 16px}
  .bud-left .big{font-size:20px}
  .budtable{padding:0 14px 8px}
  .bud-cols{display:none}
  .bgrp-head{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:10px 2px;background:#fff;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line)}
  .bgrp-head:first-child{border-top:none}
  .bgrp-name{flex:1}
  .bgrp-head .mini{display:none}
  .bgrp-head .num{font-size:12.5px;font-weight:600}
  .bgrp-head .benv-actions{gap:12px;align-items:center}
  .bgrp-head .sq{width:30px;height:30px;border-radius:8px;border-color:var(--line);background:#fff}
  .benv{display:flex;align-items:center;gap:12px;padding:10px 2px;min-height:54px}
  .binc{display:flex;align-items:center;gap:12px;padding:10px 2px;min-height:54px}
  .benv .benv-title,.binc .benv-title{flex:1}
  .benv-title b{font-size:15px}
  .benv-bar .bar{max-width:110px}
  .benv .num,.binc .num{font-size:15px}
  .benv .benv-actions,.binc .benv-actions{display:none}
  .statbox .v{font-size:13px}
  .debt-row .mini{display:none}
  .debt-row{padding:11px 2px}
  .acct-card{padding:4px 14px 8px}
  .acct-row{padding:12px 2px;min-height:60px}
  .acct-row .sq{width:38px;height:38px;border-radius:9px}
  .bar-seg{height:38px}
  .bar-seg b{min-width:64px;line-height:36px;font-size:13px}
  .bar-seg button{width:38px;height:36px;font-size:17px}
  .btn36{height:38px}
  .btn36.ic.only{width:38px}
  .space-wrap,.sp-btn{height:38px}
  .sp-pop{left:auto;right:0}
  .bar-hair{display:none}
  .tx-search{height:38px;width:100%}
  .rp-top{flex-direction:column;align-items:stretch}
  .rp-sum{justify-content:space-between}
  .rp-cmp{flex-direction:column;align-items:stretch;gap:6px}
  .rp-cmp .tf-seg button{flex:1;padding:8px 4px;overflow:hidden;text-overflow:ellipsis}
  .rp-ins{grid-template-columns:1fr}
  .rp-charts{flex-direction:column;align-items:stretch}
  .rp-crow{grid-template-columns:1fr 64px 56px}
  .rp-crow .cn{grid-column:1 / -1;padding-bottom:2px}
  .rp-erow{grid-template-columns:repeat(3,1fr)}
  .rp-erow .en{grid-column:1 / -1}
  .rp-erow.rp-ehead>span:first-child{display:none}
}

/* ---------- Mobile: 16px form fields (anything smaller makes iOS zoom on focus) ---------- */
@media(max-width:760px){
  input,select,textarea,
  .field input,.field select,.field textarea,
  .tx-search input,.sfield input,
  .space-switch select{font-size:16px}
  .amt-line input{font-size:32px}
}

/* ---------- Mobile: modals become bottom sheets ---------- */
@media(max-width:760px){
  #overlay{align-items:flex-end;justify-content:stretch;padding:0}
  .modal{max-width:none;width:100%;border-radius:20px 20px 0 0;
    max-height:88dvh;padding:6px 18px calc(16px + env(safe-area-inset-bottom));
    animation:sheetUp .22s cubic-bezier(.32,.72,0,1);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .modal::before{content:"";display:block;width:38px;height:4px;border-radius:99px;
    background:var(--line);margin:8px auto 14px;flex:none}
  .modal h3{font-size:18px}
  /* Keep Save reachable above the on-screen keyboard */
  .m-foot,.sheet-foot{position:sticky;bottom:0;z-index:3;background:#fff;
    margin-top:16px;padding-top:12px;padding-bottom:6px;box-shadow:0 -10px 14px -10px rgba(20,40,35,.18)}
  .m-foot .btn,.sheet-foot .btn{min-height:44px}
  .modal .chip,.modal .qchip{min-height:36px}
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}

/* ---------- Searchable, group-sectioned picker ---------- */
/* Opens inline rather than as an absolutely-positioned layer: the modal scrolls
   its own content, so a floating panel would be clipped by it. */
.combo{position:relative}
.combo-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#FAFBFA;
  font-size:15px;font-weight:500;color:var(--ink);text-align:left}
.combo-btn:hover{border-color:var(--pine)}
.combo-btn>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.combo-btn>span.soft{color:var(--ink-soft);font-weight:400}
.combo-btn em{font-style:normal;color:var(--ink-soft);flex:none;font-size:11px}
.combo.open .combo-btn{border-color:var(--pine);background:#fff}
.combo-pop{margin-top:6px;border:1px solid var(--line);border-radius:11px;background:#fff;
  box-shadow:0 10px 26px rgba(20,40,35,.14);overflow:hidden}
.combo-q{width:100%;border:none;border-bottom:1px solid var(--line-soft);padding:10px 12px;
  outline:none;font-size:15px;background:#fff}
.combo-list{max-height:236px;overflow-y:auto;overscroll-behavior:contain;padding:4px;
  -webkit-overflow-scrolling:touch}
.combo-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);
  font-weight:700;padding:10px 10px 4px;border-top:1px solid var(--line-soft);margin-top:4px}
.combo-list>.combo-sec:first-child{border-top:none;margin-top:0;padding-top:6px}
.combo-opt{width:100%;display:flex;align-items:baseline;justify-content:space-between;gap:10px;text-align:left;padding:9px 10px;border:none;background:none;
  border-radius:8px;font-size:14.5px;color:var(--ink)}
.combo-opt>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.combo-opt em{flex:none;font-style:normal;font-family:var(--mono);font-size:11px;color:#9AAAA4;font-weight:400}
.combo-opt.on em{color:rgba(255,255,255,.75)}
.combo-opt:hover{background:#F1F6F3;color:var(--pine)}
.combo-opt.on{background:var(--pine);color:#fff;font-weight:600}
.combo-none{padding:16px 12px;font-size:13px;color:var(--ink-soft);text-align:center}
@media(max-width:760px){
  .combo-btn,.combo-q{font-size:16px}
  .combo-opt{padding:12px 10px;font-size:16px}
  .combo-list{max-height:min(44dvh,300px)}
}

/* ---------- Mobile composer: full-screen, amount-first with a numeric pad ---------- */
.tf-wrap,.tf-sub{position:fixed;inset:0;z-index:55;background:#fff;display:flex;flex-direction:column}
.tf-top{flex:none;padding:calc(16px + env(safe-area-inset-top)) 18px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:6}
.tf-icon{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
.tf-seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.tf-seg button{padding:8px 14px;border:none;background:#fff;font-weight:600;font-size:12.5px;color:var(--ink-soft);font-family:var(--sans)}
.tf-seg button.on{background:var(--pine);color:#fff}

/* ============ REST ============ */
async function rest(path, { method = "GET", body, headers = {} } = {}, retried = false) {
  await ensureFresh();
  let r;
  try {
    r = await fetch(`${SB_URL}/rest/v1/${path}`, {
      method,
      headers: {
        apikey: SB_KEY,
        Authorization: `Bearer ${session.access_token}`,
        "Content-Type": "application/json",
        Prefer: "return=representation",
        ...headers
      },
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (netErr) {
    throw Object.assign(new Error("Can’t reach the server — check your connection."), { offline: true });
  }
  if (r.status === 401 && !retried) {                 // token rejected: renew once, then retry
    await refreshSession();
    return rest(path, { method, body, headers }, true);
  }
  if (r.status === 204) return null;
  const data = await r.json().catch(() => null);
  if (!r.ok) throw Object.assign(new Error((data && (data.message || data.hint)) || `Request failed (${r.status})`), { status: r.status });
  return data;
}

/* ============ State ============ */
const S = { accounts: [], groups: [], cats: [], txs: [], holdings: [], invtx: [], budgets: [], view: "budget", budgetMonth: ym(new Date()), txFilter: { account: "", kind: "all", budget: "all", q: "", uncleared: false }, txMonth: ym(new Date()), budOpen: {}, debts: [], spaces: [], activeSpace: store.get("space") || "all", flowOpen: false };

async function loadAll() {
  const [accounts, groups, cats, txs, holdings, invtx, debts, spaces] = await Promise.all([
    rest("accounts?select=*&order=sort_order,created_at"),
    rest("category_groups?select=*&order=is_income,sort_order"),
    rest("categories?select=*&order=sort_order,name"),
    rest("transactions?select=*&order=date.desc,created_at.desc&limit=2000"),
    rest("holdings?select=*&order=created_at"),
    rest("investment_transactions?select=*&order=date.desc,created_at.desc&limit=2000"),
    rest("debts?select=*&order=created_at.desc"),
    rest("spaces?select=*&order=sort_order,created_at")
  ]);
  Object.assign(S, { accounts, groups, cats, txs, holdings, invtx, debts, spaces });
  if (S.groups.length === 0 && S.cats.length === 0 && S.txs.length === 0 && S.accounts.length === 0) { await seedDefaults(); return loadAll(); }
  if (S.spaces.length === 0) {
    S.spaces = await rest("spaces", { method: "POST", body: { name: "Personal", sort_order: 0 } });
  }
  const homeId = S.spaces[0].id;
  if (S.groups.some(g => !g.space_id) || S.txs.some(t => !t.space_id)) {
    await Promise.all([
      rest("category_groups?space_id=is.null", { method: "PATCH", body: { space_id: homeId } }),
      rest("transactions?space_id=is.null", { method: "PATCH", body: { space_id: homeId } })
    ]);
    S.groups.forEach(g => { if (!g.space_id) g.space_id = homeId; });
    S.txs.forEach(t => { if (!t.space_id) t.space_id = homeId; });
  }
  if (S.activeSpace !== "all" && !S.spaces.some(s => s.id === S.activeSpace)) S.activeSpace = S.spaces[0].id;
  await ensureSystemCats();
}

/* Every space owns a set of undeletable categories. Money that moves for
   structural reasons — an opening balance, a loan going out or coming back —
   lands in one of these instead of carrying a bare, category-less flag.
   They live in the space's income group but sit outside income totals: both
   run in either direction (a card's opening balance is negative, lending money
   out is negative) so neither is earnings. */
const SYSTEM_CATS = [
  { key: "opening", name: "Starting Balance" },
  { key: "debt",    name: "Debt" }
];
const SYSTEM_CAT_NAME = SYSTEM_CATS[0].name;
function spaceOfGroup(gid) { return S.groups.find(g => g.id === gid)?.space_id || null; }
function systemNames(cats) {
  const n = cats.filter(c => c.is_system).map(c => `“${c.name}”`);
  return n.length > 1 ? n.slice(0, -1).join(", ") + " and " + n[n.length-1] : (n[0] || "");
}
function systemCat(spaceId, key = "opening") {
  return S.cats.find(c => c.is_system && c.system_key === key && spaceOfGroup(c.group_id) === spaceId) || null;
}
async function ensureSystemCats() {
  for (const sp of S.spaces) {
    const missing = SYSTEM_CATS.filter(sc => !systemCat(sp.id, sc.key));
    if (!missing.length) continue;
    let grp = S.groups.find(g => g.space_id === sp.id && g.is_income);
    if (!grp) {
      grp = (await rest("category_groups", { method: "POST",
        body: { name: "Income", is_income: true, sort_order: 0, space_id: sp.id } }))[0];
      S.groups.push(grp);
    }
    for (const sc of missing) {
      const created = await rest("categories", { method: "POST",
        body: { group_id: grp.id, name: sc.name, is_income: true, sort_order: -1, is_system: true, system_key: sc.key } });
      S.cats.push(created[0]);
    }
  }
}
/* All of them, not a window: a rollover envelope's balance is the whole chain
   of months behind it, so a 4-month slice can't tell you what's in it. One row
   per category per budgeted month — small enough to just hold. */

async function seedDefaults() {
  const mk = (name, is_income, i) => ({ name, is_income, sort_order: i });
  const groups = await rest("category_groups", { method: "POST", body: [
    mk("Income", true, 0), mk("Essentials", false, 1), mk("Lifestyle", false, 2), mk("Savings & Goals", false, 3)
  ]});

    cat("Lifestyle","Eating out & coffee",false,0), cat("Lifestyle","Shopping",false,1),
    cat("Lifestyle","Entertainment",false,2), cat("Lifestyle","Health & fitness",false,3),

/* ============ Helpers ============ */
function ym(d) { const x = d instanceof Date ? d : new Date(d + "T00:00:00"); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`; }
function monthLabel(m) { const [y,mo] = m.split("-"); return new Date(+y, +mo-1, 1).toLocaleDateString("en-GB", { month: "short", year: "numeric" }); }
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function fmt(n, cur = "VND") {
  const v = Number(n) || 0;
  try { return new Intl.NumberFormat(cur === "VND" ? "vi-VN" : "en-US", { style: "currency", currency: cur, maximumFractionDigits: cur === "VND" ? 0 : 2 }).format(v); }
  catch(e) { return v.toLocaleString() + " " + cur; }
}
function fmtSigned(n, cur) { const v = Number(n)||0; return (v > 0 ? "+" : "") + fmt(v, cur); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function el(id) { return document.getElementById(id); }
function toast(msg, ms = 2600) { const t = el("toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.add("hidden"), ms); }
function accBalance(a) { return (Number(a.starting_balance) || 0) + S.txs.filter(t => t.account_id === a.id).reduce((s,t) => s + Number(t.amount), 0); }
/* Accounts whose money the budget can assign — set per account, not guessed
   from its type. A credit card left on budget contributes a negative balance,
   which correctly reduces what there is left to budget. */
function onBudgetAccounts() { return S.accounts.filter(a => !a.is_closed && a.on_budget !== false); }
function budgetFunds() { return onBudgetAccounts().reduce((s,a) => s + accBalance(a), 0); }
function catName(id) { const c = S.cats.find(c => c.id === id); return c ? c.name : "—"; }
function accName(id) { const a = S.accounts.find(a => a.id === id); return a ? a.name : "?"; }
const CUR = () => (S.accounts[0]?.currency) || "VND";

/* ============ Modal (bottom sheet on mobile) ============ */
function openModal(html) {
  const box = el("modalBox");
  box.innerHTML = html;
  box.scrollTop = 0;
  box.style.transition = ""; box.style.transform = "";   // clear a previous drag
  el("overlay").classList.remove("hidden");
  document.body.classList.add("modal-open");   // stop the page scrolling behind the sheet
}
function closeModal() {
  closeCombos(); closeInfo(); closeMenu();
  el("overlay").classList.add("hidden");
  document.body.classList.remove("modal-open");
}
/* Only a tap that starts *and* ends on the backdrop dismisses — dragging a
   sheet or a slider used to close the modal by accident on touch. */
let backdropDown = false;
el("overlay").addEventListener("pointerdown", e => { backdropDown = e.target.id === "overlay"; });
el("overlay").addEventListener("click", e => { if (backdropDown && e.target.id === "overlay") closeModal(); backdropDown = false; });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  // Each layer swallows one Escape, innermost first, so dismissing a picker
  // doesn't take the sheet it's sitting in with it.
  if (infoOpen) return closeInfo();
  if (menuOpen) return closeMenu();
  if (closeEdPop()) return;
  if (document.querySelector(".combo.open")) return closeCombos();
  if (!el("overlay").classList.contains("hidden")) return closeModal();
  if (txOpen) closeTxForm();      // the inline transaction form dismisses the same way
});

/* Flick the sheet down to dismiss it. Starts only when the sheet is already
   scrolled to the top and the finger is heading down, so it never competes with
   scrolling the form or a picker's list. */
(() => {
  const box = el("modalBox");
  const DISMISS = 110;                       // px of travel that counts as "close it"
  let y0 = null, dragging = false, dy = 0;
  const scrollableUnder = target => {
    for (let n = target; n && n !== box; n = n.parentElement)
      if (n.scrollHeight > n.clientHeight + 1 && /auto|scroll/.test(getComputedStyle(n).overflowY)) return true;
    return false;
  };
  box.addEventListener("touchstart", e => {
    if (!isPhone() || e.touches.length !== 1 || scrollableUnder(e.target)) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; dragging = false;
  }, { passive: true });
  box.addEventListener("touchmove", e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (!dragging) {
      if (dy > 6 && box.scrollTop <= 0) { dragging = true; box.style.transition = "none"; }
      else if (dy < -4 || box.scrollTop > 0) { y0 = null; return; }   // that's a scroll
      else return;
    }
    e.preventDefault();
    box.style.transform = `translateY(${Math.max(0, dy)}px)`;
  }, { passive: false });
  const release = () => {
    if (y0 === null) return;
    const travelled = dy, was = dragging;
    y0 = null; dragging = false;
    if (!was) return;
    box.style.transition = "transform .2s cubic-bezier(.32,.72,0,1)";
    if (travelled > DISMISS) {
      box.style.transform = "translateY(100%)";
      setTimeout(() => { closeModal(); box.style.transition = ""; box.style.transform = ""; }, 190);
    } else box.style.transform = "";
  };
  box.addEventListener("touchend", release);
  box.addEventListener("touchcancel", release);
})();

/* ============ Searchable picker ============ */
/* `sections` is [{ name, items:[{id, name}] }]. A native <select> can group but
   can't filter, and iOS turns a long one into a wheel you have to spin. */
function comboHTML(id, sections, selId, emptyLabel) {
  const cur = sections.flatMap(s => s.items).find(i => i.id === selId);
  return `<div class="combo" id="${id}" data-sel="${esc(selId || "")}">
    <button type="button" class="combo-btn"><span${cur ? "" : ' class="soft"'}>${esc(cur ? cur.name : emptyLabel)}</span><em>▾</em></button>
    <div class="combo-pop hidden">
      <input class="combo-q" placeholder="Search…" autocomplete="off" spellcheck="false">
      <div class="combo-list"></div>
    </div></div>`;
}
/* `opts.hint(id)` puts a short note at the right of each option (how much is
   left in an envelope); `opts.lead` is a list of items shown first, under
   "Most used", while nothing has been typed. */
function wireCombo(id, sections, emptyLabel, onPick, opts = {}) {
  const root = el(id); if (!root) return;
  const btn = root.querySelector(".combo-btn"), pop = root.querySelector(".combo-pop");
  const q = root.querySelector(".combo-q"), list = root.querySelector(".combo-list");
  const label = btn.querySelector("span");
  const all = () => sections.flatMap(s => s.items);

  const paint = () => {
    const term = q.value.trim().toLowerCase(), cur = root.dataset.sel;
    const rows = [];
    const opt = i => {
      const h = opts.hint ? opts.hint(i.id) : "";
      return `<button type="button" class="combo-opt ${cur === i.id ? "on" : ""}" data-pick="${i.id}"><span>${esc(i.name)}</span>${h ? `<em>${esc(h)}</em>` : ""}</button>`;
    };
    if (!term || emptyLabel.toLowerCase().includes(term))
      rows.push(`<button type="button" class="combo-opt ${cur ? "" : "on"}" data-pick=""><span>${esc(emptyLabel)}</span></button>`);
    if (!term && opts.lead?.length) {
      rows.push(`<div class="combo-sec">Most used</div>`);
      opts.lead.forEach(i => rows.push(opt(i)));
    }
    sections.forEach(s => {
      // Matching the group name too, so "essentials" surfaces the whole section.
      const hits = s.items.filter(i => !term || i.name.toLowerCase().includes(term) || s.name.toLowerCase().includes(term));
      if (!hits.length) return;
      rows.push(`<div class="combo-sec">${esc(s.name)}</div>`);
      hits.forEach(i => rows.push(opt(i)));
    });
    list.innerHTML = rows.length ? rows.join("")
      : `<div class="combo-none">Nothing matches “${esc(q.value.trim())}”</div>`;
    list.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
      const v = b.dataset.pick || null;
      root.dataset.sel = v || "";
      const it = all().find(x => x.id === v);
      label.textContent = it ? it.name : emptyLabel;
      label.className = it ? "" : "soft";
      close();
      onPick(v);
    });
  };
  const open = () => {
    closeCombos();
    root.classList.add("open"); pop.classList.remove("hidden");
    q.value = ""; paint();
    if (!isPhone()) q.focus();          // on a phone, don't force the keyboard up
    pop.scrollIntoView({ block: "nearest" });
  };
  const close = () => { root.classList.remove("open"); pop.classList.add("hidden"); };
  btn.onclick = () => pop.classList.contains("hidden") ? open() : close();
  q.oninput = paint;
  q.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); list.querySelector("[data-pick]")?.click(); } };
  root.onclick = e => e.stopPropagation();   // a click inside must not dismiss it
}
function closeCombos() {
  document.querySelectorAll(".combo.open").forEach(c => {
    c.classList.remove("open"); c.querySelector(".combo-pop")?.classList.add("hidden");
  });
}
document.addEventListener("click", closeCombos);

function parseNum(v) {
  if (typeof v !== "string") return Number(v) || 0;
  v = v.trim().replace(/[^\d.,\-]/g, "");
  if (!v) return 0;
  const lastDot = v.lastIndexOf("."), lastCom = v.lastIndexOf(",");
  if (lastDot > -1 && lastCom > -1) {
    if (lastCom > lastDot) v = v.replace(/\./g, "").replace(",", ".");   // 1.234,56
    else v = v.replace(/,/g, "");                                          // 1,234.56
  } else if (lastCom > -1) {
    const parts = v.split(","), dec = v.length - lastCom - 1;
    v = (parts.length === 2 && dec > 0 && dec < 3) ? v.replace(",", ".") : v.replace(/,/g, "");
  } else if (lastDot > -1) {
    const parts = v.split("."), dec = v.length - lastDot - 1;
    if (!(parts.length === 2 && dec > 0 && dec < 3)) v = v.replace(/\./g, ""); // 10.000 = ten thousand
  }
  return Number(v) || 0;
}
