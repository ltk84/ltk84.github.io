    }
    closeModal(); toast("Account saved"); refresh();
  });
  if (a) el("fDel").onclick = async () => {
    if (!confirm("Delete this account and all its transactions?")) return;
    await rest(`accounts?id=eq.${a.id}`, { method: "DELETE" }); closeModal(); toast("Account deleted"); refresh();
  };
}

/* ============ Transaction form ============ */
/* Two shapes over one piece of state. On a desktop the composer is the register
   row itself, on the register's own columns; on a phone there are no columns to
   align to, so it's a sheet with the amount first and everything else a 52px
   labelled button. `txOpen` holds which transaction it edits (null = a new one)
   and the half-typed values, so the ledger can repaint — search, a filter, a
   save — without the form losing its place. */
let txOpen = null;
let repaintLedger = null;
// Which of the register's inline dropdowns (Kind / Budget / Account) is open,
// and the repaint hook for that row — mirrors txOpen/repaintLedger above.
let filtOpen = null;
let repaintFilter = null;
document.addEventListener("click", e => {
  if (filtOpen && !e.target.closest(".filt-dd")) { filtOpen = null; if (repaintFilter) repaintFilter(); }
});

function txForm(t) {
  if (!S.accounts.length) { toast("Add an account first"); return accForm(); }
  const openAcc = S.accounts.filter(a => !a.is_closed);
  const acc = t?.account_id || openAcc[0]?.id;
  txOpen = {
    id: t?.id || null,
    kind: t ? (t.transfer_account_id ? "transfer" : (+t.amount > 0 ? "income" : "expense")) : "expense",
    fresh: true,                      // scroll it into view once it's mounted
    split: null,                      // [{ person, amount }] — see splitForm
    pop: null, cal: null,             // desktop row: which picker panel is open, and the month it shows
    st: {
      space: t?.space_id || (S.activeSpace !== "all" ? S.activeSpace : S.spaces[0]?.id),
      amount: t ? Math.abs(+t.amount) : 0,
      cat: t?.category_id || null,    // no guessed default — you pick it
      acc,
      to: t?.transfer_account_id || openAcc.find(a => a.id !== acc)?.id || null,
      date: t?.date || todayISO(),
      payee: t?.payee || "", notes: t?.notes || "",
      cleared: t ? !!t.cleared : false
    }
  };
  if (isPhone()) return txComposer();
  // The inline form only exists inside the ledger, so anywhere else goes there first.
  if (repaintLedger) repaintLedger(); else go("transactions");
}

function closeTxForm() { closeCombos(); txOpen = null; tfHide(); if (repaintLedger) repaintLedger(); }

/* The composer is dismissed by esc and by its own ✕, and by nothing else. It
   used to close on any click outside itself, which cost more than it gave: the
   controls that rebuild the row — the sign button above all — take their own
   node out of the DOM before a document-level listener sees the click, and a
   detached node is outside everything, so pressing − to switch to income closed
   the composer instead of switching it. */

/* Every category in the transaction's space, whichever way its money moves.
   Filtering the list by the row's sign meant the only way to reach an income
   category was to find the sign button first; now picking one out of an income
   group is itself how you say "this is income", and `kindForCat` flips the row
   to match. Space is the one thing that still narrows the list — a category
   belongs to one space and can't be spent from another. */
function txCatSections(st) {
  const sgset = new Set(S.groups.filter(g => g.space_id === st.space).map(g => g.id));
  const catList = S.cats.filter(c => sgset.size === 0 || sgset.has(c.group_id));
  if (st.cat && !catList.some(c => c.id === st.cat)) st.cat = null;
  return S.groups
    .map(g => ({ name: g.name, items: catList.filter(c => c.group_id === g.id).map(c => ({ id: c.id, name: c.name })) }))
    .filter(s => s.items.length);
}
/* Which way a category says the money moves. Built-in categories leave the sign
   alone, because they genuinely run both ways: an opening balance is income on
   a bank account and an expense on a credit card, and lending money out is
   negative where the repayment coming back is not. */
function kindForCat(id, kind) {
  const c = S.cats.find(x => x.id === id);
  if (!c || c.is_system || kind === "transfer") return kind;
  return S.groups.find(g => g.id === c.group_id)?.is_income ? "income" : "expense";
}
/* Picking a payee you've used before fills in the category you filed it under
   last time — the same shortcut the desktop register's autocomplete gives. */
/* Debt movements carry the person's name as the payee, so they have to be
   skipped: typing a friend you've covered for would otherwise fill in the
   built-in Debt category and flip the row to income. */
function lastCatFor(payee) {
  const p = (payee || "").trim().toLowerCase();
  if (!p) return null;
  const hit = S.txs.find(t => (t.payee || "").trim().toLowerCase() === p && t.category_id && !t.transfer_account_id && !isDebtTx(t));
  return hit?.category_id || null;
}
function recentPayees() {
  return [...new Set(S.txs.filter(x => !x.opening).map(x => x.payee).filter(p => p && !/^Transfer /.test(p)))].slice(0, 12);
}

/* Fronting a bill for other people is one payment out of your account but two
   different things: your own share, which is spending, and their share, which
   is a loan you expect back. Logging it as one expense overstates every
   category it touches; logging only your share leaves the account short. So
   the composer writes both lines from one entry — the categorised share, and a
   debt for the rest — and the account still falls by the full amount. */
/* Both shapes write a list of { person, amount }; an older single object is
   still read as a list of one, so saveTx only ever deals with a list. */
function splitState() {
  if (txOpen?.kind !== "expense" || txOpen.id) return null;
  const sp = txOpen.split;
  if (!sp) return null;
  return Array.isArray(sp) ? sp : [sp];
}
/* The split as a list whatever its shape, for display. */
function splitList() {
  const sp = txOpen?.split;
  return Array.isArray(sp) ? sp : (sp ? [sp] : []);
}
/* Everyone's slice of the bill, you last, each with its colour — the bar and
   legend on the split card, the split screen and the desktop sheet. */
function splitParts(list, total) {
  const mine = Math.max(0, total - list.reduce((s,x) => s + x.amount, 0));
  return [...list.map((s,i) => ({ label: s.person, amount: s.amount, color: SPLIT_COLORS[i % SPLIT_COLORS.length] })),
    { label: "You", amount: mine, color: "var(--pine)" }];
}
function splitBarHtml(parts, total) {
  const t = Math.max(1, total);
  return `<span class="tf-split-bar">${parts.map(p => `<i style="width:${p.amount/t*100}%;background:${p.color}"></i>`).join("")}</span>`;
}
/* The card that stands for a split once it's set: title, bar, legend. */
function splitCardInner(list, total) {
  const parts = splitParts(list, total);
  return `<span class="tf-split-head"><span class="tf-split-ic">${SPLIT_IC}</span>
      <span class="tf-split-title">Split · ${list.length + 1} people</span><em class="tf-chev">▾</em></span>
    ${splitBarHtml(parts, total)}
    <span class="tf-split-legend">${parts.map(p => `<span class="li"><i style="background:${p.color}"></i><span>${esc(p.label)}</span><b>${nf0.format(p.amount)}</b></span>`).join("")}</span>`;
}

/* Desktop's split: the phone's split screen as a sheet. Several people, each
   with their own share, the same Even / All theirs / Clear shortcuts and the
   same owed-to-you summary; shares are typed instead of keyed on a pad. */
function splitForm(after) {
  const total = txOpen.st.amount;
  const cur = CUR(); const isVND = cur === "VND";
  const fmtAmt = v => !v ? "" : (isVND ? nf0.format(v) : String(v));
  const parse = v => Number(v.replace(isVND ? /[^\d]/g : /[^\d.]/g, "")) || 0;
  const work = splitList().map(s => ({ ...s }));
  // `sel` is the share "All theirs" fills; `adding` shows the name field.
  const ui = { sel: work.length - 1, adding: !work.length };

  openModal(`<div id="spBody"></div>`);
  const summaryHtml = () => {
    const owed = work.reduce((s,x) => s + x.amount, 0);
    const parts = splitParts(work, total);
    const err = work.some(s => s.amount) ? splitListCheck(total, work.filter(s => s.amount)) : null;
    return `<div class="r"><span>Owed to you</span><span style="font-family:var(--mono)">${fmt(owed,cur)}</span></div>
      <div class="r strong"><span>Your share</span><span>${fmt(parts[parts.length-1].amount,cur)}</span></div>
      ${splitBarHtml(parts, total)}
      ${err ? `<div class="spd-err">${esc(err)}</div>` : ""}`;
  };
  const render = () => {
    const known = [...new Set([...debtPeople().map(p => p.name), ...recentPayees()])]
      .filter(n => !work.some(s => s.person.trim().toLowerCase() === n.trim().toLowerCase())).slice(0, 8);
    el("spBody").innerHTML = `
      <div class="spd-head"><h3>Split</h3>
        <span class="tf-num"><b>${nf0.format(total)}</b><span>${isVND ? "₫" : esc(cur)}</span></span></div>
      <div class="m-sub">${fmt(total,cur)} leaves your account either way. Their shares become debts instead of spending, so only your share reaches a category.</div>
      <div class="spd-list">
        ${work.map((s,i) => `<div class="tf-person spd-person${ui.sel===i?" sel":""}" data-persel="${i}">
          <i class="sw" style="background:${SPLIT_COLORS[i % SPLIT_COLORS.length]}"></i>
          <span class="nm">${esc(s.person)}</span>
          <input class="spd-amt" data-amt="${i}" inputmode="${isVND?"numeric":"decimal"}" placeholder="0" value="${fmtAmt(s.amount)}" aria-label="${esc(s.person)}'s share">
          <span class="spd-cur">${isVND ? "₫" : esc(cur)}</span>
          <button type="button" class="spd-x" data-rm="${i}" title="Remove ${esc(s.person)}" aria-label="Remove ${esc(s.person)}">✕</button></div>`).join("")}
        ${ui.adding ? `<div class="spd-add">
            <input id="spdName" placeholder="Who owes you? e.g. Minh" autocomplete="off" spellcheck="false">
            <button type="button" class="btn btn-primary" id="spdAddOk">Add</button>
            ${work.length ? `<button type="button" class="btn btn-ghost" id="spdAddX">Cancel</button>` : ""}</div>
          ${known.length ? `<div class="tf-quick-people">${known.map(n => `<button type="button" data-qp="${esc(n)}">${esc(n)}</button>`).join("")}</div>` : ""}`
          : `<button type="button" class="tf-ghost-add" id="spdAdd"><span class="plus">+</span>Add someone</button>`}
      </div>
      ${work.length ? `<div class="tf-split-chips">
        <button type="button" id="spdEven">Even ${work.length + 1} ways</button>
        <button type="button" id="spdAll">All theirs</button>
        <button type="button" id="spdClear">Clear</button></div>` : ""}
      <div class="tf-split-sum" id="spdSum">${summaryHtml()}</div>
      <div class="m-foot">
        ${txOpen.split ? `<button class="btn btn-ghost" id="spOff" style="color:var(--neg);margin-right:auto">Remove split</button>` : ""}
        <button class="btn btn-ghost" id="spCancel">Cancel</button>
        <button class="btn btn-primary" style="width:auto" id="spSave">Done</button></div>`;
    wire();
  };
  const focusAmt = i => { const a = document.querySelector(`[data-amt="${i}"]`); if (a) { a.focus(); a.select(); } };
  const wire = () => {
    const add = name => {
      name = (name || "").trim(); if (!name) return;
      if (work.some(s => s.person.trim().toLowerCase() === name.toLowerCase())) return toast(`${name} is already in the split`);
      work.push({ person: name, amount: 0 });
      ui.sel = work.length - 1; ui.adding = false; render(); focusAmt(ui.sel);
    };
    const nm = el("spdName");
    if (nm) {
      nm.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); add(nm.value); } };
      el("spdAddOk").onclick = () => add(nm.value);
      const x = el("spdAddX"); if (x) x.onclick = () => { ui.adding = false; render(); };
      document.querySelectorAll("#spBody [data-qp]").forEach(b => b.onclick = () => add(b.dataset.qp));
    }
    const addBtn = el("spdAdd"); if (addBtn) addBtn.onclick = () => { ui.adding = true; render(); el("spdName").focus(); };
    document.querySelectorAll("#spBody [data-amt]").forEach(inp => {
      const i = +inp.dataset.amt;
      inp.onfocus = () => { if (ui.sel === i) return; ui.sel = i;
        document.querySelectorAll("#spBody [data-persel]").forEach(r => r.classList.toggle("sel", +r.dataset.persel === i)); };
      inp.oninput = () => { work[i].amount = parse(inp.value); inp.value = fmtAmt(work[i].amount); el("spdSum").innerHTML = summaryHtml(); };
      // ⏎ moves to the next share, and on the last one it's Done.
      inp.onkeydown = e => { if (e.key !== "Enter") return; e.preventDefault();
        if (i < work.length - 1) focusAmt(i + 1); else el("spSave").click(); };
    });
    document.querySelectorAll("#spBody [data-persel]").forEach(r => r.onclick = e => {
      if (e.target.closest("input, button")) return;
      focusAmt(+r.dataset.persel);
    });
    document.querySelectorAll("#spBody [data-rm]").forEach(b => b.onclick = () => {
      work.splice(+b.dataset.rm, 1);
      ui.sel = Math.min(ui.sel, work.length - 1);
      if (!work.length) ui.adding = true;
      render();
    });
    const chip = (id, fn) => { const b = el(id); if (b) b.onclick = () => { fn(); render(); focusAmt(Math.max(0, ui.sel)); }; };
    chip("spdEven", () => { const share = Math.floor(total / (work.length + 1)); work.forEach(s => s.amount = share); });
    chip("spdAll", () => { if (ui.sel < 0) ui.sel = work.length - 1;
      const others = work.reduce((s,x,i) => i === ui.sel ? s : s + x.amount, 0); work[ui.sel].amount = Math.max(0, total - others); });
    chip("spdClear", () => work.forEach(s => s.amount = 0));
    const off = el("spOff"); if (off) off.onclick = () => { txOpen.split = null; after(); };
    el("spCancel").onclick = () => after();
    el("spSave").onclick = () => {
      // Anyone left at zero simply isn't in the split.
      const list = work.filter(s => s.amount).map(s => ({ person: s.person.trim(), amount: s.amount }));
      if (!list.length) {
        if (work.length) return toast("Enter at least one share");
        txOpen.split = null; return after();
      }
      const err = splitListCheck(total, list);
      if (err) return toast(err);
      txOpen.split = list;
      after();
    };
  };
  render();
  if (ui.adding) el("spdName").focus(); else focusAmt(ui.sel);
}

/* The one place a transaction is written. `again` keeps the composer open with
   the date and account still filled, so a grocery run is a few taps each. */
async function saveTx(again) {
  const { st, kind } = { st: txOpen.st, kind: txOpen.kind };
  const t = txOpen.id ? S.txs.find(x => x.id === txOpen.id) : null;
  if (!st.amount) return toast("Enter an amount");
  if (kind === "transfer") {
    if (!st.to || st.to === st.acc) return toast("Choose two different accounts");
    if (t) return toast("Edit not supported for transfers — delete and re-create");
    await rest("transactions", { method: "POST", body: [
      { account_id: st.acc, date: st.date, amount: -st.amount, payee: `Transfer to ${accName(st.to)}`, transfer_account_id: st.to, notes: st.notes || null, cleared: st.cleared, space_id: st.space },
      { account_id: st.to, date: st.date, amount: st.amount, payee: `Transfer from ${accName(st.acc)}`, transfer_account_id: st.acc, notes: st.notes || null, cleared: st.cleared, space_id: st.space }
    ]});
  } else {
    const body = { account_id: st.acc, date: st.date, amount: kind === "income" ? st.amount : -st.amount,
      category_id: st.cat || null, payee: st.payee || null, notes: st.notes || null, cleared: st.cleared, space_id: st.space };
    const sp = splitState();
    if (t) await rest(`transactions?id=eq.${t.id}`, { method: "PATCH", body });
    else if (sp) {
      const err = splitListCheck(st.amount, sp);
      if (err) return toast(err);
      const mine = st.amount - sp.reduce((s,x) => s + x.amount, 0);
      /* One debt per person, all written up front so the account can never be
         left holding half a bill if a later insert fails. */
      const createdDebts = await Promise.all(sp.map(s => rest("debts", { method: "POST", body: {
        person: s.person, direction: "lent", notes: st.payee || st.notes || null } })));
      const rows = sp.map((s,i) => ({ ...body, amount: -s.amount, debt_id: createdDebts[i][0].id, payee: s.person,
        category_id: systemCat(st.space, "debt")?.id || null,
        notes: [st.payee ? `Covered at ${st.payee}` : "Covered", st.notes || null].filter(Boolean).join(" — ") }));
      if (mine > 0) rows.unshift({ ...body, amount: -mine, debt_id: null });
      await rest("transactions", { method: "POST", body: rows });
    }
    else await rest("transactions", { method: "POST", body });
  }
  await loadAll();
  const phone = isPhone();
  const wasSplit = splitState();
  if (again) { txOpen.id = null; st.amount = 0; st.payee = ""; st.notes = ""; txOpen.split = null; txOpen.pop = null; txOpen.fresh = true; toast("Saved — next one"); }
  else {
    txOpen = null; closeModal(); tfHide();
    toast(wasSplit
      ? (wasSplit.length === 1 ? `Saved · ${wasSplit[0].person} owes you ${fmt(wasSplit[0].amount, CUR())}` : `Saved · split ${wasSplit.length} ways`)
      : "Saved");
  }
  if (phone && txOpen) { go(S.view); txComposer(); } else go(S.view);
}

async function deleteTx(id) {
  if (!confirm("Delete this transaction?")) return;
  await rest(`transactions?id=eq.${id}`, { method: "DELETE" });
  txOpen = null; closeModal(); tfHide(); toast("Transaction deleted"); refresh();
}

/* ---- Desktop: the register row becomes the editor ---- */
/* Every cell sits in the column it belongs to, so there is no second line any
   more — the sign words, the +10k chips, the space picker and the keyboard
   legend that used to live there have each found a home of their own. The
   date, account and space cells open the same panels the phone composer does
   (calPopInner / accPopInner / spacePopInner) rather than the browser's own
   date field and <select>s, so both shapes pick things the same way. */

/* One of those panels is open at a time; txOpen.pop names it. Closing one only
   takes the panel out of the DOM, so a click into another field keeps its caret. */
function closeEdPop() {
  if (!txOpen?.pop) return false;
  txOpen.pop = null;
  document.querySelectorAll(".led-row.edit .ed-pop:not(.ed-sugg)").forEach(n => n.remove());
  document.querySelectorAll(".led-row.edit .ed-pick.open").forEach(n => n.classList.remove("open"));
  return true;
}
document.addEventListener("click", e => {
  if (txOpen?.pop && !e.target.closest(".ed-dd")?.querySelector(".ed-pop:not(.ed-sugg)")) closeEdPop();
});

function mountTxForm() {
  const host = el("txInline");
  if (!host || !txOpen) return;
  const t = txOpen.id ? S.txs.find(x => x.id === txOpen.id) : null;
  if (txOpen.id && !t) { txOpen = null; return; }     // it was deleted underneath us
  const openAcc = S.accounts.filter(a => !a.is_closed);
  const cur = CUR(); const isVND = cur === "VND";
  const st = txOpen.st;
  const fmtAmt = v => !v ? "" : (isVND ? nf0.format(v) : String(v));
  /* An existing transfer can't be re-typed and an existing ordinary
     transaction can't become one, so the cycle skips transfer while editing. */
  const KINDS = t ? ["expense", "income"] : ["expense", "income", "transfer"];
  const lockedKind = !!(t && t.transfer_account_id);
  const SIGN = { expense: "−", income: "+", transfer: "⇄" };
  let catSections = [];             // rebuilt by render(), consumed by wire()
  if (!txOpen.cal) txOpen.cal = calOf(st.date);
  // The payee's suggestion list: which row the arrow keys are on, and whether
  // the next focus should leave it shut (right after a pick).
  const sugg = { hl: -1, names: [], quiet: false };

  const render = () => {
    const kind = txOpen.kind;
    const pop = txOpen.pop;
    catSections = txCatSections(st);
    const pick = (id, key, label, val, placeholder) => `<button type="button" class="ed-pick${pop===key?" open":""}" id="${id}" data-edpop="${key}" title="${label}">
      <span${val ? "" : ' class="soft"'}>${esc(val || placeholder || "")}</span><em>▾</em></button>`;
    const panel = (key, inner, cls = "") => pop === key ? `<div class="tf-pop ed-pop ${cls}">${inner}</div>` : "";
    const accPanel = key => panel(key, accPopInner({
      selId: key === "to" ? st.to : st.acc,
      excludeId: key === "to" ? st.acc : (kind === "transfer" ? st.to : null),
      sign: kind === "income" || key === "to" ? 1 : -1,
      amount: st.amount, cur }));
    const multiSpace = S.spaces.length > 1 && S.activeSpace === "all";
    const splits = kind === "expense" && !t ? splitList() : [];

    host.className = `led-row edit ${kind}`;
    host.innerHTML = `
      <span class="led-clr">
        <button class="clr-dot ${st.cleared?"on":""}" id="txfCleared" title="${st.cleared?"Cleared":"Uncleared"}">${st.cleared?"✓":""}</button>
      </span>
      <span class="ed-dd">${pick("txfDate", "date", "Date", fmtTxDate(st.date))}${panel("date", calPopInner(st.date, txOpen.cal), "cal")}</span>
      <span class="ed-dd"><input id="txfPayee" value="${esc(st.payee)}" title="Payee" autocomplete="off" spellcheck="false"
          placeholder="${kind === "transfer" ? "Named automatically" : "Payee"}" ${kind === "transfer" ? "disabled" : ""}></span>
      <span class="ed-dd">${kind === "transfer"
        ? pick("txfTo", "to", "To account", st.to ? accName(st.to) : "", "To account") + accPanel("to")
        : comboHTML("txfCat", catSections, st.cat, "No category")}</span>
      <span class="ed-dd">${pick("txfAcc", "acc", kind === "transfer" ? "From account" : "Account", st.acc ? accName(st.acc) : "", "Account")}${accPanel("acc")}</span>
      <span><input id="txfNotes" value="${esc(st.notes)}" placeholder="Note" title="Note"></span>
      <span class="ed-amt">
        <button class="ed-sign" id="txfKind" title="${lockedKind ? "Transfers can't be retyped" : "Expense / income / transfer"}" ${lockedKind ? "disabled" : ""}>${SIGN[kind]}</button>
        <input id="txfAmt" inputmode="${isVND?"numeric":"decimal"}" placeholder="0" value="${fmtAmt(st.amount)}" title="Amount">
      </span>
      <span class="ed-acts">
        ${multiSpace ? `<span class="ed-dd ed-space"><button type="button" class="ed-pick${pop==="space"?" open":""}" id="txfSpace" data-edpop="space"
            title="Space: ${esc(spaceName(st.space))}" aria-label="Space: ${esc(spaceName(st.space))}"><i class="dot" style="background:${spaceColor(st.space)}"></i><em>▾</em></button>${panel("space", spacePopInner(st.space), "r")}</span>` : ""}
        ${kind === "expense" && !t ? `<button class="sq${splits.length ? " on" : ""}" id="txfSplit" title="${splits.length ? `Split with ${esc(splits.map(p => p.person).join(", "))}` : "Split with someone"}" aria-label="Split with someone">${SPLIT_IC}</button>` : ""}
        <button class="ed-save" id="txfSave">${t ? "Save" : "Add"}</button>
        ${t ? `<button class="sq del" id="txfDel" title="Delete" aria-label="Delete">${DEL_IC}</button>` : ""}
      </span>
      <span style="display:flex;align-items:center;justify-content:center"><button class="ed-x" id="txfCancel" title="Cancel">✕</button></span>`;
    /* A split gets the phone's split card, as a band under the row — the row
       itself has no room for who owes what. */
    const band = el("txSplitBand");
    if (band) band.innerHTML = splits.length
      ? `<button type="button" class="tf-split-card led-split" id="txfSplitCard" title="Edit split">${splitCardInner(splits, st.amount)}</button>` : "";
    wire();
  };

  /* Recent payees while the field is empty, matches once you type — each with
     where it went last time, as the phone's payee screen shows them. */
  const paintSugg = () => {
    const pay = el("txfPayee");
    const cell = pay?.parentElement;
    if (!cell) return;
    cell.querySelector(".ed-sugg")?.remove();
    const term = pay.value.trim().toLowerCase();
    const names = !term ? recentPayees().slice(0, 6)
      : allPayeeNames().filter(n => n.toLowerCase().includes(term)).slice(0, 8);
    // Nothing to offer, or the only offer is what's already typed.
    if (!names.length || (names.length === 1 && names[0].toLowerCase() === term)) { sugg.names = []; return; }
    sugg.names = names;
    if (sugg.hl >= names.length) sugg.hl = names.length - 1;
    const box = document.createElement("div");
    box.className = "tf-pop ed-pop ed-sugg";
    box.innerHTML = `<div class="tf-pop-h">${term ? "Payees" : "Recent"}</div>` + names.map((name, i) => {
      const h = payeeHistory(name);
      const sub = h ? `${h.category_id ? esc(catName(h.category_id)) + " · " : ""}${fmtDay(h.date)} · ${fmt(h.amount,cur)}` : "";
      return `<button type="button" tabindex="-1" class="tf-pop-opt${i === sugg.hl ? " hl" : ""}${st.payee === name ? " on" : ""}" data-paypick="${i}">
        <span class="l"><b>${esc(name)}</b>${sub ? `<span>${sub}</span>` : ""}</span>${st.payee === name ? `<span class="ck">✓</span>` : ""}</button>`;
    }).join("");
    // Keep the caret in the field while a suggestion is clicked.
    box.onmousedown = e => e.preventDefault();
    box.querySelectorAll("[data-paypick]").forEach(b => b.onclick = e => { e.stopPropagation(); pickPayee(names[+b.dataset.paypick]); });
    cell.appendChild(box);
  };
  const closeSugg = () => { sugg.hl = -1; sugg.names = []; document.querySelector(".led-row.edit .ed-sugg")?.remove(); };
  const pickPayee = name => {
    st.payee = name;
    if (name && !st.cat && txOpen.kind !== "transfer") {
      const guess = lastCatFor(name);
      if (guess && catSections.some(s => s.items.some(i => i.id === guess))) { st.cat = guess; txOpen.kind = kindForCat(guess, txOpen.kind); }
    }
    closeSugg(); sugg.quiet = true; render();
    const pay = el("txfPayee"); pay.focus(); pay.setSelectionRange(pay.value.length, pay.value.length);
  };

  const wire = () => {
    const kind = txOpen.kind;
    const amt = el("txfAmt");
    amt.oninput = () => { st.amount = Number(amt.value.replace(isVND ? /[^\d]/g : /[^\d.]/g, "")) || 0; amt.value = fmtAmt(st.amount); };
    // Only the cells that change what other cells say redraw the row; everything
    // else would just steal the caret out of a field.
    // The category survives the cycle: the list no longer swaps with the sign,
    // and pressing − twice to look at transfer shouldn't cost you your pick.
    el("txfKind").onclick = () => {
      txOpen.kind = KINDS[(KINDS.indexOf(kind) + 1) % KINDS.length];
      // Only an expense can be split — income and transfers drop it.
      if (txOpen.kind !== "expense") txOpen.split = null;
      txOpen.pop = null;
      render();
    };

    /* The pickers. Every handler stops the click here, because the row it
       redraws takes the clicked node out of the DOM before the document's
       close-on-click-outside listener would see where it came from. */
    host.querySelectorAll("[data-edpop]").forEach(b => b.onclick = e => {
      e.stopPropagation(); closeCombos(); closeSugg();
      const key = b.dataset.edpop;
      txOpen.pop = txOpen.pop === key ? null : key;
      if (txOpen.pop === "date") txOpen.cal = calOf(st.date);
      render();
      el(b.id)?.focus();
    });
    const done = () => { txOpen.pop = null; render(); };
    host.querySelectorAll("[data-daypick]").forEach(b => b.onclick = e => { e.stopPropagation(); st.date = b.dataset.daypick; done(); el("txfDate").focus(); });
    host.querySelectorAll("[data-quickdate]").forEach(b => b.onclick = e => { e.stopPropagation();
      st.date = b.dataset.quickdate; txOpen.cal = calOf(st.date); done(); el("txfDate").focus(); });
    host.querySelectorAll("[data-calnav]").forEach(b => b.onclick = e => { e.stopPropagation();
      txOpen.cal = calShift(txOpen.cal, Number(b.dataset.calnav)); render(); });
    host.querySelectorAll("[data-accpick]").forEach(b => b.onclick = e => {
      e.stopPropagation();
      const which = txOpen.pop;
      if (which === "to") st.to = b.dataset.accpick;
      else {
        st.acc = b.dataset.accpick;
        // The To list is built to exclude whatever From holds.
        if (kind === "transfer" && st.to === st.acc) st.to = openAcc.find(a => a.id !== st.acc)?.id || null;
      }
      done(); el(which === "to" ? "txfTo" : "txfAcc")?.focus();
    });
    host.querySelectorAll("[data-spacepick]").forEach(b => b.onclick = e => { e.stopPropagation(); st.space = b.dataset.spacepick; done(); el("txfSpace")?.focus(); });
    host.querySelectorAll(".ed-pop").forEach(p => p.onclick = e => e.stopPropagation());
    // Tabbing out of a picker closes its panel, as clicking elsewhere does.
    host.onfocusin = e => {
      if (txOpen?.pop && !e.target.closest(".ed-dd")?.querySelector(".ed-pop:not(.ed-sugg)")) closeEdPop();
    };

    const pay = el("txfPayee");
    if (pay && !pay.disabled) {
      pay.onfocus = () => { if (sugg.quiet) { sugg.quiet = false; return; } sugg.hl = -1; paintSugg(); };
      pay.onblur = () => closeSugg();
      pay.oninput = () => {
        st.payee = pay.value;
        sugg.hl = -1; paintSugg();
        // A payee you've used before brings its usual category with it.
        if (st.cat) return;
        const guess = lastCatFor(pay.value);
        if (guess && catSections.some(s => s.items.some(i => i.id === guess))) {
          st.cat = guess; txOpen.kind = kindForCat(guess, txOpen.kind);
          sugg.quiet = true; render();
          const p = el("txfPayee"); p.focus(); p.setSelectionRange(p.value.length, p.value.length);
        }
      };
      pay.onkeydown = e => {
        if (!sugg.names.length) return;
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          const n = sugg.names.length;
          sugg.hl = e.key === "ArrowDown" ? (sugg.hl + 1) % n : (sugg.hl <= 0 ? n - 1 : sugg.hl - 1);
          paintSugg();
        } else if (e.key === "Enter" && sugg.hl >= 0) {
          e.preventDefault(); e.stopPropagation(); pickPayee(sugg.names[sugg.hl]);
        } else if (e.key === "Escape") {
          e.stopPropagation(); closeSugg();
        }
      };
    }
    el("txfNotes").oninput = e => st.notes = e.target.value;
    /* Picking out of an income group turns the row into income — the sign, its
       colour and the amount all follow the category. Redrawn only when the sign
       actually changes, so an ordinary pick doesn't disturb the row. The list
       carries the same "left" hints and Most used shortcuts as the phone's. */
    wireCombo("txfCat", catSections, "No category", v => {
      st.cat = v;
      const k = kindForCat(v, txOpen.kind);
      if (k !== txOpen.kind) { txOpen.kind = k; render(); }
    }, { hint: id => catLeftHint(id, cur), lead: mostUsedCats(st.space).filter(c => catSections.some(s => s.items.some(i => i.id === c.id))) });
    // The combo swallows its own clicks, so it closes any open panel itself.
    el("txfCat")?.addEventListener("click", () => closeEdPop(), true);
    el("txfCleared").onclick = () => {
      st.cleared = !st.cleared;
      const d = el("txfCleared");
      d.classList.toggle("on", st.cleared); d.textContent = st.cleared ? "✓" : "";
      d.title = st.cleared ? "Cleared" : "Uncleared";
    };
    /* The register row has no space for two more fields, so the split details
       open in a sheet and come back as a lit-up button. The composer is inline
       here, not a modal, so nothing is covered up. */
    const openSplit = () => {
      if (!st.amount) return toast("Enter the full amount first");
      txOpen.pop = null;
      splitForm(() => { closeModal(); mountTxForm(); });
    };
    const split = el("txfSplit"); if (split) split.onclick = openSplit;
    const card = el("txfSplitCard"); if (card) card.onclick = openSplit;
    el("txfSave").onclick = () => saveTx(!t);
    el("txfCancel").onclick = () => closeTxForm();
    const del = el("txfDel"); if (del) del.onclick = () => deleteTx(t.id);
    // ⏎ adds and keeps the row open; ⇧⏎ adds and closes it.
    host.onkeydown = e => {
      if (e.key !== "Enter" || e.target.closest(".combo, .ed-pop")) return;
      e.preventDefault(); saveTx(!t && !e.shiftKey);
    };
  };

  render();
  if (txOpen.fresh) { txOpen.fresh = false; host.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
}

/* ============ helpers for the phone composer ============ */
/* A category's envelope for one month: this month's budget plus, for a
   rollover envelope, the whole unspent chain behind it. Standalone rather
   than reusing paintBudget's closures, since the composer only ever needs
   one category at a time. */
function catAvailable(cid, mo) {
  const c = S.cats.find(x => x.id === cid);
  if (!c) return 0;
  const bAt = m2 => Number(S.budgets.find(b => b.category_id === cid && b.month === m2)?.budgeted) || 0;
  if (!c.rollover) return bAt(mo);
  const spentAt = m2 => S.txs.filter(t => t.category_id === cid && !t.transfer_account_id && ym(t.date) === m2 && +t.amount < 0)
    .reduce((s,t) => s + Math.abs(+t.amount), 0);
  let first = null;
  S.budgets.forEach(b => { if (b.category_id === cid && Number(b.budgeted) && (!first || b.month < first)) first = b.month; });
  S.txs.forEach(t => { if (t.category_id === cid && !t.transfer_account_id) { const m2 = ym(t.date); if (!first || m2 < first) first = m2; } });
  let carry = 0;
  if (first && first < mo) for (let x = first, g = 0; x < mo && g < 600; x = shiftMonth(x, 1), g++) carry = Math.max(0, bAt(x) + carry - spentAt(x));
  return bAt(mo) + carry;
}
/* How a category stands this month, optionally with `extra` (an in-progress
   amount not yet saved) counted against it — the composer's envelope banner
   shows prevPct (already spent) and extraPct (this transaction) as two tones
   of the same bar. */
function catBudgetInfo(cid, extra = 0) {
  const c = S.cats.find(x => x.id === cid);
  if (!c || c.is_income) return null;
  const m = S.budgetMonth;
  const spent = S.txs.filter(t => t.category_id === cid && !t.transfer_account_id && ym(t.date) === m && +t.amount < 0)
    .reduce((s,t) => s + Math.abs(+t.amount), 0);
  const avail = catAvailable(cid, m);
  const total = spent + extra;
  const prevPct = avail > 0 ? Math.min(100, spent / avail * 100) : (spent > 0 ? 100 : 0);
  const extraPct = avail > 0 ? Math.min(100 - prevPct, extra / avail * 100) : 0;
  return { name: c.name, avail, spent, left: avail - total, over: total > avail, prevPct, extraPct };
}
/* The categories a space actually uses, most-tapped first — the composer's
   "Most used" shortcut grid. */
function mostUsedCats(space) {
  const counts = {};
  S.txs.forEach(t => { if (t.category_id && !t.transfer_account_id && !isDebtTx(t)) counts[t.category_id] = (counts[t.category_id] || 0) + 1; });
  const gset = new Set(S.groups.filter(g => g.space_id === space && !g.is_income).map(g => g.id));
  return S.cats.filter(c => !c.is_system && !c.is_income && gset.has(c.group_id) && counts[c.id])
    .sort((a,b) => counts[b.id] - counts[a.id]).slice(0, 4);
}
/* The last time you paid this payee — the picker's recent cards and the
   composer's "last …" hint. */
function payeeHistory(name) {
  const p = (name || "").trim().toLowerCase();
  if (!p) return null;
  const t = S.txs.find(x => (x.payee || "").trim().toLowerCase() === p && !x.transfer_account_id && !isDebtTx(x));
  return t ? { category_id: t.category_id, date: t.date, amount: Math.abs(+t.amount) } : null;
}
function allPayeeNames() {
  const seen = new Map();
  S.txs.forEach(t => { if (!t.payee || t.transfer_account_id || isDebtTx(t) || t.opening) return;
    const k = t.payee.trim(); if (k && !seen.has(k.toLowerCase())) seen.set(k.toLowerCase(), k); });
  return [...seen.values()].sort((a,b) => a.localeCompare(b));
}
function fmtDay(iso) { const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }); }
function isoOf(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function fmtTxDate(iso) { return new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "2-digit", month: "short" }); }

/* The date, account and space pickers, shared by the phone composer and the
   desktop register row so the two look and behave the same. Each returns the
   inside of a .tf-pop; the caller supplies the panel and wires the data-*
   buttons. `cal` is the month on show, { y, m } with m zero-based. */
function calPopInner(sel, cal) {
  const { y, m } = cal;
  const startDow = (new Date(y, m, 1).getDay() + 6) % 7;
  const dim = new Date(y, m + 1, 0).getDate();
  const todayIso = todayISO();
  const yestIso = isoOf(new Date(Date.now() - 86400000));
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push("<span></span>");
  for (let d = 1; d <= dim; d++) {
    const iso = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    cells.push(`<button type="button" data-daypick="${iso}" class="${iso===sel?"sel":iso===todayIso?"today":""}">${d}</button>`);
  }
  return `<div class="tf-cal-q"><button type="button" data-quickdate="${todayIso}" class="${sel===todayIso?"on":""}">Today</button>
      <button type="button" data-quickdate="${yestIso}" class="${sel===yestIso?"on":""}">Yesterday</button></div>
    <div class="tf-cal-nav"><button type="button" data-calnav="-1">‹</button><b>${monthLabel(`${y}-${String(m+1).padStart(2,"0")}`)}</b><button type="button" data-calnav="1">›</button></div>
    <div class="tf-cal-dow">${["M","T","W","T","F","S","S"].map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="tf-cal-grid">${cells.join("")}</div>`;
}
function calOf(iso) { const d = iso ? new Date(iso + "T00:00:00") : new Date(); return { y: d.getFullYear(), m: d.getMonth() }; }
function calShift(cal, by) { let { y, m } = cal; m += by; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } return { y, m }; }
/* On-budget and off-budget accounts in two sections, each with its balance;
   the selected one previews where this transaction leaves it. `sign` is the
   direction the amount moves that account (−1 out, +1 in). */
function accPopInner({ selId, excludeId, sign, amount, cur }) {
  const list = S.accounts.filter(a => !a.is_closed && a.id !== excludeId);
  const on = list.filter(a => a.on_budget !== false), off = list.filter(a => a.on_budget === false);
  const optHtml = a => {
    const bal = accBalance(a); const isSel = a.id === selId;
    const line = isSel && amount ? `${fmt(bal,cur)} → ${fmt(bal + sign*amount, cur)}` : fmt(bal,cur);
    return `<button type="button" class="tf-pop-opt${isSel?" on":""}" data-accpick="${a.id}">
      <span class="l"><b>${esc(a.name)}</b><span>${line}</span></span>${isSel?`<span class="ck">✓</span>`:""}</button>`;
  };
  return `${on.length?`<div class="tf-pop-h">On budget</div>${on.map(optHtml).join("")}`:""}${off.length?`<div class="tf-pop-h">Off budget</div>${off.map(optHtml).join("")}`:""}`;
}
function spacePopInner(sel) {
  return S.spaces.map(s => `<button type="button" class="tf-pop-opt${sel===s.id?" on":""}" data-spacepick="${s.id}">
    <i class="dot" style="background:${spaceColor(s.id)}"></i><span class="l"><b>${esc(s.name)}</b></span>${sel===s.id?`<span class="ck">✓</span>`:""}</button>`).join("");
}
/* How much is left in a category's envelope this month, as the pickers show it. */
function catLeftHint(id, cur) {
  const info = catBudgetInfo(id);
  if (!info) return "";
  return info.left < 0 ? `${fmt(Math.abs(info.left),cur)} over` : `${fmt(info.left,cur)} left`;
}
/* Multi-person split: everyone named must have a share, and shares can't add
   up to more than the whole amount. */
function splitListCheck(total, list) {
  if (!list || !list.length) return null;
  if (list.some(s => !s.person.trim())) return "Name everyone in the split";
  const sum = list.reduce((s,x) => s + x.amount, 0);
  if (!sum) return "Enter at least one share";
  if (sum > total) return "Shares add up to more than the total";
  return null;
}
const SPLIT_COLORS = ["#A87718","#C99A2E","#7E9AD8","#5FBCA0","#C08457","#9C6B9E"];
const SEARCH_IC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
const BKSP_IC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6H10L4 12l6 6h10z"/><path d="m14 10 4 4m0-4-4 4"/></svg>';
const CHECK_IC = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>';

/* ============ Phone: a full screen, amount first, keypad-driven ============ */
function tfShow() { const h = el("txFull"); h.classList.remove("hidden"); document.body.classList.add("modal-open"); }
function tfHide() { const h = el("txFull"); h.classList.add("hidden"); h.innerHTML = ""; document.body.classList.remove("modal-open"); }

function txComposer() {
  const t = txOpen.id ? S.txs.find(x => x.id === txOpen.id) : null;
  const openAcc = S.accounts.filter(a => !a.is_closed);
  const cur = CUR(); const isVND = cur === "VND";
  const st = txOpen.st;
  const lockedKind = !!(t && t.transfer_account_id);
  const KINDS = [["expense","Expense"],["income","Income"],["transfer","Transfer"]];
  let catSections = [];
  const ui = { screen: "main", catSearch: false, paySearch: false, openField: null, cal: null,
    splitWork: null, splitSel: -1, splitAdding: false, kbdOpen: true };

  tfShow();
  const paint = () => {
    if (ui.screen === "category") return paintCategory();
    if (ui.screen === "payee") return paintPayee();
    if (ui.screen === "split") return paintSplit();
    paintMain();
  };
  const searchBoxHtml = (id, placeholder) => `<div class="tf-searchbox">${SEARCH_IC}
    <input id="${id}" placeholder="${esc(placeholder)}" autocomplete="off" spellcheck="false">
    <button class="x" id="${id}Clear" type="button">✕</button></div>`;
  const searchBtnHtml = id => `<button class="tf-sub-search" id="${id}" type="button">${SEARCH_IC}Search</button>`;
  /* A plain chevron in a circle — not a drag grabber, since nothing here is
     draggable — shared by the amount pad's own collapse row and its
     collapsed bar, and reused by the split screen's pad below. */
  const kbdChevronHtml = dir => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${dir === "down" ? "m6 9 6 6 6-6" : "m18 15-6-6-6 6"}"/></svg>`;
  const kbdCollapsedBarHtml = (saveId, saveHtml) => `<div class="tf-kbd-bar">
    <button class="tf-kbd-handle-btn" id="tfKbdToggle" type="button"><span class="tf-kbd-toggle sm">${kbdChevronHtml("up")}</span>Keypad</button>
    <button class="tf-kbd-mini-save" id="${saveId}" type="button">${saveHtml}</button>
  </div>`;
  const kbdToggleRowHtml = () => `<div class="tf-kbd-toggle-row"><button class="tf-kbd-toggle" id="tfKbdToggle" type="button" aria-label="Collapse keypad">${kbdChevronHtml("down")}</button></div>`;

  /* ---------------- main screen ---------------- */
  const paintMain = () => {
    catSections = txCatSections(st);
    const kind = txOpen.kind;
    const splits = splitList();

    const bannerHtml = () => {
      if (kind === "transfer")
        return `<div class="tf-banner flat"><div class="tf-banner-row"><b style="color:var(--ink-soft)">Between your accounts</b><span>no envelope</span></div></div>`;
      if (kind === "income") {
        const acc = S.accounts.find(a => a.id === st.acc);
        const after = (acc ? accBalance(acc) : 0) + (st.amount || 0);
        return `<div class="tf-banner"><div class="tf-banner-row"><b>${esc(acc ? acc.name : "")}</b><span>${fmt(after,cur)} after</span></div></div>`;
      }
      if (!st.cat) return "";
      const info = catBudgetInfo(st.cat, st.amount);
      if (!info) return "";
      return `<div class="tf-banner${info.over?" over":""}">
        <div class="tf-banner-row"><b>${esc(info.name)}</b><span>${info.over?`${fmt(Math.abs(info.left),cur)} over`:`${fmt(info.left,cur)} left`}</span></div>
        <div class="tf-bar">${info.over ? `<i style="width:100%;background:var(--neg)"></i>`
          : `<i style="width:${info.prevPct}%;background:var(--pos)"></i><i style="width:${info.extraPct}%;background:#8FC7B4"></i>`}</div>
      </div>`;
    };

    const splitCardHtml = () => {
      if (kind !== "expense" || t) return "";
      if (splits.length)
        return `<button class="tf-split-card" id="tfSplitOpen" type="button">${splitCardInner(splits, st.amount)}</button>`;
      return `<button class="tf-empty-split" id="tfSplitOpen" type="button">
        <span class="ic">${SPLIT_IC}</span><span style="flex:1;min-width:0;font-size:14.5px;font-weight:500;color:var(--ink-soft)">Split with someone</span></button>`;
    };

    const fieldRow = (id, label, val, opts = {}) => `<button class="tf-row" id="${id}" type="button">
      <span class="tf-row-main"><span class="tf-row-lbl">${esc(label)}</span>
        <span class="tf-row-val${val?"":" soft"}">${esc(val || opts.placeholder || "")}</span>
        ${opts.sub ? `<span class="tf-row-hint" style="margin-top:1px">${esc(opts.sub)}</span>` : ""}</span>
      ${opts.hint ? `<em class="tf-row-hint">${esc(opts.hint)}</em>` : ""}<em class="tf-chev">▾</em></button>`;

    const stackField = (id, label, val, opts = {}) => `<button class="tf-row stack" id="${id}" type="button">
      <span class="tf-row-lbl">${esc(label)}</span>
      <span class="tf-row-line"><span class="tf-row-val${val?"":" soft"}">${esc(val || opts.placeholder || "")}</span><em class="tf-chev" style="margin-left:auto">▾</em></span>
    </button>`;

    const accPopHtml = (fieldKey) => `<div class="tf-pop">${accPopInner({
      selId: fieldKey === "to" ? st.to : st.acc,
      excludeId: fieldKey === "to" ? st.acc : (kind === "transfer" ? st.to : null),
      sign: kind === "income" ? 1 : kind === "expense" ? -1 : (fieldKey === "to" ? 1 : -1),
      amount: st.amount, cur })}</div>`;
    const spacePopHtml = () => `<div class="tf-pop">${spacePopInner(st.space)}</div>`;
    if (!ui.cal) ui.cal = calOf(st.date);
    const datePopHtml = () => `<div class="tf-pop">${calPopInner(st.date, ui.cal)}</div>`;

    const catInfoLine = () => st.cat ? catLeftHint(st.cat, cur) : "";
    const payeeHint = () => { const h = st.payee ? payeeHistory(st.payee) : null; return h ? `last ${fmtDay(h.date)} · ${fmt(h.amount,cur)}` : ""; };

    const noteRowHtml = () => `<div class="tf-row" style="flex-direction:column;align-items:flex-start;justify-content:center;gap:2px">
      <span class="tf-row-lbl">Note</span>
      <input id="tfNotes" value="${esc(st.notes)}" placeholder="Add a note" style="border:none;outline:none;background:transparent;padding:0;font-size:15px;font-weight:500;width:100%;color:var(--ink);font-family:var(--sans)">
    </div>`;

    let bodyHtml = "";
    if (kind === "transfer") {
      const fromAcc = S.accounts.find(a => a.id === st.acc), toAcc = S.accounts.find(a => a.id === st.to);
      bodyHtml += `<div class="tf-dd">${fieldRow("tfFromOpen", "From", fromAcc?.name, { hint: fromAcc && st.amount ? `→ ${fmt(accBalance(fromAcc)-st.amount,cur)}` : "" })}${ui.openField==="acc"?accPopHtml("acc"):""}</div>`;
      bodyHtml += `<div class="tf-dd">${fieldRow("tfToOpen", "To", toAcc?.name, { hint: toAcc && st.amount ? `→ ${fmt(accBalance(toAcc)+st.amount,cur)}` : "" })}${ui.openField==="to"?accPopHtml("to"):""}</div>`;
      bodyHtml += `<div class="tf-pair">
        <div class="tf-dd" style="flex:1">${stackField("tfDateOpen","Date", fmtTxDate(st.date))}${ui.openField==="date"?datePopHtml():""}</div>
        ${S.spaces.length>1?`<div class="tf-dd" style="flex:1">${stackField("tfSpaceOpen","Space", S.spaces.find(s=>s.id===st.space)?.name)}${ui.openField==="space"?spacePopHtml():""}</div>`:""}
      </div>`;
      bodyHtml += noteRowHtml();
    } else {
      bodyHtml += fieldRow("tfPayeeOpen", "Payee", st.payee, { placeholder: "Who it went to", sub: payeeHint() });
      bodyHtml += fieldRow("tfCatOpen", "Category", st.cat ? catName(st.cat) : null, { placeholder: "No category", hint: catInfoLine() });
      const acc = S.accounts.find(a => a.id === st.acc);
      bodyHtml += `<div class="tf-pair">
        <div class="tf-dd" style="flex:1">${stackField("tfDateOpen","Date", fmtTxDate(st.date))}${ui.openField==="date"?datePopHtml():""}</div>
        <div class="tf-dd" style="flex:1">${stackField("tfAccOpen","Account", acc?.name)}${ui.openField==="acc"?accPopHtml("acc"):""}</div>
      </div>`;
      if (S.spaces.length > 1) {
        bodyHtml += `<div class="tf-pair">
          <div class="tf-dd" style="flex:1">${stackField("tfSpaceOpen","Space", S.spaces.find(s=>s.id===st.space)?.name)}${ui.openField==="space"?spacePopHtml():""}</div>
          <div style="flex:1">${noteRowHtml()}</div>
        </div>`;
      } else bodyHtml += noteRowHtml();
      bodyHtml += splitCardHtml();
    }

    /* The pad is dismissable — a small handle collapses it, tapping the
       amount toggles it, and it gets out of the way entirely while a
       full-width picker (account/date/space) is open. */
    const saveLabel = st.amount ? `${kind==="expense"?"−":kind==="income"?"+":""}${nf0.format(st.amount)}` : "";
    const kbdHtml = () => {
      if (ui.openField) return "";
      if (!ui.kbdOpen) return kbdCollapsedBarHtml("tfSave", `Save${saveLabel?` <span>${esc(saveLabel)}</span>`:""}`);
      return `<div class="tf-kbd">
        ${kbdToggleRowHtml()}
        <div class="tf-kbd-grid">
          <button class="tf-key" data-d="1">1</button><button class="tf-key" data-d="2">2</button><button class="tf-key" data-d="3">3</button>
          <button class="tf-key bksp" id="tfBksp" type="button">${BKSP_IC}</button>
          <button class="tf-key" data-d="4">4</button><button class="tf-key" data-d="5">5</button><button class="tf-key" data-d="6">6</button>
          <button class="tf-key wide" data-d="000">000</button>
          <button class="tf-key" data-d="7">7</button><button class="tf-key" data-d="8">8</button><button class="tf-key" data-d="9">9</button>
          <button class="tf-key save" id="tfSave" type="button">Save<span>${esc(saveLabel)}</span></button>
          <button class="tf-key aux" id="tfQuick10k" type="button">+10k</button><button class="tf-key" data-d="0">0</button>
          <button class="tf-key aux" id="tfAgain" type="button">+ New</button>
        </div>
      </div>`;
    };

    el("txFull").innerHTML = `<div class="tf-wrap">
      <div class="tf-top">
        <button class="tf-icon" id="tfClose" type="button">✕</button>
        <div class="tf-seg">${KINDS.map(([k,label]) => `<button type="button" data-k="${k}" class="${kind===k?"on":""}" ${lockedKind&&k!==kind?"disabled style=opacity:.4":""}>${esc(label)}</button>`).join("")}</div>
        ${t ? `<button class="tf-icon" id="tfMenu" type="button" data-menu-id="tf-${t.id}">⋯</button>` : `<span style="width:36px"></span>`}
      </div>
      <div class="tf-amt">
        <span class="tf-amt-lbl"><span class="tf-amt-cap">Amount</span>
          <button class="tf-clr${st.cleared?" on":""}" id="tfClr" type="button"><i>${st.cleared?CHECK_IC:""}</i>Cleared</button></span>
        <button class="tf-num" id="tfAmtToggle" type="button"><b class="${kind==="income"?"pos":""}">${nf0.format(st.amount||0)}</b><span>${isVND?"₫":esc(cur)}</span></button>
      </div>
      ${bannerHtml()}
      <div class="tf-body" id="tfMainBody">${bodyHtml}</div>
      ${kbdHtml()}
    </div>`;

    wireMain();
  };

  const wireMain = () => {
    const kind = txOpen.kind;
    const st2 = st;
    el("tfClose").onclick = () => closeTxForm();
    document.querySelectorAll(".tf-seg [data-k]").forEach(b => b.onclick = () => {
      if (lockedKind) return toast("Transfers can't be retyped — delete and re-create");
      txOpen.kind = b.dataset.k;
      if (txOpen.kind !== "expense") txOpen.split = null;
      ui.openField = null; paintMain();
    });
    const menu = el("tfMenu");
    if (menu) menu.onclick = e => { e.stopPropagation(); openMenu(menu, [
      { label: "Duplicate", fn: () => {
        const clone = { ...t, id: null, date: todayISO() };
        closeTxForm(); txForm(clone); toast("Duplicated — review and save");
      } },
      null,
      { label: "Delete…", danger: true, fn: () => deleteTx(t.id) }
    ]); };
    el("tfClr").onclick = () => { st2.cleared = !st2.cleared; paintMain(); };

    const bump = () => paintMain();
    document.querySelectorAll(".tf-key[data-d]").forEach(b => b.onclick = () => {
      const d = b.dataset.d;
      st2.amount = Number(String(Math.trunc(st2.amount || 0)) + d) || 0;
      bump();
    });
    const bksp = el("tfBksp"); if (bksp) bksp.onclick = () => { st2.amount = Math.floor((st2.amount || 0) / 10); bump(); };
    const q10k = el("tfQuick10k"); if (q10k) q10k.onclick = () => { st2.amount = (st2.amount || 0) + 10000; bump(); };
    const saveBtn = el("tfSave"); if (saveBtn) saveBtn.onclick = guardBtn(() => saveTx(false));
    const againBtn = el("tfAgain"); if (againBtn) againBtn.onclick = guardBtn(() => saveTx(true));

    /* Collapsing the pad: the handle, tapping the amount, and tapping empty
       space in the field list all toggle it — a scroll never fires a click,
       so scrolling the list never collapses it by accident. */
    const kbdToggle = el("tfKbdToggle"); if (kbdToggle) kbdToggle.onclick = () => { ui.kbdOpen = !ui.kbdOpen; paintMain(); };
    el("tfAmtToggle").onclick = () => { ui.openField = null; ui.kbdOpen = !ui.kbdOpen; paintMain(); };
    const mainBody = el("tfMainBody");
    if (mainBody) mainBody.onclick = e => { if (e.target === mainBody && ui.kbdOpen) { ui.kbdOpen = false; paintMain(); } };

    const payeeBtn = el("tfPayeeOpen"); if (payeeBtn) payeeBtn.onclick = () => { ui.screen = "payee"; ui.paySearch = false; paint(); };
    const catBtn = el("tfCatOpen"); if (catBtn) catBtn.onclick = () => { ui.screen = "category"; ui.catSearch = false; paint(); };
    const splitBtn = el("tfSplitOpen"); if (splitBtn) splitBtn.onclick = () => {
      if (!st2.amount) return toast("Enter the amount first");
      ui.splitWork = splitList().map(s => ({ ...s }));
      ui.splitSel = ui.splitWork.length ? ui.splitWork.length - 1 : -1;
      ui.screen = "split"; paint();
    };

    const toggleField = key => { ui.openField = ui.openField === key ? null : key; paintMain(); };
    const acc1 = el("tfAccOpen"); if (acc1) acc1.onclick = () => toggleField("acc");
    const from1 = el("tfFromOpen"); if (from1) from1.onclick = () => toggleField("acc");
    const to1 = el("tfToOpen"); if (to1) to1.onclick = () => toggleField("to");
    const date1 = el("tfDateOpen"); if (date1) date1.onclick = () => toggleField("date");
    const space1 = el("tfSpaceOpen"); if (space1) space1.onclick = () => toggleField("space");

    document.querySelectorAll("[data-accpick]").forEach(b => b.onclick = e => {
      e.stopPropagation();
      const id = b.dataset.accpick;
      if (ui.openField === "to") st2.to = id; else {
        st2.acc = id;
        if (kind === "transfer" && st2.to === st2.acc) st2.to = openAcc.find(a => a.id !== st2.acc)?.id || null;
      }
      ui.openField = null; paintMain();
    });
    document.querySelectorAll("[data-spacepick]").forEach(b => b.onclick = e => { e.stopPropagation(); st2.space = b.dataset.spacepick; ui.openField = null; paintMain(); });
    document.querySelectorAll("[data-daypick]").forEach(b => b.onclick = e => { e.stopPropagation(); st2.date = b.dataset.daypick; ui.openField = null; paintMain(); });
    document.querySelectorAll("[data-quickdate]").forEach(b => b.onclick = e => { e.stopPropagation();
      st2.date = b.dataset.quickdate; ui.cal = calOf(st2.date); ui.openField = null; paintMain(); });
    document.querySelectorAll("[data-calnav]").forEach(b => b.onclick = e => { e.stopPropagation();
      ui.cal = calShift(ui.cal, Number(b.dataset.calnav)); paintMain(); });
    document.querySelectorAll(".tf-dd").forEach(d => d.onclick = e => e.stopPropagation());
    const notes = el("tfNotes"); if (notes) notes.oninput = e => { st2.notes = e.target.value; };

    /* The open dropdown (if any) is position:fixed, so its rect has to be set
       from its anchor row explicitly rather than left to CSS — full width
       (the pad is off the screen while it's open, so there's room) rather
       than only as wide as its own half of a paired row. */
    const openPop = document.querySelector(".tf-dd .tf-pop");
    if (openPop) {
      const anchor = openPop.parentElement.querySelector(".tf-row");
      const r = anchor.getBoundingClientRect();
      const margin = 18;
      openPop.style.left = margin + "px";
      openPop.style.width = (window.innerWidth - margin * 2) + "px";
      openPop.style.top = (r.bottom + 7) + "px";
      openPop.style.maxHeight = Math.max(120, window.innerHeight - r.bottom - 20) + "px";
    }
  };

  /* ---------------- category screen ---------------- */
  const paintCategory = () => {
    catSections = txCatSections(st);
    const searchMode = ui.catSearch;
    el("txFull").innerHTML = `<div class="tf-sub">
      <div class="tf-sub-top">
        <button class="tf-sub-back" id="tfBack" type="button">‹</button>
        ${searchMode ? searchBoxHtml("tfCatQ", "Search categories") : `<span class="tf-sub-title">Category</span>${searchBtnHtml("tfCatSearchBtn")}`}
      </div>
      <div class="tf-sub-body" id="tfCatBody"></div>
    </div>`;
    el("tfBack").onclick = () => { ui.screen = "main"; paintMain(); };

    const pick = id => {
      st.cat = id;
      if (id) { const k = kindForCat(id, txOpen.kind); if (k !== txOpen.kind) txOpen.kind = k; }
      ui.screen = "main"; paintMain();
    };
    const hintFor = id => catLeftHint(id, cur);
    const hi = (name, term) => { if (!term) return esc(name); const i = name.toLowerCase().indexOf(term); if (i < 0) return esc(name);
      return esc(name.slice(0,i)) + "<b>" + esc(name.slice(i,i+term.length)) + "</b>" + esc(name.slice(i+term.length)); };

    const renderList = raw => {
      const term = raw.trim().toLowerCase();
      let html = "";
      if (!searchMode && !term) {
        const most = mostUsedCats(st.space);
        if (most.length) html += `<div class="tf-sec">Most used</div><div class="tf-cats-grid">${most.map(c => {
          const info = catBudgetInfo(c.id); const pct = info && info.avail > 0 ? Math.min(100, info.spent/info.avail*100) : 0;
          return `<button type="button" class="tf-cat-card${st.cat===c.id?" on":""}" data-catpick="${c.id}">
            <b>${esc(c.name)}</b><span class="bar"><i style="width:${pct}%;background:${info&&info.over?"var(--neg)":"var(--pos)"}"></i></span>
            <em>${esc(hintFor(c.id))}</em></button>`;
        }).join("")}</div>`;
      }
      const groups = catSections.map(s => {
        const hits = s.items.filter(c => !term || c.name.toLowerCase().includes(term));
        if (!hits.length) return "";
        return `<div class="tf-sec">${esc(s.name)}</div>` + hits.map(c => searchMode
          ? `<button type="button" class="tf-list-row" data-catpick="${c.id}"><span class="tf-list-sub"><span class="nm">${hi(c.name,term)}</span><span class="sub">${esc(s.name)}</span></span><em>${esc(hintFor(c.id))}</em></button>`
          : `<button type="button" class="tf-list-row" data-catpick="${c.id}"><span class="nm">${esc(c.name)}</span><em>${esc(hintFor(c.id))}</em></button>`
        ).join("");
      }).join("");
      html += groups || (term ? `<div style="padding:30px 0;text-align:center;color:var(--ink-soft);font-size:13px">Nothing matches "${esc(raw.trim())}"</div>` : "");
      if (!searchMode) html += `<div style="border-top:1px solid var(--line-soft);margin-top:14px;padding-top:14px;display:flex;justify-content:flex-end"><button type="button" class="tf-leave" id="tfCatLeave">Leave category empty</button></div>`;
      el("tfCatBody").innerHTML = html;
      el("tfCatBody").querySelectorAll("[data-catpick]").forEach(b => b.onclick = () => pick(b.dataset.catpick));
      const lv = el("tfCatLeave"); if (lv) lv.onclick = () => pick(null);
    };

    if (searchMode) {
      const q = el("tfCatQ");
      q.oninput = () => renderList(q.value);
      el("tfCatQClear").onclick = () => { q.value = ""; renderList(""); q.focus(); };
      renderList(""); q.focus();
    } else {
      el("tfCatSearchBtn").onclick = () => { ui.catSearch = true; paintCategory(); };
      renderList("");
    }
  };

  /* ---------------- payee screen ---------------- */
  const paintPayee = () => {
    const searchMode = ui.paySearch;
    el("txFull").innerHTML = `<div class="tf-sub">
      <div class="tf-sub-top">
        <button class="tf-sub-back" id="tfBack" type="button">‹</button>
        ${searchMode ? searchBoxHtml("tfPayQ", "Search payees") : `<span class="tf-sub-title">Payee</span>${searchBtnHtml("tfPaySearchBtn")}`}
      </div>
      <div class="tf-sub-body" id="tfPayBody"></div>
    </div>`;
    el("tfBack").onclick = () => { ui.screen = "main"; paintMain(); };

    const pick = name => {
      st.payee = name;
      if (name && !st.cat) {
        const guess = lastCatFor(name);
        if (guess && catSections.some(s => s.items.some(i => i.id === guess))) { st.cat = guess; txOpen.kind = kindForCat(guess, txOpen.kind); }
      }
      ui.screen = "main"; paintMain();
    };

    const renderList = raw => {
      const term = raw.trim().toLowerCase();
      const all = allPayeeNames();
      let html = "";
      if (!searchMode) {
        const recents = recentPayees().slice(0, 6);
        if (recents.length) {
          html += `<div class="tf-sec">Recent</div>` + recents.map(name => {
            const h = payeeHistory(name);
            const sub = h ? `${h.category_id ? esc(catName(h.category_id)) + " · " : ""}${fmtDay(h.date)} · ${fmt(h.amount,cur)}` : "";
            return `<button type="button" class="tf-recent-card${st.payee===name?" on":""}" data-paypick="${esc(name)}">
              <span class="l"><b>${esc(name)}</b><span>${sub}</span></span>${st.payee===name?`<span class="ck">✓</span>`:""}</button>`;
          }).join("");
        }
        const rest = all.filter(n => !recents.includes(n));
        if (rest.length) html += `<div class="tf-sec" style="padding-top:14px;border-top:1px solid var(--line-soft)">All payees · A–Z</div>` +
          rest.map(name => `<button type="button" class="tf-list-row" data-paypick="${esc(name)}">${esc(name)}</button>`).join("");
        html += `<div style="border-top:1px solid var(--line-soft);margin-top:14px;padding-top:14px;display:flex;flex-direction:column;gap:9px;align-items:stretch">
          <button type="button" class="tf-ghost-add" id="tfNewPayeeBtn"><span class="plus">+</span>New payee</button>
          <button type="button" class="tf-leave" id="tfPayLeave">Leave payee empty</button></div>`;
      } else {
        const matches = all.filter(n => !term || n.toLowerCase().includes(term));
        const exact = term && all.some(n => n.toLowerCase() === term);
        if (term && !exact) html += `<button type="button" class="tf-newpayee" data-paypick="${esc(raw.trim())}">
          <span class="plus">+</span><span class="l"><b>Use "${esc(raw.trim())}"</b><span>new payee${st.cat?` · category stays ${esc(catName(st.cat))}`:""}</span></span></button>`;
        if (matches.length) html += `<div class="tf-sec">${term?"Close matches":"All payees"}</div>` +
          matches.slice(0, 40).map(name => `<button type="button" class="tf-list-row" data-paypick="${esc(name)}">${esc(name)}</button>`).join("");
        else if (!term) html += `<div style="padding:30px 0;text-align:center;color:var(--ink-soft);font-size:13px">No payees yet</div>`;
      }
      el("tfPayBody").innerHTML = html;
      el("tfPayBody").querySelectorAll("[data-paypick]").forEach(b => b.onclick = () => pick(b.dataset.paypick));
      const nb = el("tfNewPayeeBtn"); if (nb) nb.onclick = () => { ui.paySearch = true; paintPayee(); };
      const lv = el("tfPayLeave"); if (lv) lv.onclick = () => pick("");
    };

    if (searchMode) {
      const q = el("tfPayQ");
      q.oninput = () => renderList(q.value);
      el("tfPayQClear").onclick = () => { q.value = ""; renderList(""); q.focus(); };
      renderList(""); q.focus();
    } else {
      el("tfPaySearchBtn").onclick = () => { ui.paySearch = true; paintPayee(); };
      renderList("");
    }
  };

  /* ---------------- split screen ---------------- */
  const paintSplit = () => {
    const total = st.amount || 0;
    const cur2 = cur;

    if (ui.splitAdding) {
      const known = [...new Set([...debtPeople().map(p => p.name), ...recentPayees()])]
        .filter(n => !ui.splitWork.some(s => s.person.trim().toLowerCase() === n.trim().toLowerCase())).slice(0, 8);
      el("txFull").innerHTML = `<div class="tf-sub">
        <div class="tf-sub-top">
          <button class="tf-sub-back" id="tfBack" type="button">‹</button>
          <div class="tf-searchbox"><input id="tfSplitName" placeholder="e.g. Minh" autocomplete="off"><button class="x" id="tfSplitNameClear" type="button">✕</button></div>
        </div>
        <div class="tf-sub-body">
          ${known.length ? `<div class="tf-quick-people">${known.map(n => `<button type="button" data-qp="${esc(n)}">${esc(n)}</button>`).join("")}</div>` : ""}
          <div class="tf-kbd-tip" style="margin-top:14px">Name first, then the pad takes the amount.</div>
        </div>
      </div>`;
      const commit = name => {
        name = name.trim(); if (!name) return;
        ui.splitWork.push({ person: name, amount: 0 });
        ui.splitSel = ui.splitWork.length - 1; ui.splitAdding = false; paint();
      };
      el("tfBack").onclick = () => { ui.splitAdding = false; paint(); };
      const nm = el("tfSplitName");
      nm.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); commit(nm.value); } };
      el("tfSplitNameClear").onclick = () => { nm.value = ""; nm.focus(); };
      document.querySelectorAll("[data-qp]").forEach(b => b.onclick = () => commit(b.dataset.qp));
      nm.focus();
      return;
    }

    const mine = Math.max(0, total - ui.splitWork.reduce((s,x) => s + x.amount, 0));
    const owed = ui.splitWork.reduce((s,x) => s + x.amount, 0);
    const doneLabel = `Done<span>${ui.splitWork.length} share${ui.splitWork.length===1?"":"s"}</span>`;
    const kbdHtml = () => {
      if (!ui.kbdOpen) return kbdCollapsedBarHtml("tfSplitDone", doneLabel);
      return `<div class="tf-kbd">
        ${kbdToggleRowHtml()}
        <div class="tf-kbd-grid">
          <button class="tf-key" data-sd="1">1</button><button class="tf-key" data-sd="2">2</button><button class="tf-key" data-sd="3">3</button>
          <button class="tf-key bksp" id="tfSBksp" type="button">${BKSP_IC}</button>
          <button class="tf-key" data-sd="4">4</button><button class="tf-key" data-sd="5">5</button><button class="tf-key" data-sd="6">6</button>
          <button class="tf-key wide" data-sd="000">000</button>
          <button class="tf-key" data-sd="7">7</button><button class="tf-key" data-sd="8">8</button><button class="tf-key" data-sd="9">9</button>
          <button class="tf-key save" id="tfSplitDone" type="button">${doneLabel}</button>
          <button class="tf-key aux" id="tfSplitNext" type="button">Next</button><button class="tf-key" data-sd="0">0</button>
          <button class="tf-key aux" id="tfSQuick10k" type="button">+10k</button>
        </div>
      </div>`;
    };

    el("txFull").innerHTML = `<div class="tf-wrap">
      <div class="tf-top" style="border-bottom:1px solid var(--line-soft);padding-bottom:14px">
        <button class="tf-icon" id="tfBack" type="button">‹</button>
        <span class="tf-sub-title" style="position:static;font-weight:600;font-size:15px">Split</span>
        <button class="tf-icon" id="tfRemove" type="button" style="width:auto;padding:0 12px;color:var(--neg);font-size:12.5px;font-weight:600">Remove</button>
      </div>
      <div class="tf-split-total"><span class="tf-amt-cap">Total</span><span class="tf-num"><b>${nf0.format(total)}</b><span>${isVND?"₫":esc(cur2)}</span></span></div>
      <div class="tf-split-body" id="tfSplitBody">
        ${ui.splitWork.map((s,i) => `<div class="tf-person${ui.splitSel===i?" sel":""}" data-persel="${i}">
          <span class="nm">${esc(s.person)}</span><span class="amt${s.amount?"":" zero"}">${s.amount?nf0.format(s.amount):"0"}</span></div>`).join("")}
        <button type="button" class="tf-ghost-add" id="tfAddPerson"><span class="plus">+</span>Add someone</button>
        <div class="tf-split-chips">
          <button type="button" id="tfSplitEven">Even ${ui.splitWork.length+1} ways</button>
          <button type="button" id="tfSplitAll">All theirs</button>
          <button type="button" id="tfSplitClear">Clear</button>
        </div>
        <div class="tf-split-sum">
          <div class="r"><span>Owed to you</span><span style="font-family:var(--mono)">${fmt(owed,cur2)}</span></div>
          <div class="r strong"><span>Your share</span><span>${fmt(mine,cur2)}</span></div>
          ${splitBarHtml(splitParts(ui.splitWork, total), total)}
        </div>
      </div>
      ${kbdHtml()}
    </div>`;

    const finish = () => { ui.splitWork = null; ui.splitSel = -1; ui.screen = "main"; paintMain(); };
    const commitAndReturn = () => {
      const err = splitListCheck(total, ui.splitWork);
      if (err) return toast(err);
      txOpen.split = ui.splitWork.map(s => ({ person: s.person.trim(), amount: s.amount }));
      finish();
    };
    el("tfBack").onclick = commitAndReturn;
    el("tfRemove").onclick = () => { txOpen.split = null; finish(); };
    el("tfAddPerson").onclick = () => { ui.splitAdding = true; paintSplit(); };
    document.querySelectorAll("[data-persel]").forEach(row => row.onclick = () => { ui.splitSel = Number(row.dataset.persel); paintSplit(); });
    const bump = () => paintSplit();
    document.querySelectorAll(".tf-key[data-sd]").forEach(b => b.onclick = () => {
      if (ui.splitSel < 0) return;
      const p = ui.splitWork[ui.splitSel];
      p.amount = Number(String(Math.trunc(p.amount || 0)) + b.dataset.sd) || 0;
      bump();
    });
    const sBksp = el("tfSBksp"); if (sBksp) sBksp.onclick = () => { if (ui.splitSel < 0) return; const p = ui.splitWork[ui.splitSel]; p.amount = Math.floor((p.amount||0)/10); bump(); };
    const sQuick10k = el("tfSQuick10k"); if (sQuick10k) sQuick10k.onclick = () => { if (ui.splitSel < 0) return; ui.splitWork[ui.splitSel].amount += 10000; bump(); };
    const sNext = el("tfSplitNext"); if (sNext) sNext.onclick = () => { if (!ui.splitWork.length) return; ui.splitSel = (ui.splitSel + 1) % ui.splitWork.length; paintSplit(); };
    el("tfSplitEven").onclick = () => { const n = ui.splitWork.length + 1; const share = Math.floor(total / n); ui.splitWork.forEach(s => s.amount = share); bump(); };
    el("tfSplitAll").onclick = () => { if (ui.splitSel < 0) return; const others = ui.splitWork.reduce((s,x,i) => i===ui.splitSel ? s : s + x.amount, 0); ui.splitWork[ui.splitSel].amount = Math.max(0, total - others); bump(); };
    el("tfSplitClear").onclick = () => { ui.splitWork.forEach(s => s.amount = 0); bump(); };
    el("tfSplitDone").onclick = commitAndReturn;

    const kbdToggle = el("tfKbdToggle"); if (kbdToggle) kbdToggle.onclick = () => { ui.kbdOpen = !ui.kbdOpen; paintSplit(); };
    const splitBody = el("tfSplitBody");
    if (splitBody) splitBody.onclick = e => { if (e.target === splitBody && ui.kbdOpen) { ui.kbdOpen = false; paintSplit(); } };
  };

  paint();
}

/* The kind segment, the account picker and the uncleared toggle used to sit in
   a toolbar that wrapped to three lines on a phone. One button now, same
   controls behind it on both shapes. */
function filterSheet(focusSearch) {
  const f = S.txFilter;
  const d = { kind: f.kind, budget: f.budget, account: f.account, uncleared: f.uncleared, q: f.q };
  const CLEARED = { kind: "all", budget: "all", account: "", uncleared: false, q: "" };
  /* The account list is sectioned the same way the Accounts screen is, so the
     two ways of narrowing to on-budget money look like the same idea. */
  const accSection = (label, list) => list.length
    ? `<optgroup label="${label}">${list.map(a =>
        `<option value="${a.id}" ${d.account===a.id?"selected":""}>${esc(a.name)}${a.is_closed?" (closed)":""}</option>`).join("")}</optgroup>`
    : "";
  openModal(`<div id="fltBody"></div>`);
  const render = () => {
    const on = S.accounts.filter(a => a.on_budget !== false);
    const off = S.accounts.filter(a => a.on_budget === false);
    el("fltBody").innerHTML = `
      <h3>Search &amp; filter</h3>
      <div class="m-sub">Narrows the register without changing the month.</div>
      <div class="field"><label>Search</label><input id="fltQ" value="${esc(d.q)}" placeholder="Payee, note or category"></div>
      <div class="field"><label>Kind</label>
        <div class="chiprow">${["all","expense","income","transfer"].map(k =>
          `<button class="chip ${d.kind===k?"on":""}" data-k="${k}" style="border-radius:9px">${k==="all"?"Everything":k[0].toUpperCase()+k.slice(1)}</button>`).join("")}</div></div>
      <div class="field"><label>Budget</label>
        <div class="chiprow">
          <button class="chip ${d.budget==="all"?"on":""}" data-b="all" style="border-radius:9px">Both</button>
          <button class="chip ${d.budget==="on"?"on":""}" data-b="on" style="border-radius:9px">On budget</button>
          <button class="chip ${d.budget==="off"?"on":""}" data-b="off" style="border-radius:9px">Off budget</button>
        </div>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:7px">${d.budget === "all"
          ? `Money moving through any account. ${infoDot("onbudget")}`
          : d.budget === "on"
            ? `Only what moved through the ${on.length} account${on.length===1?"":"s"} the budget can assign from. ${infoDot("onbudget")}`
            : `Only what moved through the ${off.length} account${off.length===1?"":"s"} the budget leaves out — savings, investments, anything you don’t spend from. ${infoDot("onbudget")}`}</div>
      </div>
      <div class="field"><label>Account</label>
        <select id="fltAcc"><option value="">All accounts</option>${accSection("On budget", on)}${accSection("Off budget", off)}</select></div>
      <label class="checkrow" style="min-height:44px"><input type="checkbox" id="fltUc" ${d.uncleared?"checked":""}><span>Uncleared only ${infoDot("uncleared")}</span></label>
      <div class="m-foot">
        <button class="btn btn-ghost" id="fltClear">Clear all</button>
        <button class="btn btn-primary" style="width:auto" id="fltApply">Apply</button>
      </div>`;
    document.querySelectorAll("#fltBody [data-k]").forEach(b => b.onclick = () => { d.kind = b.dataset.k; render(); });
    document.querySelectorAll("#fltBody [data-b]").forEach(b => b.onclick = () => {
      d.budget = b.dataset.b;
      // A named account already decides its own side; keep the two consistent.
      if (d.account && onBudgetOf(d.account) !== (d.budget === "on") && d.budget !== "all") d.account = "";
      render();
    });
    el("fltQ").oninput = e => d.q = e.target.value;
    el("fltQ").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); el("fltApply").click(); } };
    el("fltAcc").onchange = e => {
      d.account = e.target.value;
      if (d.account && d.budget !== "all" && onBudgetOf(d.account) !== (d.budget === "on")) { d.budget = "all"; render(); }
    };
    el("fltUc").onchange = e => d.uncleared = e.target.checked;
    el("fltClear").onclick = () => { Object.assign(d, CLEARED); render(); };
    el("fltApply").onclick = () => { Object.assign(S.txFilter, d); closeModal(); go("transactions"); };
  };
  render();
  if (focusSearch) el("fltQ").focus();
}
