const nf0 = new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 0 });

async function saveBudget(month, category_id, budgeted) {
  await rest(`budgets?on_conflict=user_id,month,category_id`, { method: "POST",
    headers: { Prefer: "resolution=merge-duplicates,return=representation" },
    body: { month, category_id, budgeted } });
}

async function bulkFill(m, mode) {
  const prevM = shiftMonth(m, -1);
  const bAt = (mo, id) => Number(S.budgets.find(b => b.month === mo && b.category_id === id)?.budgeted || 0);
  const avg3 = id => {
    const ms = [shiftMonth(m,-1), shiftMonth(m,-2), shiftMonth(m,-3)];
    const tot = S.txs.filter(t => t.category_id === id && ms.includes(ym(t.date)) && !t.transfer_account_id)
      .reduce((s,t) => s + Math.abs(+t.amount), 0);
    return Math.round(tot / 3);
  };
  const label = mode === "zero" ? "Zero every envelope for this month?"
    : mode === "last" ? `Copy all budgets from ${monthLabel(prevM)}? This overwrites current values.`
    : "Fill every envelope from its 3-month average spend? This overwrites current values.";
  if (!confirm(label)) return;
  const gset = new Set(S.groups.filter(groupInSpace).map(g => g.id));
  const rows = S.cats.filter(c => !c.is_income && gset.has(c.group_id)).map(c => ({
    month: m, category_id: c.id,
    budgeted: mode === "zero" ? 0 : mode === "last" ? bAt(prevM, c.id) : avg3(c.id)
  }));
  if (rows.length) await rest(`budgets?on_conflict=user_id,month,category_id`, { method: "POST",
    headers: { Prefer: "resolution=merge-duplicates,return=representation" }, body: rows });
  toast(mode === "zero" ? "All envelopes zeroed" : mode === "last" ? `Copied ${monthLabel(prevM)} budgets` : "Filled from 3-month average");
  go("budget");
}

/* The envelope sheet. One sheet replaces four controls the phone used to lose:
   the amount, ↻ rollover and delete — plus rename. It opens straight
   into the number when you came from the row's amount button. */
function catForm(c, presetGroup, month, startDelete, focus) {
  const m = month || S.budgetMonth;
  const prevM = shiftMonth(m, -1);
  const bAt = (mo, id) => Number(S.budgets.find(b => b.month === mo && b.category_id === id)?.budgeted || 0);
  const spentIn = id => S.txs.filter(t => t.category_id === id && ym(t.date) === m && !t.transfer_account_id)
    .reduce((s,t) => s + Math.abs(+t.amount), 0);
  const avg3 = id => {
    const ms = [shiftMonth(m,-1), shiftMonth(m,-2), shiftMonth(m,-3)];
    return Math.round(S.txs.filter(t => t.category_id === id && ms.includes(ym(t.date)) && !t.transfer_account_id)
      .reduce((s,t) => s + Math.abs(+t.amount), 0) / 3);
  };
  const cur = CUR();
  const d = {
    name: c?.name || "", gid: c?.group_id || presetGroup || S.groups.find(g => !g.is_income)?.id || S.groups[0]?.id,
    budget: c ? bAt(m, c.id) : 0, rollover: c ? !!c.rollover : false, committed: c ? !!c.committed : false
  };
  let confirming = !!startDelete, reassignTo = "none";
  /* An existing envelope opens on its number: the thing you came to change is
     the first thing you see, and the name and group are behind “Rename”. A new
     category still needs its name and group up front. */
  let renaming = !c;
  const txCount = c ? S.txs.filter(t => t.category_id === c.id).length : 0;
  const isDup = name => S.cats.some(x => x.name.trim().toLowerCase() === name.trim().toLowerCase() && x.id !== c?.id);
  const nameHint = name => !name.trim() ? "Give it a short, specific name."
    : isDup(name) ? "Another category already uses this name."
    : "Shows up in transaction entry, reports and this budget.";

  openModal(`<div id="catBody"></div>`);
  const render = () => {
    const grp = S.groups.find(g => g.id === d.gid) || S.groups[0];
    const dup = isDup(d.name);
    const valid = d.name.trim() && !dup;
    const others = c ? S.cats.filter(x => x.id !== c.id && x.is_income === c.is_income) : [];
    const lastB = c ? bAt(prevM, c.id) : 0, a3 = c ? avg3(c.id) : 0;
    const isInc = !!grp?.is_income;                 // income categories aren't envelopes
    const isSys = !!c?.is_system;
    const carryIn = c && S.carryIn?.month === m ? S.carryIn.by[c.id] || 0 : 0;
    const avail = c && !isInc ? d.budget + carryIn - spentIn(c.id) : 0;
    el("catBody").innerHTML = `
      ${c ? `<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px">
          <h3>${esc(c.name)}</h3><span style="font-size:12.5px;color:var(--ink-soft)">${esc(grp?.name || "")} · ${esc(monthLabel(m))}</span></div>`
        : `<h3>New category</h3><div class="m-sub">An envelope you can budget against and assign transactions to.</div>`}
      ${isSys ? `<div class="m-sub">A built-in category. You can rename it, but it can’t be deleted — ${c.system_key === "debt" ? "loans and repayments" : "opening balances"} need somewhere to live.</div>` : ""}

      ${!renaming ? "" : `${isSys ? "" : `<div class="field"><label>Group</label>
        <div class="chiprow">${S.groups.filter(g => groupInSpace(g) || g.id === d.gid).map(g => `<button class="chip ${g.id===d.gid?"on":""}" data-g="${g.id}" style="border-radius:9px">${esc(g.name)}${S.activeSpace==="all"&&S.spaces.length>1?` <span style="opacity:.6;font-weight:500">· ${esc(spaceName(g.space_id))}</span>`:""}</button>`).join("")}</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:7px">${isInc ? "Income group — its categories only track money coming in; there's nothing to budget." : "Expense group — spending counts against this envelope."}</div>
      </div>`}
      <div class="field"><label>Name</label>
        <input id="cName" value="${esc(d.name)}" placeholder="e.g. Pet care">
        <div id="cNameHint" style="font-size:12px;margin-top:7px;color:${dup?"var(--neg)":"var(--ink-soft)"}">${nameHint(d.name)}</div>
      </div>`}

      ${isInc ? "" : `<div class="amt-panel">
        <label class="flabel">Budget${c ? " this month" : ` for ${monthLabel(m)}`}</label>

/* ============ Debts ============ */
/* Debts aren't scoped to a space, so their movements land in the one you're
   looking at — or the first, on the all-spaces roll-up. */
function debtSpace() { return S.activeSpace !== "all" ? S.activeSpace : S.spaces[0]?.id || null; }
function debtStats(d) {
  const tx = S.txs.filter(t => t.debt_id === d.id).slice().sort((a,b) => a.date.localeCompare(b.date));
  const sum = tx.reduce((s,t) => s + +t.amount, 0);
  /* `forgiven` is legacy: writing a debt off is no longer offered, and a debt
     now closes only when it is repaid in full. Older rows may still carry a
     value, so the arithmetic keeps honouring it. */
  const raw = d.direction === "lent" ? -sum : sum;
  const outstanding = Math.max(0, raw - +d.forgiven);
  const principal = tx.reduce((s,t) => s + ((d.direction === "lent" ? +t.amount < 0 : +t.amount > 0) ? Math.abs(+t.amount) : 0), 0);
  const repaid = Math.max(0, principal - raw);
  const last = tx.length ? tx[tx.length-1].date : (d.created_at || "").slice(0,10);
  return { tx, outstanding, principal, repaid, forgiven: +d.forgiven, last };
}
function debtTotals() {
  let owedToMe = 0, iOwe = 0;
  S.debts.filter(d => !d.is_closed).forEach(d => {
    const s = debtStats(d);
    if (d.direction === "lent") owedToMe += s.outstanding; else iOwe += s.outstanding;
  });
  return { owedToMe, iOwe };
}

/* One person can be owed for several separate things at once — three dinners
   you covered are three debts, not one running tab you have to keep re-reading.
   The screen is therefore a list of people, and the debts live one level down.
   Names are matched case- and space-insensitively so "Minh" and "minh " are the
   same person; the spelling shown is the one on their most recent debt. */
function personKey(name) { return (name || "").trim().toLowerCase().replace(/\s+/g, " "); }

function debtPerson(key) { return debtPeople().find(p => p.key === key) || null; }

function debtPeople() {
  const map = new Map();
  S.debts.forEach(d => {
    const key = personKey(d.person);
    if (!map.has(key)) map.set(key, { key, name: (d.person || "").trim(), debts: [] });
    map.get(key).debts.push(d);
  });
  const people = [...map.values()].map(p => {
    const debts = p.debts
      .map(d => ({ d, s: debtStats(d) }))
      .sort((a,b) => b.s.last.localeCompare(a.s.last));
    const open = debts.filter(x => !x.d.is_closed);
    let owed = 0, owe = 0, principal = 0, repaid = 0;
    open.forEach(({ d, s }) => {
      if (d.direction === "lent") owed += s.outstanding; else owe += s.outstanding;
      principal += s.principal; repaid += s.repaid + s.forgiven;
    });
    /* The spelling you use most is the one shown: typing "minh" once shouldn't
       rename a friend you have always entered as "Minh". Ties go to the most
       recent, which is what makes a deliberate re-spelling eventually stick. */
    const tally = new Map();
    debts.forEach(({ d }, i) => {
      const n = (d.person || "").trim();
      if (!n) return;
      const prev = tally.get(n);
      if (!prev) tally.set(n, { n, count: 1, first: i });
      else prev.count++;
    });
    const name = [...tally.values()].sort((a,b) => b.count - a.count || a.first - b.first)[0]?.n || p.name;
    const tx = debts.flatMap(x => x.s.tx).sort((a,b) => b.date.localeCompare(a.date));
    return { key: p.key, name, debts, open, settled: debts.filter(x => x.d.is_closed),
      owed, owe, net: owed - owe, principal, repaid, tx,
      last: debts[0]?.s.last || "", mixed: open.some(x => x.d.direction === "lent") && open.some(x => x.d.direction === "borrowed") };
  });
  // Anyone still open comes first, biggest position at the top; then the archive.
  return people.sort((a,b) =>
    (b.open.length > 0) - (a.open.length > 0) ||
    Math.abs(b.net) - Math.abs(a.net) ||
    b.last.localeCompare(a.last));
}

      const space = debtSpace();
      await rest("transactions", { method: "POST", body: {
        account_id: st.acc, date: st.date, debt_id: created[0].id,
        amount: direction === "lent" ? -st.amount : st.amount,
        payee: person, category_id: systemCat(space, "debt")?.id || null, space_id: space,
        notes: st.notes.trim() || (direction === "lent" ? "Lent" : "Borrowed"), cleared: true } });
      closeModal(); toast(direction === "lent" ? `Lent ${fmt(st.amount,cur)} to ${person}` : `Borrowed ${fmt(st.amount,cur)} from ${person}`); refresh();
    });
  };
  render();
}

/* The one place a repayment is recorded. It is reached from the person, not
   from a single debt, so when someone owes you for three separate things the
   form asks which one the money is against — oldest first, because that is the
   one you'd normally settle. A debt closes when it reaches zero and only then:
   there is no write-off, so a part-paid debt stays open until it's paid off. */
function debtPayForm(key) {
  const p = debtPerson(key);
  if (!p || !p.open.length) { toast("Nothing open with this person"); return; }
  const openAcc = S.accounts.filter(a => !a.is_closed);
  const cur = CUR(); const isVND = cur === "VND";
  const fmtAmt = v => !v ? "" : (isVND ? nf0.format(v) : String(v));
  // Oldest open debt first — that's the default the picker lands on.
  const list = p.open.slice().sort((a,b) => a.s.last.localeCompare(b.s.last));
  let pick = list[0];
  const st = { amount: pick.s.outstanding, acc: openAcc[0]?.id, date: todayISO(), notes: "" };

  openModal(`<div id="dpBody"></div>`);
  const render = () => {
    const { d, s } = pick;
    const intoAcc = d.direction === "lent";     // they pay you back → money comes in
    const label = n => `${n.s.last ? monthLabel(n.s.last.slice(0,7)) : "Undated"} · ${fmt(n.s.outstanding,cur)}${n.d.notes ? ` · ${n.d.notes}` : ""}`;
    el("dpBody").innerHTML = `
      <h3>${esc(d.direction === "lent" ? `${p.name} pays you back` : `Pay ${p.name} back`)}</h3>
      <div class="m-sub">${fmt(s.outstanding,cur)} outstanding on this one${p.open.length > 1 ? ` · ${p.open.length} open with ${esc(p.name)}` : ""}.</div>
      ${list.length > 1 ? `<div class="field"><label>Which debt</label>
        <div class="chiprow">${list.map(n => `<button class="chip ${n.d.id===d.id?"on":""}" data-debt="${n.d.id}" style="border-radius:9px">${esc(label(n))}</button>`).join("")}</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:7px">One payment settles one debt. Paying off two at once is two entries.</div></div>` : ""}
      <div class="amt-panel">
        <label class="flabel">Amount</label>
        <div class="amt-line"><input id="dpAmt" inputmode="numeric" placeholder="0" value="${fmtAmt(st.amount)}"><span class="cursym">${isVND?"₫":cur}</span></div>
        <div class="amt-meta"><span id="dpWords">${st.amount?fmt(st.amount,cur):""}</span>
          <span style="display:flex;gap:6px">${s.outstanding ? `<button class="qchip" id="dpAll">All ${fmt(s.outstanding,cur)}</button>` : ""}<button class="qchip" id="dpClr">Clear</button></span></div>
      </div>
      <div class="field"><label>${intoAcc ? "Into account" : "From account"}</label>
        <div class="chiprow">${openAcc.map(a => `<button class="chip ${st.acc===a.id?"on":""}" data-acc="${a.id}">${esc(a.name)}</button>`).join("")}</div></div>
      <div class="field"><label>Date</label><input id="dpDate" type="date" value="${st.date}"></div>
      <div class="field"><label>Notes <span style="text-transform:none;letter-spacing:0;font-weight:400">· optional</span></label><input id="dpNotes" value="${esc(st.notes)}" placeholder="e.g. bank transfer"></div>
      <div class="m-foot"><button class="btn btn-ghost" id="dpCancel">Cancel</button>
        <button class="btn btn-primary" style="width:auto" id="dpSave">Save</button></div>`;
    wire();
  };

  const keep = () => { st.date = el("dpDate").value; st.notes = el("dpNotes").value; };
  const wire = () => {
    const { d, s } = pick;
    const amt = el("dpAmt");
    amt.oninput = () => { st.amount = Number(amt.value.replace(/[^\d]/g,"")) || 0; amt.value = fmtAmt(st.amount); el("dpWords").textContent = st.amount ? fmt(st.amount,cur) : ""; };
    const all = el("dpAll"); if (all) all.onclick = () => { st.amount = s.outstanding; amt.value = fmtAmt(st.amount); el("dpWords").textContent = fmt(st.amount,cur); };
    el("dpClr").onclick = () => { st.amount = 0; amt.value = ""; el("dpWords").textContent = ""; };
    // Switching debt re-aims the "All" default at the new outstanding.
    document.querySelectorAll("#dpBody [data-debt]").forEach(b => b.onclick = () => {
      keep(); pick = list.find(n => n.d.id === b.dataset.debt); st.amount = pick.s.outstanding; render(); });
    document.querySelectorAll("#dpBody [data-acc]").forEach(b => b.onclick = () => { st.acc = b.dataset.acc;
      document.querySelectorAll("#dpBody [data-acc]").forEach(x => x.classList.toggle("on", x.dataset.acc === st.acc)); });
    el("dpCancel").onclick = () => personSheet(key);
    el("dpSave").onclick = guardBtn(async () => {
      keep();
      if (!st.amount) return toast("Enter an amount");
      // lent → the repayment comes in (+); borrowed → it goes out (−)
      const sign = d.direction === "lent" ? 1 : -1;
      const space = debtSpace();
      await rest("transactions", { method: "POST", body: { account_id: st.acc, date: st.date, debt_id: d.id, amount: sign * st.amount,
        payee: d.person, category_id: systemCat(space, "debt")?.id || null, space_id: space, notes: st.notes.trim() || "Repayment", cleared: true } });
      const after = s.outstanding - st.amount;
      if (after <= 0.005 && !d.is_closed) await rest(`debts?id=eq.${d.id}`, { method: "PATCH", body: { is_closed: true } });
      closeModal(); toast(after <= 0.005 ? `Settled with ${p.name} 🎉` : `Saved · ${fmt(Math.max(0,after),cur)} left`); refresh();
    });
  };
  render();
}

/* Everything you have with one person: where you stand, each separate debt,
   and the whole movement history across all of them. This is the level the
   list opens into, and the only place a payment is recorded. */
function personSheet(key) {
  const p = debtPerson(key);
  if (!p) { toast("No debts with this person"); return go("debts"); }
  const cur = CUR();
  const stance = !p.open.length ? "Settled up"
    : p.mixed ? `${fmt(p.owed,cur)} owed to you · ${fmt(p.owe,cur)} owed by you`
    : p.net > 0 ? `${fmt(p.net,cur)} owed to you` : `${fmt(-p.net,cur)} owed by you`;

  const debtRow = ({ d, s }) => `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)">
    <span style="flex:1;min-width:0">
      <span style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
        <b style="font-size:13.5px">${d.direction === "lent" ? "You paid" : "They paid"} ${fmt(s.principal,cur)}</b>
        ${d.is_closed ? "" : `<span class="tag ${d.direction==="lent"?"income":"brass"}">${d.direction==="lent"?"owes you":"you owe"}</span>`}
      </span>
      <span style="display:block;font-size:12px;color:var(--ink-soft);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
        ${esc(d.notes || "No note")} · last ${s.last}${s.forgiven ? ` · ${fmt(s.forgiven,cur)} written off` : ""}</span>
    </span>
    <span class="mono ${d.is_closed ? "" : d.direction==="lent" ? "pos" : ""}" style="white-space:nowrap;font-size:13.5px;${d.is_closed?"color:var(--ink-soft)":d.direction==="borrowed"?"color:var(--brass)":""}">${d.is_closed ? "✓ settled" : fmt(s.outstanding,cur)}</span>
    <button class="sq" data-debt="${d.id}" title="Debt details">⋯</button>
  </div>`;

  openModal(`<h3>${esc(p.name)}</h3>
    <div class="m-sub">${stance}${p.open.length ? ` · ${p.open.length} open` : ""}${p.settled.length ? ` · ${p.settled.length} settled` : ""}</div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      ${p.open.length ? `<button class="btn btn-primary btn-sm" style="width:auto" id="psPay">Record payment</button>` : ""}
      <button class="btn btn-ghost btn-sm" id="psNew">New debt</button>
      <button class="btn btn-ghost btn-sm" id="psRename">Rename</button>
    </div>

    ${p.open.length ? `<div class="field"><label>Open</label>${p.open.map(debtRow).join("")}</div>` : ""}
    ${p.settled.length ? `<div class="field" style="opacity:.7"><label>Settled</label>${p.settled.map(debtRow).join("")}</div>` : ""}

    <div class="field"><label>History · ${p.tx.length} movement${p.tx.length===1?"":"s"}</label>
      ${p.tx.length ? `<div style="max-height:210px;overflow:auto;border:1px solid var(--line-soft);border-radius:10px;padding:4px 10px">
        ${p.tx.map(t => `<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px">
          <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.date} · ${esc(t.notes||t.payee||"")} <span style="color:var(--ink-soft)">(${esc(accName(t.account_id))})</span></span>
          <span class="mono ${+t.amount>0?"pos":"neg"}" style="white-space:nowrap">${fmtSigned(t.amount,cur)}</span>
        </div>`).join("")}</div>` : `<div style="font-size:13px;color:var(--ink-soft)">No movements yet.</div>`}
    </div>

    <div class="m-foot"><button class="btn btn-primary" style="width:auto" id="psClose">Done</button></div>`);

  el("psClose").onclick = () => closeModal();
  const pay = el("psPay"); if (pay) pay.onclick = () => debtPayForm(key);
  el("psNew").onclick = () => debtForm(p.name);
  el("psRename").onclick = () => renamePerson(p);
  document.querySelectorAll("#modalBox [data-debt]").forEach(b => b.onclick = () =>
    debtManage(S.debts.find(d => d.id === b.dataset.debt), key));
}

/* Renaming is a property of the person, so it moves every debt filed under
   them at once — otherwise the list would split them into two people. */
function renamePerson(p) {
  openModal(`<h3>Rename ${esc(p.name)}</h3>
    <div class="m-sub">Applies to all ${p.debts.length} debt${p.debts.length===1?"":"s"} with them, and to the payee on their transactions.</div>
    <div class="field"><label>Name</label><input id="rpName" value="${esc(p.name)}"></div>
    <div class="m-foot"><button class="btn btn-ghost" id="rpCancel">Cancel</button>
      <button class="btn btn-primary" style="width:auto" id="rpSave">Save</button></div>`);
  el("rpCancel").onclick = () => personSheet(p.key);
  el("rpSave").onclick = guardBtn(async () => {
    const name = el("rpName").value.trim();
    if (!name) return toast("Name the person");
    const ids = p.debts.map(x => x.d.id);
    await rest(`debts?id=in.(${ids.join(",")})`, { method: "PATCH", body: { person: name } });
    const txIds = p.tx.map(t => t.id);
    if (txIds.length) await rest(`transactions?id=in.(${txIds.join(",")})`, { method: "PATCH", body: { payee: name } });
    closeModal(); toast(`Renamed to ${name}`); refresh();
  });
}

/* One debt on its own: its note, its movements, and the option to remove the
   record. Payment lives on the person, so it isn't repeated here. */
function debtManage(d, backKey) {
  const cur = CUR();
  const s = debtStats(d);
  const back = () => backKey ? personSheet(backKey) : closeModal();
  openModal(`<h3>${esc(d.person)} <span class="tag ${d.direction==="lent"?"income":"brass"}" style="vertical-align:2px">${d.direction==="lent"?"owes you":"you owe"}</span></h3>
    <div class="m-sub">${d.is_closed ? "Settled." : `${fmt(s.outstanding,cur)} outstanding`} · ${fmt(s.principal,cur)} total${s.forgiven ? ` · ${fmt(s.forgiven,cur)} written off` : ""}</div>
    <div class="field"><label>Notes</label><input id="dmNotes" value="${esc(d.notes||"")}" placeholder="What it was for, agreed terms…"></div>
    <div class="field"><label>History</label>
      ${s.tx.length ? `<div style="max-height:180px;overflow:auto;border:1px solid var(--line-soft);border-radius:10px;padding:4px 10px">
        ${s.tx.slice().reverse().map(t => `<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px">
          <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.date} · ${esc(t.notes||t.payee||"")} <span style="color:var(--ink-soft)">(${esc(accName(t.account_id))})</span></span>
          <span class="mono ${+t.amount>0?"pos":"neg"}" style="white-space:nowrap">${fmtSigned(t.amount,cur)}</span>
        </div>`).join("")}</div>` : `<div style="font-size:13px;color:var(--ink-soft)">No linked transactions.</div>`}
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--line-soft)">
      <button class="btn btn-danger" id="dmDel">Delete</button>
      <span style="display:flex;gap:8px"><button class="btn btn-ghost" id="dmBack">Back</button>
      <button class="btn btn-primary" style="width:auto" id="dmSave">Save</button></span>
    </div>`);
  el("dmBack").onclick = back;
  el("dmSave").onclick = guardBtn(async () => {
    await rest(`debts?id=eq.${d.id}`, { method: "PATCH", body: { notes: el("dmNotes").value.trim() || null } });
    closeModal(); toast("Updated"); refresh();
  });
  el("dmDel").onclick = async () => {
    if (!confirm(`Delete this debt record? Its ${s.tx.length} linked transaction${s.tx.length===1?"":"s"} stay in your accounts, still filed under Debt so they keep out of your spending reports.`)) return;
    await rest(`debts?id=eq.${d.id}`, { method: "DELETE" });
    closeModal(); toast("Debt deleted"); refresh();
  };
}

/* ============ Reconciliation ============ */
function reconcileView(a) {
  el("viewTitle").textContent = `Reconcile — ${a.name}`;
  el("topLeft").innerHTML = "";              // no month here — this is a whole-account view
  el("topActions").innerHTML = `<button class="btn btn-ghost btn-sm" id="recBack">← Back</button>`;
  el("recBack") && (el("recBack").onclick = () => go("accounts"));
  const txs = S.txs.filter(t => t.account_id === a.id).sort((x,y) => y.date.localeCompare(x.date));
  const clearedBal = Number(a.starting_balance) + txs.filter(t => t.cleared).reduce((s,t) => s + +t.amount, 0);
  const target = S.recTarget ?? clearedBal;
  const diff = target - clearedBal;
  const done = Math.abs(diff) < 0.005;
  el("viewBody").innerHTML = `
    <div class="card">
      <div class="grid grid-3">
        <div><h3>Statement balance</h3><input id="recTarget" inputmode="decimal" value="${S.recTarget ?? ""}" placeholder="${clearedBal}" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-family:var(--mono);text-align:right"></div>
        <div><h3>Cleared balance</h3><div class="mono" style="font-size:20px;padding-top:5px">${fmt(clearedBal, a.currency)}</div></div>
        <div><h3>Difference</h3><div class="mono ${done?"pos":"neg"}" style="font-size:20px;padding-top:5px">${done ? "✓ " : ""}${fmt(diff, a.currency)}</div></div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" id="recFinish" ${done ? "" : "disabled style='opacity:.5'"}>Finish reconciliation</button>
        ${!done && S.recTarget != null ? `<button class="btn btn-ghost btn-sm" id="recAdjust">Add ${fmt(diff, a.currency)} adjustment</button>` : ""}
      </div>
      <div style="margin-top:8px;font-size:12.5px;color:var(--ink-soft)">Enter your bank statement's balance, then tick transactions until the difference reaches zero. Finishing locks all cleared transactions.</div>
    </div>
    <div class="card">
      ${txs.length ? `<table class="tbl"><tr><th></th><th>Date</th><th>Payee</th><th class="num">Amount</th></tr>
        ${txs.map(t => `<tr style="${t.reconciled?"opacity:.55":""}">
          <td>${t.reconciled ? `<button class="clr-dot lock" data-ru="${t.id}" title="Click to unlock">🔒</button>` : `<button class="clr-dot ${t.cleared?"on":""}" data-rc="${t.id}">${t.cleared?"✓":""}</button>`}</td>
          <td class="mono" style="font-size:12.5px">${t.date}</td>
          <td>${esc(t.payee || catName(t.category_id))}</td>
          <td class="num ${t.amount>0?"pos":"neg"}">${fmtSigned(t.amount, a.currency)}</td>
        </tr>`).join("")}</table>` : `<div class="empty">No transactions in this account yet.</div>`}
    </div>`;
  el("recTarget").onchange = e => { S.recTarget = e.target.value === "" ? null : Number(e.target.value); reconcileView(a); };
  document.querySelectorAll("[data-rc]").forEach(b => b.onclick = async () => {
    const t = S.txs.find(x => x.id === b.dataset.rc);
    await rest(`transactions?id=eq.${t.id}`, { method: "PATCH", body: { cleared: !t.cleared } });
    t.cleared = !t.cleared; reconcileView(a);
  });
  document.querySelectorAll("[data-ru]").forEach(b => b.onclick = async () => {
    const t = S.txs.find(x => x.id === b.dataset.ru);
    if (!confirm("Unlock this reconciled transaction? It'll be editable again.")) return;
    await rest(`transactions?id=eq.${t.id}`, { method: "PATCH", body: { reconciled: false } });
    t.reconciled = false; reconcileView(a);
  });
  const fin = el("recFinish");
  if (fin && done) fin.onclick = async () => {
    await rest(`transactions?account_id=eq.${a.id}&cleared=is.true&reconciled=is.false`, { method: "PATCH", body: { reconciled: true } });
    S.recTarget = null; toast("Reconciled — cleared transactions locked"); await loadAll(); go("accounts");
  };
  const adj = el("recAdjust");
  if (adj) adj.onclick = async () => {
    await rest("transactions", { method: "POST", body: { account_id: a.id, date: todayISO(), amount: diff, payee: "Reconciliation adjustment", cleared: true } });
    await loadAll(); reconcileView(a);
  };
}

function holdForm() {
  openModal(`<h3>New holding</h3><div class="m-sub">An asset you own — ETF, stock, fund, crypto, or gold.</div>
    <div class="field"><label>Name</label><input id="fName" placeholder="e.g. DCVFMVN30 ETF"></div>
    <div class="row2">
      <div class="field"><label>Symbol</label><input id="fSym" placeholder="E1VFVN30"></div>
      <div class="field"><label>Type</label><select id="fType">${["etf","stock","fund","crypto","bond","gold","other"].map(t=>`<option>${t}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label>Currency</label><select id="fCur">${["VND","USD"].map(c=>`<option>${c}</option>`).join("")}</select></div>
    <div class="m-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" style="width:auto" id="fSave">Add holding</button></div>`);
  el("fSave").onclick = guardBtn(async () => {
    const name = el("fName").value.trim(); if (!name) return toast("Name the holding");
    await rest("holdings", { method: "POST", body: { name, symbol: el("fSym").value.trim() || null, asset_type: el("fType").value, currency: el("fCur").value } });

  });

function invTxForm() {
  if (!S.holdings.length) { toast("Add a holding first"); return holdForm(); }
  let kind = "buy";
  openModal(`<h3>Log investment activity</h3><div class="m-sub">Buys and sells update quantity; dividends and fees are cash only.</div>
    <div class="seg" id="segK">${["buy","sell","dividend","fee"].map(k=>`<button data-k="${k}" class="${k==="buy"?"on":""}">${k[0].toUpperCase()+k.slice(1)}</button>`).join("")}</div>
    <div class="field"><label>Holding</label><select id="fHold">${S.holdings.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join("")}</select></div>
    <div class="field"><label>Date</label><input id="fDate" type="date" value="${todayISO()}"></div>
    <div class="row2" id="wQty">
      <div class="field"><label>Quantity</label><input id="fQty" inputmode="decimal" placeholder="0"></div>
      <div class="field"><label>Price / unit</label><input id="fPrice" inputmode="decimal" placeholder="0"></div>
    </div>
    <div class="field"><label id="lAmt">Total amount (auto = qty × price if left blank)</label><input id="fAmt" inputmode="decimal" placeholder="0"></div>
    <div class="field"><label>Notes</label><input id="fNotes" placeholder="fees, order id…"></div>
    <div class="m-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" style="width:auto" id="fSave">Save</button></div>`);
  const sync = () => {
    el("wQty").classList.toggle("hidden", kind === "dividend" || kind === "fee");
    el("lAmt").textContent = (kind==="buy"||kind==="sell") ? "Total amount (auto = qty × price if left blank)" : "Amount";
    document.querySelectorAll("#segK button").forEach(b => b.classList.toggle("on", b.dataset.k === kind));
  };
  document.querySelectorAll("#segK button").forEach(b => b.onclick = () => { kind = b.dataset.k; sync(); });
  el("fSave").onclick = guardBtn(async () => {
    const qty = parseNum(el("fQty").value), price = parseNum(el("fPrice").value);
    let amt = parseNum(el("fAmt").value);
    if (!amt && qty && price) amt = qty * price;
    if (!amt) return toast("Enter an amount");
    const sign = (kind === "buy" || kind === "fee") ? -1 : 1;
    await rest("investment_transactions", { method: "POST", body: {
      holding_id: el("fHold").value, date: el("fDate").value, type: kind,
      quantity: (kind==="buy"||kind==="sell") ? qty : 0, price, amount: sign * Math.abs(amt),
      notes: el("fNotes").value.trim() || null } });
    if (kind === "buy" && price) await rest(`holdings?id=eq.${el("fHold").value}`, { method: "PATCH", body: { current_price: price, price_updated_at: new Date().toISOString() } });
    closeModal(); toast("Saved"); refresh();
  });
}

  });
}

/* ============ Auth UI ============ */
let mode = "signin";
function setMode(m) {
  mode = m;
  el("tabSignin").classList.toggle("on", m === "signin");
  el("tabSignup").classList.toggle("on", m === "signup");
  el("authBtn").textContent = m === "signin" ? "Sign in" : "Create account";
  el("authPass").autocomplete = m === "signin" ? "current-password" : "new-password";
  el("authMsg").textContent = "";
}
el("tabSignin").onclick = () => setMode("signin");
el("tabSignup").onclick = () => setMode("signup");
el("authPass").addEventListener("keydown", e => { if (e.key === "Enter") el("authBtn").click(); });
el("authBtn").onclick = async () => {
  const email = el("authEmail").value.trim(), password = el("authPass").value;
  const msg = el("authMsg"); msg.className = "auth-msg";
  if (!email || !password) { msg.classList.add("err"); msg.textContent = "Enter your email and a password."; return; }
  el("authBtn").disabled = true; msg.textContent = "Working…";
  try {
    if (mode === "signup") {
      const d = await authReq("signup", { email, password });
      if (d.access_token) { saveSession(d); await enterApp(); }
      else { msg.textContent = "Check your inbox to confirm your email, then sign in here."; }
    } else {
      const d = await authReq("token?grant_type=password", { email, password });
      saveSession(d); await enterApp();
    }
  } catch(e) { msg.classList.add("err"); msg.textContent = e.message; }
  el("authBtn").disabled = false;
};
el("signOutBtn").onclick = signOut;

function showAuth() {
  el("app").classList.add("hidden");
  el("authView").classList.remove("hidden");
}
async function enterApp() {
  el("authView").classList.add("hidden");
  el("app").classList.remove("hidden");
  renderNav();
  await loadAll();
  go(HOME);
}

/* ============ Boot ============ */
(async () => {
  if (await restoreSession()) {
    try { await enterApp(); }
    catch (e) {
      console.error(e);
      /* Only a real rejection sends you back to the sign-in screen. A dead
         network keeps you signed in with a retry button. */
      if (isAuthFatal(e)) { saveSession(null); showAuth(); }
      else {
        el("viewBody").innerHTML = `<div class="card empty">
          <div style="margin-bottom:12px">${esc(e.message)}</div>
          <button class="btn btn-ghost btn-sm" id="bootRetry">Try again</button></div>`;
        el("bootRetry").onclick = () => location.reload();
      }
    }
    el("boot").remove();
    return;
  }
  showAuth();
  el("boot").remove();
})();

</script>
</body>
</html>
