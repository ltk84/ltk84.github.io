      <button class="more-row" data-go="accounts">${IC.acc}<span>Accounts</span><em>${openAcc}</em>${chev}</button>
      <button class="more-row" data-go="invest">${IC.inv}<span>Investments</span><em>${p.marketValue ? smv(p.marketValue) : "none"}</em>${chev}</button>
      <button class="more-row" data-go="debts">${IC.debt}<span>Debts</span><em>${openDebts ? smvS(owedToMe - iOwe) : "none open"}</em>${chev}</button>
    </div>
    <div class="more-card">
      <button class="more-row" id="mSpaces"><i style="width:19px;height:19px;border-radius:5px;flex:none;font-style:normal;background:${S.activeSpace === "all" ? "#9AAAA4" : spaceColor(S.activeSpace)}"></i><span>Budget spaces</span><em style="font-family:var(--sans)">${esc(S.activeSpace === "all" ? "All spaces" : spaceName(S.activeSpace))}</em>${chev}</button>
      <button class="more-row" id="mCats">${IC.cats}<span>Categories &amp; groups</span><em>${S.cats.filter(c => groupInSpace(S.groups.find(g => g.id === c.group_id) || {})).length}</em>${chev}</button>
      <button class="more-row" id="mHelp">${IC.help}<span>How Ledger works</span>${chev}</button>
    </div>
    <div class="card">
      <div class="more-mail">${esc(session?.user?.email || "")}</div>
      <button class="more-row out" id="mOut">${IC.out}<span>Sign out</span></button>
    </div>`;
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  el("mSpaces").onclick = spaceForm;
  el("mCats").onclick = catManageSheet;
  el("mHelp").onclick = helpSheet;
  el("mOut").onclick = signOut;
},

async transactions() {
  const cur = CUR(); const f = S.txFilter; const m = S.txMonth;
  const kindOf = t => t.transfer_account_id ? "transfer" : (+t.amount > 0 ? "income" : "expense");

  /* Two kinds of narrowing, and only one of them may touch the balance column.
     Picking an account — or a side of the budget — chooses *whose* ledger you
     are reading, so the running balance has to be that set's balance. Kind,
     search and uncleared only hide rows of the same ledger: a balance that
     summed nothing but income would be a number about nothing. */
  const inBudgetScope = onB => f.budget === "all" || onB === (f.budget === "on");
  const scopeAccounts = S.accounts.filter(a =>
    (!f.account || a.id === f.account) && inBudgetScope(a.on_budget !== false));
  const scopeIds = new Set(scopeAccounts.map(a => a.id));

  // Running balance over every transaction in scope, newest first
  const scope = S.txs.filter(t => scopeIds.has(t.account_id));
  let bal = scopeAccounts.reduce((s,a) => s + accBalance(a), 0);
  const withBal = scope.map(t => { const r = { t, bal }; bal -= +t.amount; return r; });
  const allTime = m === "all";
  const monthRows = allTime ? withBal : withBal.filter(r => ym(r.t.date) === m);
  const mtx = monthRows.map(r => r.t);

  const monthOut = mtx.filter(t => kindOf(t) === "expense" && !isDebtTx(t) && !t.opening && spaceOK(t)).reduce((s,t) => s + Math.abs(+t.amount), 0);
  const monthIn  = mtx.filter(t => kindOf(t) === "income" && !isDebtTx(t) && !t.opening && spaceOK(t)).reduce((s,t) => s + +t.amount, 0);
  const unclearedSum = mtx.filter(t => !t.cleared && !t.reconciled && spaceOK(t)).reduce((s,t) => s + +t.amount, 0);

  const [yy, mm] = m.split("-").map(Number);
  const dim = new Date(yy, mm, 0).getDate();
  const byDay = {};
  if (!allTime) mtx.forEach(t => { if (kindOf(t) === "transfer" || isDebtTx(t) || t.opening || !spaceOK(t)) return; const d = +t.date.slice(8);
    byDay[d] = byDay[d] || { in: 0, out: 0 };
    if (kindOf(t) === "income") byDay[d].in += +t.amount; else byDay[d].out += Math.abs(+t.amount); });
  const inPeak = Math.max(1, ...Object.values(byDay).map(v => v.in));
  const outPeak = Math.max(1, ...Object.values(byDay).map(v => v.out));
  const barsHTML = Array.from({ length: dim }, (_, i) => {
    const v = byDay[i+1] || { in: 0, out: 0 };
    const ih = v.in ? Math.max(8, v.in / inPeak * 46) : 0;
    const oh = v.out ? Math.max(8, v.out / outPeak * 46) : 0;
    return `<div class="day" title="${m}-${String(i+1).padStart(2,"0")} · in ${fmt(v.in,cur)} · out ${fmt(v.out,cur)}"><i class="in" style="height:${ih}%"></i><i class="out" style="height:${oh}%"></i><i class="base"></i></div>`;
  }).join("");
  const axis = [...new Set([1, 8, 15, 22, dim])].map(d => `<span>${String(d).padStart(2,"0")}</span>`).join("");

  const dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const dayLabel = ds => { const d = new Date(ds + "T00:00:00"); return `${dayNames[d.getDay()]} ${String(d.getDate()).padStart(2,"0")} ${d.toLocaleDateString("en-GB",{month:"short"})}`; };

  // Account and on/off budget are already applied above, in the scope.
  const shownRows = () => {
    const q = f.q.trim().toLowerCase();
    return monthRows.filter(r => { const t = r.t;
      if (!spaceOK(t)) return false;
      if (f.kind !== "all" && kindOf(t) !== f.kind) return false;
      if (f.uncleared && (t.cleared || t.reconciled)) return false;
      if (q && !((t.payee||"").toLowerCase().includes(q) || (t.notes||"").toLowerCase().includes(q) || catName(t.category_id).toLowerCase().includes(q))) return false;
      return true; });
  };
  const filterCount = (f.kind !== "all" ? 1 : 0) + (f.budget !== "all" ? 1 : 0)
    + (f.account ? 1 : 0) + (f.uncleared ? 1 : 0);

  const XFER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h13m0 0-4-4m4 4-4 4M17 17H4m0 0 4 4m-4-4 4-4"/></svg>';
  /* What the row calls its category: transfers, opening balances and debt
     movements have no envelope, but they do have a name for what they are. */
  const catLabel = (t, k) => t.opening ? (t.category_id ? catName(t.category_id) : SYSTEM_CAT_NAME)
    : isDebtTx(t) ? (t.category_id ? catName(t.category_id) : "Debt")
    : k === "transfer" ? "Transfer" : (t.category_id ? catName(t.category_id) : "—");

  const ledgerHTML = () => {
    const rows = shownRows();
    /* Where the editable row goes: in place of the row being edited, or as a
       blank row at the top for a new transaction — and also at the top for an
       edit whose row the current filters hide, so it never renders nowhere. */
    const editId = txOpen?.id || null;
    const inline = txOpen && !isPhone();     // on a phone the composer is a sheet
    const inRow = inline && editId && rows.some(r => r.t.id === editId);
    const slot = `<div id="txInline"></div><div id="txSplitBand"></div>`;
    const gm = new Map();
    rows.forEach(r => { if (!gm.has(r.t.date)) gm.set(r.t.date, []); gm.get(r.t.date).push(r); });
    const groups = [...gm.entries()].map(([date, list]) => {
      const net = list.reduce((s,r) => s + +r.t.amount, 0);
      return `<div><div class="day-head reg"><b>${dayLabel(date)}</b><span>${fmtSigned(net,cur)}</span></div>
        ${list.map(({t, bal}) => {
          if (inline && editId === t.id) return slot;      // this row *is* the editor
          const k = kindOf(t);
          const soft = k === "transfer" || t.opening || isDebtTx(t);
          const dot = t.reconciled ? `<button class="clr-dot lock" data-u="${t.id}" title="Reconciled — click to unlock">🔒</button>`
            : `<button class="clr-dot ${t.cleared?"on":""}" data-c="${t.id}" title="${t.cleared?"Cleared":"Uncleared"}">${t.cleared?"✓":""}</button>`;
          return `<div class="led-row ${t.reconciled?"locked":""}" data-row="${t.id}">
            <span class="led-clr">${dot}</span>
            <span class="led-date">${esc(t.date.slice(8))}/${esc(t.date.slice(5,7))}</span>
            <span class="led-main">
              <span class="nm">${k === "transfer" ? XFER : ""}${esc(t.payee || "")}</span>
              <span class="nm-m">${k === "transfer" ? XFER : ""}${esc(t.payee || catLabel(t, k))}</span>
              <span class="sub-m">${esc(t.payee ? catLabel(t, k) + " · " + accName(t.account_id) : accName(t.account_id))}${!t.cleared && !t.reconciled ? ' <b style="color:var(--brass);font-weight:600">· uncleared</b>' : ""}</span>
            </span>
            <span class="led-cat ${soft?"soft":""}">${esc(catLabel(t, k))}</span>
            <span class="led-acc">${esc(accName(t.account_id))}</span>
            <span class="led-note">${esc(t.notes || "")}</span>
            <span class="led-amt ${k==="income"?"pos":soft?"amt-soft":""}">${fmtSigned(t.amount,cur)}<span class="led-bal-m">${fmt(bal,cur)}</span></span>
            <span class="led-bal">${fmt(bal,cur)}</span>
            <span></span>
          </div>`; }).join("")}
      </div>`; }).join("");
    const net = rows.reduce((s,r) => s + +r.t.amount, 0);
    return `
      <div class="led-head"><span title="Cleared">✓</span><span>Date</span><span>Payee</span><span>Category</span><span>Account</span><span>Note</span><span class="r">Amount</span><span class="r">Balance</span><span></span></div>
      ${inline && !inRow ? (txOpen.id ? "" : `<div class="led-kbd"><span><b>Tab</b> next field</span><span><b>⏎</b> add &amp; keep the row open</span><span><b>⇧⏎</b> add &amp; close</span><span><b>esc</b> cancel</span><span class="sp">date + account stay filled for the next one</span></div>`) + slot : ""}
      ${groups || `<div class="empty">No transactions match in ${allTime ? "any month" : monthLabel(m)}.</div>`}
      <div class="led-foot">
        <span>${rows.length} of ${monthRows.length} ${allTime ? "all time" : "in " + monthLabel(m)} · net ${fmtSigned(net,cur)}</span>
        <span style="display:flex;align-items:center;gap:6px"><i class="clr-dot" style="width:14px;height:14px"></i>uncleared <i class="clr-dot on" style="width:14px;height:14px;margin-left:8px"></i>cleared <span style="margin-left:8px">🔒 reconciled</span> ${infoDot("uncleared")}</span>
      </div>`;
  };

  const curM = ym(new Date());
  const FILTER_IC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><path d="M3 6h18M6 12h12M10 18h4"/></svg>';
  const SEARCH_IC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  /* A phone has no room for a 250px field, a labelled button and a primary all
     on one line, so search and filter collapse to two 38px buttons over the
     same sheet, and the FAB is the composer. */
  const phone = isPhone();

  /* Desktop's inline search + filter row (Kind, Budget, Account, Uncleared)
     sits above the register itself instead of behind a Filter button/sheet —
     see filt-row in the CSS. A phone has no room for it, so it keeps the old
     search+filter icon pair over filterSheet(). */
  const filterRowHTML = () => {
    const kindCur = TX_KIND_META.find(o => o[0] === f.kind) || TX_KIND_META[0];
    const budCur = TX_BUDGET_META.find(o => o[0] === f.budget) || TX_BUDGET_META[0];
    const onAcc = S.accounts.filter(a => a.on_budget !== false);
    const offAcc = S.accounts.filter(a => a.on_budget === false);
    const accCur = f.account ? S.accounts.find(a => a.id === f.account) : null;
    const ddBtn = (key, label, icon, iconColor, text) => `
      <button class="filt-btn ${filtOpen === key ? "open" : ""}" data-fdd="${key}">
        <span class="filt-lbl">${label}</span>
        ${icon ? `<span class="filt-ic" style="color:${iconColor}">${icon}</span>` : ""}
        <span>${esc(text)}</span><em>▾</em>
      </button>`;
    const opt = (key, val, name, icon, iconColor, on) => `
      <button class="filt-opt ${on ? "on" : ""}" data-fopt="${key}" data-fval="${esc(val)}">
        ${icon ? `<span class="filt-ic" style="color:${iconColor}">${icon}</span>` : ""}
        <span class="filt-opt-name">${esc(name)}</span>
        ${on ? '<span class="filt-check">✓</span>' : ""}
      </button>`;
    return `<div class="filt-row">
      <div class="tx-search filt-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="fRowQ" value="${esc(f.q)}" placeholder="Search payee, note or category…">
      </div>
      <div class="filt-dd">
        ${ddBtn("kind", "Kind", kindCur[2], kindCur[3], kindCur[1])}
        ${filtOpen === "kind" ? `<div class="filt-pop">${TX_KIND_META.map(o => opt("kind", o[0], o[1], o[2], o[3], o[0] === f.kind)).join("")}</div>` : ""}
      </div>
      <div class="filt-dd">
        ${ddBtn("budget", "Budget", budCur[2], budCur[3], budCur[1])}
        ${filtOpen === "budget" ? `<div class="filt-pop">${TX_BUDGET_META.map(o => opt("budget", o[0], o[1], o[2], o[3], o[0] === f.budget)).join("")}</div>` : ""}
      </div>
      <div class="filt-dd">
        ${ddBtn("account", "Account", "", "", accCur ? accCur.name : "All accounts")}
        ${filtOpen === "account" ? `<div class="filt-pop filt-pop-acc">
          <div class="filt-pop-h">On budget</div>
          ${opt("account", "", "All accounts", "", "", !f.account)}
          ${onAcc.map(a => opt("account", a.id, a.name, "", "", f.account === a.id)).join("")}
          ${offAcc.length ? `<div class="filt-pop-h">Off budget</div>${offAcc.map(a => opt("account", a.id, a.name, "", "", f.account === a.id)).join("")}` : ""}
        </div>` : ""}
      </div>
      <label class="filt-uncl"><input type="checkbox" id="fRowUc" ${f.uncleared ? "checked" : ""}> Uncleared only</label>
      <button class="filt-clear" id="fRowClear">Clear all</button>
    </div>`;
  };
  const bindFilter = () => {
    document.querySelectorAll("#filtRow [data-fdd]").forEach(b => b.onclick = e => {
      e.stopPropagation();
      filtOpen = filtOpen === b.dataset.fdd ? null : b.dataset.fdd;
      paintFilter();
    });
    // Kind and Uncleared only hide rows within the same accounts, so a light
    // ledger repaint is enough; Budget and Account change *which* accounts
    // are in scope, which the header totals and balances are computed from,
    // so those need the full view reload filterSheet's Apply already used.
    document.querySelectorAll("#filtRow [data-fopt]").forEach(b => b.onclick = e => {
      e.stopPropagation();
      const key = b.dataset.fopt, val = b.dataset.fval;
      filtOpen = null;
      if (key === "kind") { f.kind = val; paintFilter(); paint(); return; }
      if (key === "budget") {
        f.budget = val;
        if (f.account && val !== "all" && onBudgetOf(f.account) !== (val === "on")) f.account = "";
        go("transactions"); return;
      }
      f.account = val;
      if (val && f.budget !== "all" && onBudgetOf(val) !== (f.budget === "on")) f.budget = "all";
      go("transactions");
    });
    const q = el("fRowQ");
    if (q) q.oninput = e => { f.q = e.target.value; paint(); };
    const uc = el("fRowUc");
    if (uc) uc.onchange = e => { f.uncleared = e.target.checked; paint(); };
    const clr = el("fRowClear");
    if (clr) clr.onclick = () => { Object.assign(f, { kind: "all", budget: "all", account: "", uncleared: false, q: "" }); go("transactions"); };
  };
  const paintFilter = () => { const w = el("filtRow"); if (w) { w.innerHTML = filterRowHTML(); bindFilter(); } };

  setBar({
    month: { label: allTime ? "All time" : monthLabel(m),
      prev: () => { S.txMonth = allTime ? curM : shiftMonth(m,-1); go("transactions"); },
      next: () => { S.txMonth = allTime ? curM : shiftMonth(m,1); go("transactions"); } },
    scope: { label: allTime ? "Monthly" : "All time", fn: () => { S.txMonth = allTime ? curM : "all"; go("transactions"); } },
    search: null,
    ghosts: phone
      ? [{ label: "", icon: SEARCH_IC, fn: () => filterSheet(true) },
         { label: filterCount ? String(filterCount) : "", icon: FILTER_IC, fn: () => filterSheet() }]
      : [],
    primary: phone ? null : { label: "+ Add", fn: () => txForm() }
  });
  // Four full VND figures won't sit on one 390px line; abbreviated, they do.
  const n = v => phone ? smv(v) : fmt(v, cur);
  const nS = v => phone ? smvS(v) : fmtSigned(v, cur);
  el("viewBody").innerHTML = `
    ${phone ? "" : `<div id="filtRow">${filterRowHTML()}</div>`}
    <div class="reg">
      <div class="tx-strip">
        <div class="cell"><span class="l">Out</span><b>${n(monthOut)}</b></div>
        <div class="cell"><span class="l">In</span><b class="pos">${n(monthIn)}</b></div>
        <div class="cell"><span class="l">Net</span><b>${nS(monthIn - monthOut)}</b></div>
        <div class="cell"><span class="l">Uncleared</span><b style="color:var(--brass)">${nS(unclearedSum)}</b></div>
        <div class="right"><span id="txCount"></span>
          ${allTime ? "" : `<button class="minibtn ${S.flowOpen?"on":""}" id="flowBtn">Daily flow ${S.flowOpen ? "▴" : "▾"}</button>`}</div>
      </div>
      ${!allTime && S.flowOpen ? `<div class="flow">
        <div class="flow-head"><b>Daily flow · ${esc(monthLabel(m))}</b>
          <div class="flow-legend"><span><i style="background:#5FBCA0"></i>in</span><span><i style="background:#E08D7B"></i>out</span><span style="opacity:.75">each scaled to its own peak</span></div></div>
        <div class="flow-bars">${barsHTML}</div>
        <div class="flow-axis">${axis}</div>
      </div>` : ""}
      <div class="ledger" id="ledgerWrap">${ledgerHTML()}</div>
    </div>
    <button class="fab" id="fabTx" title="New transaction">+</button>`;
  if (!phone) { repaintFilter = paintFilter; bindFilter(); }

  const bind = () => {
    document.querySelectorAll("#ledgerWrap [data-c]").forEach(b => b.onclick = async e => {
      e.stopPropagation();
      const t = S.txs.find(x => x.id === b.dataset.c);
      await rest(`transactions?id=eq.${t.id}`, { method: "PATCH", body: { cleared: !t.cleared } });
      t.cleared = !t.cleared; go("transactions");
    });
    document.querySelectorAll("#ledgerWrap [data-u]").forEach(b => b.onclick = async e => {
      e.stopPropagation();
      const t = S.txs.find(x => x.id === b.dataset.u);
      if (!confirm("Unlock this reconciled transaction? It'll be editable again.")) return;
      await rest(`transactions?id=eq.${t.id}`, { method: "PATCH", body: { reconciled: false } });
      t.reconciled = false; go("transactions");
    });
    document.querySelectorAll("#ledgerWrap [data-row]").forEach(r => r.onclick = () => {
      const t = S.txs.find(x => x.id === r.dataset.row);
      if (t.reconciled) return toast("Reconciled — locked");
      // Tapping the row being edited closes the form again.
      if (txOpen?.id === t.id && !isPhone()) closeTxForm(); else txForm(t);
    });
    el("txCount").textContent = `${shownRows().length} shown`;
  };
  /* Redrawing the ledger also re-seats the inline form, so opening, closing or
     moving it is just another repaint. The form's own state lives in `txOpen`,
     so a repaint mid-edit doesn't lose what's been typed. */
  const paint = () => {
    el("ledgerWrap").innerHTML = ledgerHTML(); bind(); mountTxForm();
    el("fabTx").style.display = txOpen ? "none" : "";   // an open form is already the composer
  };
  repaintLedger = paint;
  el("fabTx").onclick = () => txForm();
  const flow = el("flowBtn");
  if (flow) flow.onclick = () => { S.flowOpen = !S.flowOpen; go("transactions"); };
  paint();
},

async budget() {
  const m = S.budgetMonth;
  await loadBudgets();
  paintBudget();
},

async invest() {
  const cur = CUR(); const p = portfolio();
  setBar({ ghosts: [{ label: "+ Buy / Sell", fn: () => invTxForm() }], primary: { label: "+ Holding", fn: () => holdForm() } });
  el("viewBody").innerHTML = `
    <div class="hero" style="background:var(--pine)">
      <div class="lbl">Portfolio value</div><div class="big">${fmt(p.marketValue, cur)}</div>
      <div class="row">
        <div><div class="lbl">Cost basis</div><div class="val">${fmt(p.cost, cur)}</div></div>
        <div><div class="lbl">Unrealized P/L</div><div class="val" style="color:${p.pl>=0?"#8FE3C0":"#F3B3A6"}">${fmtSigned(p.pl, cur)} (${p.cost>0?((p.pl/p.cost)*100).toFixed(1):"0.0"}%)</div></div>
        <div><div class="lbl">Dividends received</div><div class="val">${fmt(p.dividends, cur)}</div></div>
      </div>
    </div>
    <div class="card"><h3>Holdings</h3>
      ${p.rows.length ? `<table class="tbl"><tr><th>Asset</th><th class="num">Qty</th><th class="num">Avg cost</th><th class="num">Price</th><th class="num">Value</th><th class="num">P/L</th><th></th></tr>
        ${p.rows.map(r => `<tr>
          <td>${esc(r.h.name)}${r.h.symbol?` <span class="tag brass">${esc(r.h.symbol)}</span>`:""}</td>
          <td class="num">${r.qty.toLocaleString("en-US",{maximumFractionDigits:4})}</td>
          <td class="num">${fmt(r.avg, r.h.currency)}</td>
          <td class="num"><a href="#" data-p="${r.h.id}" style="color:var(--pine)">${r.h.current_price?fmt(r.h.current_price,r.h.currency):"set price"}</a></td>
          <td class="num">${fmt(r.value, r.h.currency)}</td>
          <td class="num ${r.pl>=0?"pos":"neg"}">${fmtSigned(r.pl, r.h.currency)}</td>
          <td class="actions-cell"><button class="icon-btn" data-hd="${r.h.id}">✕</button></td>
        </tr>`).join("")}</table>` : `<div class="empty">Add a holding (an ETF, stock, fund, or gold) and log your buys.</div>`}
    </div>
    <div class="card"><h3>Investment history</h3>
      ${S.invtx.length ? `<table class="tbl"><tr><th>Date</th><th>Asset</th><th>Type</th><th class="num">Qty</th><th class="num">Amount</th><th></th></tr>
        ${S.invtx.slice(0,100).map(t => { const h = S.holdings.find(h=>h.id===t.holding_id);
          return `<tr><td class="mono" style="font-size:12.5px">${t.date}</td><td>${esc(h?.name||"?")}</td>
          <td><span class="tag ${t.type==="buy"?"":t.type==="sell"?"brass":"income"}">${t.type}</span></td>

/* Envelope balances, shared by Budget and Reports so the two can never
   disagree about what is left in an envelope.
   Carry-in for rollover envelopes: a rollover envelope is a running balance,
   so its carry-in is the whole chain behind it, not just last month's
   leftover. Put 500k a month aside for a 6m annual bill and month 3 must show
   1m carried in, not 500k. Walk forward from the first month the category saw
   any activity, keeping the running remainder. Budgets are indexed and
   spending is bucketed up front: re-scanning everything per category per
   month gets expensive fast. */
function envLedger() {
  const budIdx = {};
  S.budgets.forEach(b => { budIdx[b.category_id + "|" + b.month] = Number(b.budgeted) || 0; });
  const bAt = (mo, id) => budIdx[id + "|" + mo] || 0;
  const spendByMonth = {};
  S.txs.forEach(t => {
    if (!t.category_id || t.transfer_account_id || +t.amount >= 0) return;
    const mo = ym(t.date);
    (spendByMonth[t.category_id] ||= {})[mo] = (spendByMonth[t.category_id][mo] || 0) + Math.abs(+t.amount);
  });
  const spentAt = (cid, mo) => spendByMonth[cid]?.[mo] || 0;
  const firstActive = {};
  const firstMonthOf = cid => {
    if (cid in firstActive) return firstActive[cid];
    let min = null;
    const keep = mo => { if (mo && (!min || mo < min)) min = mo; };
    S.budgets.forEach(b => { if (b.category_id === cid && Number(b.budgeted)) keep(b.month); });
    Object.keys(spendByMonth[cid] || {}).forEach(keep);
    return (firstActive[cid] = min);
  };
  const availCache = {};
  // Money sitting in the envelope for month `mo`: this month's budget plus
  // everything rolled over into it.
  const availAt = (c, mo) => {
    if (!c.rollover) return bAt(mo, c.id);
    const key = c.id + "|" + mo;
    if (key in availCache) return availCache[key];
    const first = firstMonthOf(c.id);
    let carry = 0;
    if (first && first < mo) {
      for (let x = first, guard = 0; x < mo && guard < 600; x = shiftMonth(x, 1), guard++)
        carry = Math.max(0, bAt(x, c.id) + carry - spentAt(c.id, x));
    }
    return (availCache[key] = bAt(mo, c.id) + carry);
  };
  return { bAt, spentAt, availAt };
}

/* Reports answers a few questions and nothing else: where the money went by
   category, how the month is pacing, what is left in each envelope, who got
   paid, and what stands out. Every comparison on the page is made against one
   baseline, picked at the top, so a tick, a chip and a dashed line always
   mean the same thing. */
const RP_CHEV = `<i class="rp-car"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 1.5 7 5l-3.5 3.5"/></svg></i>`;
const RP_CMP = [["1m","Last month"],["3m","3-mo avg"],["6m","6-mo avg"],["custom","Custom"]];
function rpState() {
  if (S.rpCmp) return;
  S.rpCmp = store.get("rpCmp") || "3m";
  try { S.rpRange = JSON.parse(store.get("rpRange") || "null"); } catch(e) { S.rpRange = null; }
  S.rpOpen = {}; S.rpAllCats = false;
}
function rpRangeLabel(from, to) {
  const [fm, fy] = monthLabel(from).split(" "), [tm, ty] = monthLabel(to).split(" ");
  if (from === to) return `${fm} ${fy}`;
  return fy === ty ? `${fm}–${tm} ${ty}` : `${fm} ${fy}–${tm} ${ty}`;
}
function rpBaseline(m) {
  if (S.rpCmp === "custom" && S.rpRange) {
    const months = [];
    for (let x = S.rpRange.from, g = 0; x <= S.rpRange.to && g < 36; x = shiftMonth(x, 1), g++) months.push(x);
    if (months.length) return { months, label: rpRangeLabel(S.rpRange.from, S.rpRange.to) + (months.length > 1 ? " avg" : "") };
  }
  const n = S.rpCmp === "1m" ? 1 : S.rpCmp === "6m" ? 6 : 3;
  return { months: Array.from({ length: n }, (_, i) => shiftMonth(m, -(i+1))), label: n === 1 ? "last month" : `${n}-mo avg` };
}
/* The custom range picker is the transaction form's calendar, a level up:
   the same quick row, the same ‹ year › stepper, and a grid of months
   instead of days. The first tap sets From, the second sets To. */
function rpCustomRange() {
  const m = S.budgetMonth;
  const r = S.rpRange || { from: shiftMonth(m, -6), to: shiftMonth(m, -1) };
  const st = { from: r.from, to: r.to, next: "from", y: +r.to.slice(0, 4) };
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const count = () => { let n = 1; for (let x = st.from; x < st.to; x = shiftMonth(x, 1)) n++; return n; };
  // Quick ranges end with the month before the one on screen: a baseline
  // made of the months you are comparing would compare a month to itself.
  const quick = [[3, "Last 3"], [6, "Last 6"], [12, "Last 12"]].map(([n, label]) =>
    ({ label, from: shiftMonth(m, -n), to: shiftMonth(m, -1) }));
  const field = (k, label) => `<button type="button" class="tf-row stack${st.next === k ? " on" : ""}" data-rpf="${k}">
      <span class="tf-row-lbl">${label}</span><span class="tf-row-val">${monthLabel(st[k])}</span></button>`;
  const render = () => {
    const cells = MON.map((lbl, i) => {
      const mo = `${st.y}-${String(i + 1).padStart(2, "0")}`;
      const cls = mo === st.from || mo === st.to ? "sel" : mo > st.from && mo < st.to ? "in" : mo === m ? "today" : "";
      return `<button type="button" data-rpm="${mo}" class="${cls}">${lbl}</button>`;
    }).join("");
    el("modalBox").innerHTML = `<h3>Custom range</h3>
      <div class="m-sub">Compare against the monthly average over these months.</div>
      <div class="rp-rng-f">${field("from", "From")}<span class="rp-rng-arr">→</span>${field("to", "To")}</div>
      <div class="tf-cal-q">${quick.map((q, i) => `<button type="button" data-rpq="${i}" class="${q.from === st.from && q.to === st.to ? "on" : ""}">${q.label}</button>`).join("")}</div>
      <div class="tf-cal-nav"><button type="button" data-rpy="-1">‹</button><b>${st.y}</b><button type="button" data-rpy="1">›</button></div>
      <div class="tf-cal-grid rp-mgrid">${cells}</div>
      <div class="rp-rng-sum">${count()} month${count() === 1 ? "" : "s"} · picking <b>${st.next === "from" ? "From" : "To"}</b></div>
      <div class="m-foot">
        <button class="btn btn-ghost" id="rpCancel">Cancel</button>
        <button class="btn btn-primary" style="width:auto" id="rpApply">Apply</button>
      </div>`;
    document.querySelectorAll("[data-rpf]").forEach(b => b.onclick = () => { st.next = b.dataset.rpf; st.y = +st[st.next].slice(0, 4); render(); });
    document.querySelectorAll("[data-rpy]").forEach(b => b.onclick = () => { st.y += +b.dataset.rpy; render(); });
    document.querySelectorAll("[data-rpq]").forEach(b => b.onclick = () => { const q = quick[+b.dataset.rpq]; st.from = q.from; st.to = q.to; st.next = "from"; render(); });
    document.querySelectorAll("[data-rpm]").forEach(b => b.onclick = () => {
      const mo = b.dataset.rpm;
      if (st.next === "from") { st.from = mo; if (st.to < mo) st.to = mo; st.next = "to"; }
      else { if (mo < st.from) { st.to = st.from; st.from = mo; } else st.to = mo; st.next = "from"; }
      render();
    });
    el("rpCancel").onclick = closeModal;
    el("rpApply").onclick = () => {
      // 3 years is plenty for a baseline.
      if (shiftMonth(st.from, 35) < st.to) st.from = shiftMonth(st.to, -35);
      S.rpRange = { from: st.from, to: st.to }; S.rpCmp = "custom";
      store.set("rpRange", JSON.stringify(S.rpRange)); store.set("rpCmp", "custom");
      closeModal(); keepPlace(paintReports);
    };
  };
  openModal("");
  render();
}

/* A small six-month bar chart for one category or envelope. `ref` draws a
   dashed line across the whole chart (the baseline); a per-point `tick`
   marks that month's own budget instead. */
function rpMini(points, { ref = 0, cur = "" } = {}) {
  const mx = Math.max(1, ref, ...points.map(p => Math.max(p.v, p.tick || 0))) * 1.18;
  const pct = v => Math.min(100, v / mx * 100);
  return `<div class="rp-mini">
    <div class="rp-mini-plot">
      ${points.map(p => `<span class="col${p.mo === cur ? " cur" : ""}" title="${esc(monthLabel(p.mo))}: ${smv(p.v)}${p.tick ? ` of ${smv(p.tick)}` : ""}">
        <i class="b${p.over ? " over" : ""}" style="height:${p.v ? Math.max(2, pct(p.v)) : 0}%"></i>
        ${p.tick ? `<i class="t" style="bottom:${pct(p.tick)}%"></i>` : ""}
        <em style="bottom:calc(${pct(Math.max(p.v, p.tick || 0))}% + 3px)">${p.v ? smv(p.v) : ""}</em>
      </span>`).join("")}
      ${ref ? `<i class="ref" style="bottom:${pct(ref)}%"></i>` : ""}
    </div>
    <div class="rp-mini-axis">${points.map(p => `<span>${monthLabel(p.mo).split(" ")[0]}</span>`).join("")}</div>
  </div>`;
}

function paintReports() {
  rpState();
  const cur = CUR(); const m = S.budgetMonth;
  const today = new Date(), thisMonth = ym(today);
  const ok = t => spaceOK(t) && !t.transfer_account_id && !isDebtTx(t) && !t.opening;
  const gset = new Set(S.groups.filter(groupInSpace).map(g => g.id));
  const expCats = S.cats.filter(c => !c.is_income && gset.has(c.group_id));
  const base = rpBaseline(m), nB = base.months.length;
  const avgOf = f => Math.round(base.months.reduce((s,mo) => s + f(mo), 0) / nB);

  // One pass over the ledger: money in and out per month, and spending per
  // category, per payee and per day of month.
  const inBy = {}, outBy = {}, catBy = {}, payBy = {}, dayBy = {};
  const thisOut = [];
  S.txs.forEach(t => {
    if (!ok(t)) return;
    const mo = ym(t.date), a = +t.amount;
    if (a > 0) { inBy[mo] = (inBy[mo] || 0) + a; return; }
    const v = -a;
    outBy[mo] = (outBy[mo] || 0) + v;
    if (t.category_id) (catBy[t.category_id] ||= {})[mo] = (catBy[t.category_id][mo] || 0) + v;
    if (t.payee) (payBy[t.payee] ||= {})[mo] = (payBy[t.payee][mo] || 0) + v;
    const dd = +t.date.slice(8); (dayBy[mo] ||= {})[dd] = (dayBy[mo][dd] || 0) + v;
    if (mo === m) thisOut.push(t);
  });
  const catAt = (id, mo) => catBy[id]?.[mo] || 0;
  const payAt = (p, mo) => payBy[p]?.[mo] || 0;
  const income = inBy[m] || 0, spent = outBy[m] || 0, net = income - spent;
  const baseTotal = avgOf(mo => outBy[mo] || 0);
  const last6 = Array.from({ length: 6 }, (_, i) => shiftMonth(m, i - 5));
  const isCur = m === thisMonth;
  const [yy, mm] = m.split("-").map(Number);
  const dim = new Date(yy, mm, 0).getDate();
  const elapsed = isCur ? today.getDate() : m < thisMonth ? dim : 0;
  const toTx = q => { S.txMonth = m; S.txFilter.q = q; go("transactions"); };

  /* ---- Spend by category ---- */
  const CR = expCats.map(c => ({ c, spent: catAt(c.id, m), base: avgOf(mo => catAt(c.id, mo)) }))
    .filter(x => x.spent > 0 || x.base > 0).sort((a,b) => b.spent - a.spent || b.base - a.base);
  const maxCat = Math.max(1, ...CR.map(x => Math.max(x.spent, x.base)));
  const chip = (d, flatBelow) => {
    const flat = Math.abs(d) < flatBelow, up = d > 0;
    return `<span class="chip" style="background:${flat ? "var(--porcelain)" : up ? "#FBE9E5" : "#EAF4EF"};color:${flat ? "var(--ink-soft)" : up ? "var(--neg)" : "var(--pos)"}">${flat ? "·" : smvS(d)}</span>`;
  };
  const catRow = x => {
    const d = x.spent - x.base, open = !!S.rpOpen["c" + x.c.id];
    const trend = last6.map(mo => ({ mo, v: catAt(x.c.id, mo) }));
    const avg6 = Math.round(trend.reduce((s,p) => s + p.v, 0) / 6);
    return `<div class="rp-crow${open ? " open" : ""}" data-rpc="${x.c.id}" title="Show the last 6 months">
      <span class="cn rp-nm">${RP_CHEV}<span>${esc(x.c.name)}</span></span>
      <span class="cb"><i class="fill" style="width:${Math.max(1, x.spent/maxCat*100)}%;background:${d > 0 ? "#E08D7B" : "#5FBCA0"}"></i><i class="tick" style="left:${Math.min(99.5, x.base/maxCat*100)}%"></i></span>
      <span class="ca">${smv(x.spent)}</span>
      <span class="cd">${chip(d, 1000)}</span>
    </div>
    ${open ? `<div class="rp-x">
      ${rpMini(trend, { ref: x.base, cur: m })}
      <div class="rp-xfoot"><span><i class="rp-dash"></i>${esc(base.label)} ${smv(x.base)} · 6-mo avg ${smv(avg6)}</span>
        <button class="linkbtn" data-rptx="${esc(x.c.name)}">Transactions ›</button></div>
    </div>` : ""}`;
  };
  const CAT_CAP = 10;
  const catList = S.rpAllCats ? CR : CR.slice(0, CAT_CAP);

  /* ---- Cumulative spend ---- */
  const cumOf = mo => {
    const [y2, m2] = mo.split("-").map(Number), d2 = new Date(y2, m2, 0).getDate();
    const out = []; let acc = 0;
    for (let d = 1; d <= dim; d++) { if (d <= d2) acc += dayBy[mo]?.[d] || 0; out.push(acc); }
    return out;
  };
  const cum = cumOf(m);
  // The baseline keeps the real shape of those months (rent on the 1st, a
  // bill on the 15th) instead of a straight line.
  const baseCum = Array.from({ length: dim }, (_, i) => base.months.reduce((s,mo) => s + cumOf(mo)[i], 0) / nB);
  const cumNow = elapsed ? cum[elapsed - 1] : 0;
  // Projection: what is spent so far, plus what the baseline still spends
  // between today and month end. A straight-line pace overshoots badly when
  // the big bills land early in the month.
  const project = isCur && elapsed < dim;
  const projTotal = project ? (baseTotal ? cumNow + Math.max(0, baseTotal - baseCum[elapsed - 1]) : cumNow / elapsed * dim) : cumNow;
  const paceSVG = (() => {
    const W = 300, H = 100, mx = Math.max(cumNow, baseTotal, projTotal, 1);
    const X = i => (i/(dim-1)*W).toFixed(1), Y = v => (H - v/mx*H).toFixed(1);
    const pts = a => a.map((v,i) => `${X(i)},${Y(v)}`).join(" ");
    const mine = cum.slice(0, elapsed);
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block;overflow:visible">
      ${mine.length > 1 ? `<polygon points="0,${H} ${pts(mine)} ${X(elapsed-1)},${H}" fill="rgba(20,69,60,.10)"/>` : ""}
      <polyline points="${pts(baseCum)}" fill="none" stroke="#9AAAA4" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>
      ${project && elapsed ? `<polyline points="${X(elapsed-1)},${Y(cumNow)} ${W},${Y(projTotal)}" fill="none" stroke="var(--pine)" stroke-width="2" stroke-dasharray="1.5 4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>` : ""}
      ${mine.length > 1 ? `<polyline points="${pts(mine)}" fill="none" stroke="var(--pine)" stroke-width="2.4" vector-effect="non-scaling-stroke"/>` : ""}
    </svg>`;
  })();
  const paceD = projTotal - baseTotal;
  const paceLine = !elapsed ? "Nothing spent yet."
    : `${project ? "Heading for" : "Ended at"} <b>${smv(projTotal)}</b>${baseTotal ? `, <span style="color:${paceD > 0 ? "var(--neg)" : "var(--pos)"}">${smvS(paceD)}</span> vs ${esc(base.label)}` : ""}`;

  /* ---- Envelopes ---- */
  const L = envLedger();
  const envGroups = S.groups.filter(g => gset.has(g.id) && !g.is_income).map(g => ({ g,
    rows: S.cats.filter(c => c.group_id === g.id).map(c => {
      const avail = L.availAt(c, m), sp = L.spentAt(c.id, m);
      return { c, avail, sp, left: avail - sp, carry: avail - L.bAt(m, c.id) };
    }).filter(e => e.avail > 0 || L.bAt(m, e.c.id) > 0 || e.sp > 0) })).filter(x => x.rows.length);
  const envAll = envGroups.flatMap(x => x.rows);
  envGroups.forEach(x => ["avail","sp","left"].forEach(k => x[k] = x.rows.reduce((s,e) => s + e[k], 0)));
  const overEnv = envAll.filter(e => e.left < 0);
  const envLeft = envAll.reduce((s,e) => s + Math.max(0, e.left), 0);
  // One row shape for an envelope and for its group's totals; a group's
  // history is the sum of its envelopes', month by month. Groups start
  // closed: opening one shows its history and then its envelopes.
  const envLine = ({ key, name, extra = "", avail, sp, left, cats, group }) => {
    const over = left < 0, ratio = avail ? sp / avail : 1, open = !!S.rpOpen[key];
    const hist = last6.map(mo => {
      const a = cats.reduce((s,c) => s + L.availAt(c, mo), 0), v = cats.reduce((s,c) => s + L.spentAt(c.id, mo), 0);
      return { mo, v, tick: a, over: a > 0 && v > a };
    });
    const avg6 = Math.round(hist.reduce((s,p) => s + p.v, 0) / 6);
    const overN = hist.filter(p => p.over).length;
    return `<div class="rp-erow${group ? " grp" : ""}${open ? " open" : ""}" data-rpe="${key}" title="Show the last 6 months">
      <span class="en"><span class="rp-nm">${RP_CHEV}<span>${esc(name)}</span>${extra}</span>
        <span class="bar"><i style="width:${Math.min(100, ratio*100)}%;background:${over ? "var(--neg)" : ratio > .85 ? "var(--brass)" : "var(--pos)"}"></i></span></span>
      <span class="ev">${smv(avail)}</span>
      <span class="ev">${smv(sp)}</span>
      <span class="ev el ${over ? "neg" : "pos"}">${over ? "\u2212" : ""}${smv(Math.abs(left))}</span>
    </div>
    ${open ? `<div class="rp-x">
      ${rpMini(hist, { cur: m })}
      <div class="rp-xfoot"><span><i class="rp-tk"></i>budget \u00B7 avg spent ${smv(avg6)} / mo${overN ? ` \u00B7 over ${overN} of 6` : ""}</span>
        ${group ? "" : `<button class="linkbtn" data-rptx="${esc(name)}">Transactions \u203A</button>`}</div>
    </div>` : ""}`;
  };
  const envRow = e => envLine({ key: "e" + e.c.id, name: e.c.name, avail: e.avail, sp: e.sp, left: e.left, cats: [e.c],
    extra: e.carry > 0 ? `<em title="Rolled in from earlier months">+${smv(e.carry)} in</em>` : "" });
  const grpRow = x => envLine({ key: "g" + x.g.id, name: x.g.name, avail: x.avail, sp: x.sp, left: x.left, cats: x.rows.map(e => e.c), group: true });

  /* ---- Top payees ---- */
  const payees = Object.keys(payBy).filter(p => payAt(p, m) > 0)
    .map(p => ({ p, amt: payAt(p, m), n: thisOut.filter(t => t.payee === p).length, base: avgOf(mo => payAt(p, mo)) }))
    .sort((a,b) => b.amt - a.amt).slice(0, 5);
  const maxP = Math.max(1, ...payees.map(x => x.amt));
  const payeeTotal = payees.reduce((s,x) => s + x.amt, 0);

  /* ---- Worth knowing ---- */
  // Each finding carries a rank so the card shows the few that matter most.
  const found = [];
  const add = (rank, tone, html, q) => found.push({ rank, tone, html, q });
  // Early in the current month most numbers are still near zero, so "down on
  // normal" and run-rate guesses would only be noise.
  const settled = !isCur || elapsed >= 7;
  // 1. Biggest movers against the baseline.
  if (baseTotal) {
    const floor = Math.max(baseTotal * .02, 1000);
    const moved = CR.map(x => ({ ...x, d: x.spent - x.base })).filter(x => Math.abs(x.d) >= floor && Math.abs(x.d) >= x.base * .2);
    moved.filter(x => x.d > 0).sort((a,b) => b.d - a.d).slice(0, 2).forEach(x =>
      add(2, "neg", `<b>${esc(x.c.name)}</b> is up ${smv(x.d)} on ${esc(base.label)}${x.base ? ` (+${Math.round(x.d / x.base * 100)}%)` : ""}`, x.c.name));
    if (!isCur) moved.filter(x => x.d < 0).sort((a,b) => a.d - b.d).slice(0, 1).forEach(x =>
      add(7, "pos", `<b>${esc(x.c.name)}</b> is down ${smv(-x.d)} on ${esc(base.label)}`, x.c.name));
  }
  // 2. Large or unusual purchases: more than twice what that payee usually
  //    charges, judged on the six months before this one.
  const median = a => { const s = [...a].sort((x,y) => x - y), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h-1] + s[h]) / 2; };
  const before = shiftMonth(m, -6);
  const unusual = thisOut.filter(t => t.payee).map(t => {
    const prior = S.txs.filter(p => ok(p) && p.payee === t.payee && +p.amount < 0 && ym(p.date) >= before && ym(p.date) < m).map(p => -p.amount);
    return { t, usual: prior.length >= 2 ? median(prior) : 0 };
  }).filter(x => x.usual && -x.t.amount > x.usual * 2).sort((a,b) => a.t.amount - b.t.amount).slice(0, 2);
  unusual.forEach(x => add(3, "warn", `<b>${esc(x.t.payee)}</b> ${smv(-x.t.amount)} on ${+x.t.date.slice(8)} ${monthLabel(m).split(" ")[0]}, usually about ${smv(x.usual)}`, x.t.payee));
  // The biggest one-off, not the rent: a charge the same payee made at about
  // the same amount in the last three months is a routine bill.
  const prev3 = [1,2,3].map(i => shiftMonth(m, -i));
  const routine = t => S.txs.some(p => ok(p) && p.payee && p.payee === t.payee && p !== t && prev3.includes(ym(p.date)) && Math.abs(p.amount - t.amount) <= Math.abs(t.amount) * .1);
  const biggest = thisOut.filter(t => !routine(t)).reduce((b,t) => !b || +t.amount < +b.amount ? t : b, null);
  if (biggest && !unusual.some(x => x.t === biggest) && spent && -biggest.amount >= spent * .1)
    add(8, "info", `Biggest purchase: <b>${esc(biggest.payee || (biggest.category_id ? catName(biggest.category_id) : "Uncategorized"))}</b> ${smv(-biggest.amount)} on ${+biggest.date.slice(8)} ${monthLabel(m).split(" ")[0]}`, biggest.payee || "");
  // 3. A subscription that changed price: one charge a month, the same
  //    amount each of the last three months, and a different one now.
  const countAt = (p, mo) => S.txs.filter(t => ok(t) && t.payee === p && +t.amount < 0 && ym(t.date) === mo).length;
  Object.keys(payBy).map(p => {
    const hist = prev3.map(mo => payAt(p, mo));
    if (hist.some(v => !v) || [m, ...prev3].some(mo => countAt(p, mo) > 1) || !countAt(p, m)) return null;
    const avg = hist.reduce((s,v) => s + v, 0) / 3;
    if (hist.some(v => Math.abs(v - avg) > avg * .05)) return null;   // not a steady charge
    const now = payAt(p, m);
    return now && Math.abs(now - avg) > avg * .1 && Math.abs(now - avg) >= 1000 ? { p, now, avg } : null;
  }).filter(Boolean).sort((a,b) => Math.abs(b.now - b.avg) - Math.abs(a.now - a.avg)).slice(0, 2).forEach(x =>
    add(4, x.now > x.avg ? "neg" : "pos", `<b>${esc(x.p)}</b> charged ${smv(x.now)} this month, usually ${smv(x.avg)}`, x.p));
  // 4. Spending with no category makes every chart here less true.
  const uncat = thisOut.filter(t => !t.category_id);
  if (uncat.length) add(6, "warn", `${smv(uncat.reduce((s,t) => s - t.amount, 0))} of spending has no category (${uncat.length} transaction${uncat.length === 1 ? "" : "s"})`);
  // 5. Envelopes already over, then ones on course to run dry this month.
  overEnv.sort((a,b) => a.left - b.left).slice(0, 2).forEach(e => add(1, "neg", e.avail > 0
    ? `<b>${esc(e.c.name)}</b> is over by ${smv(-e.left)}`
    : `<b>${esc(e.c.name)}</b> has no budget but ${smv(e.sp)} spent`, e.c.name));
  if (isCur && settled && dim - elapsed >= 3) {
    envAll.filter(e => e.left > 0 && e.sp > 0).map(e => ({ e, day: Math.ceil(elapsed + e.left / (e.sp / elapsed)) }))
      .filter(x => x.day < dim).sort((a,b) => a.day - b.day).slice(0, 2).forEach(({ e, day }) =>
        add(5, "warn", `<b>${esc(e.c.name)}</b> runs out around the ${ordinal(day)} at this pace (${smv(e.left)} left)`, e.c.name));
  }
  const ins = found.sort((a,b) => a.rank - b.rank).slice(0, 6);
  const TONE = { neg: "var(--neg)", pos: "var(--pos)", warn: "var(--brass)", info: "#9AAAA4" };

  setBar({
    month: { label: monthLabel(m), prev: () => { S.budgetMonth = shiftMonth(m,-1); go("reports"); }, next: () => { S.budgetMonth = shiftMonth(m,1); go("reports"); } },
    scope: isCur ? null : { label: "Today", fn: () => { S.budgetMonth = thisMonth; go("reports"); } },
    ghosts: [{ label: "CSV", fn: () => exportCSV(m) }],
    primary: { label: "PDF", fn: () => window.print() }
  });

  el("viewBody").innerHTML = `
    <div class="rp-top">
      <div class="rp-sum"><span>In <b class="pos">${smv(income)}</b></span><span>Out <b>${smv(spent)}</b></span><span>Kept <b class="${net < 0 ? "neg" : "pos"}">${smvS(net)}</b></span></div>
      <div class="rp-cmp"><span>Compare to ${infoDot("normal")}</span>
        <div class="tf-seg">${RP_CMP.map(([k, label]) => `<button type="button" data-cmp="${k}" class="${S.rpCmp === k ? "on" : ""}">${esc(k === "custom" && S.rpCmp === "custom" && S.rpRange ? rpRangeLabel(S.rpRange.from, S.rpRange.to) : label)}</button>`).join("")}</div>
      </div>
    </div>

    <div class="card rp-ins-card">
      <div class="rp-chead"><b>Worth knowing</b><span class="rp-cnote">${monthLabel(m)}</span></div>
      ${ins.length ? `<div class="rp-ins">${ins.map(i => `<div class="rp-irow${i.q ? " go" : ""}"${i.q ? ` data-rptx="${esc(i.q)}"` : ""}><i style="background:${TONE[i.tone]}"></i><span>${i.html}</span></div>`).join("")}</div>`
        : `<div style="font-size:12.5px;color:var(--ink-soft)">Nothing stands out this month.</div>`}
    </div>

    <div class="rp-charts">
      <div class="rp-col">
        <div class="card rp-catcard">
          <div class="rp-chead"><b>Spend by category</b><span class="rp-cnote"><i class="tickleg"></i>${esc(base.label)}</span></div>
          ${CR.length ? catList.map(catRow).join("") : `<div class="empty">No spending this month.</div>`}
          ${CR.length > CAT_CAP ? `<button class="linkbtn" id="rpAllCats" style="margin-top:6px">${S.rpAllCats ? "Show fewer" : `Show all ${CR.length}`}</button>` : ""}
        </div>
        <div class="card rp-env">
          <div class="rp-chead"><b>Envelopes</b><span class="rp-cnote">${smv(envLeft)} left${overEnv.length ? ` · <span style="color:var(--neg)">${overEnv.length} over</span>` : ""}</span></div>
          ${envAll.length ? `<div class="rp-erow rp-ehead"><span></span><span class="ev">Budget</span><span class="ev">Spent</span><span class="ev">Left</span></div>
            ${envGroups.map(x => `<div class="rp-egrp">${grpRow(x)}</div>${S.rpOpen["g" + x.g.id] ? x.rows.map(envRow).join("") : ""}`).join("")}`
            : `<div class="empty">No envelopes budgeted for ${monthLabel(m)}.</div>`}
        </div>
      </div>
      <div class="rp-col rp-side">
        <div class="card rp-pace">
          <div class="rp-chead"><b>Cumulative spend</b><span class="rp-cnote"><span><i class="line solid"></i>${monthLabel(m).split(" ")[0]}</span><span style="margin-left:10px"><i class="line dash"></i>${esc(base.label)}</span></span></div>
          <div class="rp-pacebox">${paceSVG}</div>
          <div class="rp-paceaxis"><span>1</span><span>8</span><span>15</span><span>22</span><span>${dim}</span></div>
          <div class="rp-pacenote">${paceLine}</div>
        </div>
        <div class="card">
          <div class="rp-chead"><b>Top payees</b><span class="rp-cnote">${spent ? Math.round(payeeTotal/spent*100) + "% of out" : ""}</span></div>
          ${payees.length ? payees.map(x => `<div class="rp-prow" data-rptx="${esc(x.p)}" title="See transactions">
            <span class="pn"><span>${esc(x.p)} <em>×${x.n}</em></span><span class="bar"><i style="width:${x.amt/maxP*100}%;background:#5FBCA0"></i></span></span>
            <span class="pa">${smv(x.amt)}</span>
            <span class="pd">${x.base ? chip(x.amt - x.base, 1000) : `<span class="chip" style="background:var(--brass-soft);color:var(--brass)">new</span>`}</span>
          </div>`).join("") : `<div class="empty" style="padding:14px">No named payees yet.</div>`}
        </div>
      </div>
    </div>`;

  const repaint = () => keepPlace(paintReports);
  document.querySelectorAll("[data-cmp]").forEach(b => b.onclick = () => {
    if (b.dataset.cmp === "custom") return rpCustomRange();
    S.rpCmp = b.dataset.cmp; store.set("rpCmp", S.rpCmp); repaint();
  });
  document.querySelectorAll("[data-rpc]").forEach(r => r.onclick = () => { const k = "c" + r.dataset.rpc; S.rpOpen[k] = !S.rpOpen[k]; repaint(); });
  document.querySelectorAll("[data-rpe]").forEach(r => r.onclick = () => { const k = r.dataset.rpe; S.rpOpen[k] = !S.rpOpen[k]; repaint(); });
  document.querySelectorAll("[data-rptx]").forEach(b => b.onclick = e => { e.stopPropagation(); toTx(b.dataset.rptx); });
  if (el("rpAllCats")) el("rpAllCats").onclick = () => { S.rpAllCats = !S.rpAllCats; repaint(); };
}
function ordinal(n) { const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

/* Renders the budget view from whatever is already in memory. Split out of
   RENDER.budget so editing an envelope can repaint in place — routing that
   through go("budget") refetches, flashes a spinner and drops you back at
   the top of the page. */
function paintBudget() {
  const cur = CUR(); const m = S.budgetMonth;
  const prevM = shiftMonth(m, -1);
  const { bAt, availAt } = envLedger();   // budgets and rollover carry-in, shared with Reports

  const spentBy = {}, incomeBy = {};
  S.txs.filter(t => ym(t.date) === m && t.category_id && !t.transfer_account_id).forEach(t => {
    if (+t.amount < 0) spentBy[t.category_id] = (spentBy[t.category_id]||0) + Math.abs(+t.amount);
    else incomeBy[t.category_id] = (incomeBy[t.category_id]||0) + +t.amount;
  });


  const gset = new Set(S.groups.filter(groupInSpace).map(g => g.id));
  const expCats = S.cats.filter(c => !c.is_income && gset.has(c.group_id));
  const incCats = S.cats.filter(c => c.is_income && gset.has(c.group_id));
  // What is in the envelope right now: its budget, anything rolled in, less spending.
  const leftIn = c => availAt(c, m) - (spentBy[c.id]||0);
  // The envelope sheet shows Available too; hand it the rolled-in part so the
  // two agree for rollover envelopes.
  S.carryIn = { month: m, by: Object.fromEntries(expCats.map(c => [c.id, availAt(c, m) - bAt(m, c.id)])) };

  /* What's actually left to budget is not "this month's income minus the
     budget" — you can assign money that arrived in March, and a card balance is
     money you owe, not money you have. So: take the real balance of every
     on-budget account (credit cards run negative and pull the total down), then
     subtract what is still sitting unspent in envelopes. Money already spent has
     left the accounts, so it must not be subtracted twice. */
  const funds = budgetFunds();
  const held = expCats.reduce((s,c) => s + Math.max(0, leftIn(c)), 0);
  const left = funds - held;

  /* The screen answers one question: how much is in each envelope. Budgeted,
     spent, the allocation bar and the rest of the totals live in the envelope
     sheet a click away. One ⋯ per row on desktop; on a phone the row itself
     opens that sheet, which carries rollover, rename and delete. */
  const gAddEdit = g => `<span class="benv-actions"><button class="mini" data-gadd="${g.id}" title="Add category to this group">+</button><button class="sq" data-gmenu="${g.id}" data-menu-id="g${g.id}" title="Group actions">⋯</button></span>`;
  const envDots = c => `<span class="benv-actions"><button class="sq" data-cmenu="${c.id}" data-menu-id="c${c.id}" title="Envelope actions">⋯</button></span>`;

  /* Income groups aren't envelopes: there is nothing to budget, spend or have
     left over. They just report what came in, so they get their own layout. */
  const incomeGroupHTML = g => {
    const list = S.cats.filter(c => c.group_id === g.id);
    /* Built-in categories move both ways — a card's opening balance is
       negative, lending money out is negative — so they report a net rather
       than only what came in. Ordinary income sources only ever go up. */
    const flow = c => c.is_system ? (incomeBy[c.id]||0) - (spentBy[c.id]||0) : (incomeBy[c.id]||0);
    const gs = list.reduce((s,c) => s + flow(c), 0);
    const open = !!S.budOpen[g.id];   // groups start collapsed; the header total is enough at a glance
    return `<div>
      <div class="bgrp-head inc" data-gt="${g.id}">
        <span class="bgrp-name"><i class="caret">${open?"▼":"▶"}</i><b>${esc(g.name)}</b></span>
        <span class="num ${gs>0?"pos":gs<0?"neg":"soft"}">${fmt(gs,cur)}</span>
        ${gAddEdit(g)}
      </div>
      <div data-gbody="${g.id}" style="${open ? "" : "display:none"}">
      ${list.map(c => {
        const got = flow(c);
        return `<div class="binc" data-env="${c.id}">
          <div class="benv-title"><b>${esc(c.name)}</b>${c.is_system?'<span class="pillmini">built-in</span>':""}</div>
          <span class="num ${got>0?"pos":got<0?"neg":"zero"}">${fmt(got,cur)}</span>
          ${envDots(c)}
        </div>`; }).join("")}
      </div>
    </div>`;
  };

  const groupHTML = g => {
    if (g.is_income) return incomeGroupHTML(g);
    const list = S.cats.filter(c => c.group_id === g.id);
    const gl = list.reduce((s,c) => s + leftIn(c), 0);
    const open = !!S.budOpen[g.id];   // groups start collapsed; the header total is enough at a glance
    return `<div>
      <div class="bgrp-head" data-gt="${g.id}">
        <span class="bgrp-name"><i class="caret">${open?"▼":"▶"}</i><b>${esc(g.name)}</b></span>
        <span class="num ${gl<0?"neg":gl===0?"zero":"pos"}">${fmt(gl,cur)}</span>
        ${gAddEdit(g)}
      </div>
      <div data-gbody="${g.id}" style="${open ? "" : "display:none"}">
      ${list.map(c => {
        const l = leftIn(c);
        return `<div class="benv" data-env="${c.id}">
          <div class="benv-title"><b>${esc(c.name)}</b></div>
          <span class="num ${l<0?"neg":l===0?"zero":"pos"}">${fmt(l,cur)}</span>
          ${envDots(c)}
        </div>`; }).join("")}
      </div>
    </div>`;
  };

  /* Three pills spelling out the fill modes have become one menu: they were
     permanent buttons for something you press once a month. */
  const AUTOFILL = [
    { label: `Copy ${monthLabel(prevM)}`, mode: "last" },
    { label: "3-month average", mode: "avg" },
    { label: "Zero every envelope", mode: "zero", danger: true }
  ];
  setBar({
    month: { label: monthLabel(m), prev: () => { S.budgetMonth = shiftMonth(m,-1); go("budget"); }, next: () => { S.budgetMonth = shiftMonth(m,1); go("budget"); } },
    scope: m === ym(new Date()) ? null : { label: "Today", fn: () => { S.budgetMonth = ym(new Date()); go("budget"); } },
    ghosts: [{ label: "Auto-fill ▾", fn: () => {} }],
    primary: { label: "+ Category", fn: () => catForm(null, null, m) }
  });
  el("barG0").dataset.menuId = "autofill";
  el("barG0").onclick = e => { e.stopPropagation();
    openMenu(el("barG0"), AUTOFILL.map(a => ({ label: a.label, danger: a.danger, fn: () => bulkFill(m, a.mode) }))); };

  el("viewBody").innerHTML = `
    <div class="hero bud-left">
      <div class="lbl">${left<0?"Over-allocated":"Left to budget"} ${infoDot("left", true)}</div>
      <div class="big" style="color:${left<0?"#F3B3A6":"#fff"}">${fmt(left,cur)}</div>
    </div>
    <div class="card budtable">
      <div class="bud-cols"><span>Envelope</span><span class="r">In envelope ${infoDot("avail")}</span><span></span></div>
      ${S.groups.filter(groupInSpace).map(groupHTML).join("")}
      <div class="led-foot">
        <span>${expCats.length} envelope${expCats.length===1?"":"s"} · ${incCats.length} income source${incCats.length===1?"":"s"}${S.activeSpace==="all"?"":` · ${esc(spaceName(S.activeSpace))}`}</span>
        <span style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm" id="addCat2">+ Category</button><button class="btn btn-ghost btn-sm" id="addGrp">+ Group</button></span>
      </div>
    </div>
    <button class="fab" id="fabCat" title="New category">+</button>`;

  el("addCat2").onclick = el("fabCat").onclick = () => catForm(null, null, m);
  el("addGrp").onclick = () => groupForm();
  document.querySelectorAll("[data-gt]").forEach(h => h.onclick = e => {
    if (e.target.closest(".benv-actions")) return;
    const id = h.dataset.gt, closed = !!S.budOpen[id];
    S.budOpen[id] = !closed;
    const body = document.querySelector(`[data-gbody="${id}"]`);
    if (body) body.style.display = closed ? "none" : "";
    const caret = h.querySelector(".caret");
    if (caret) caret.textContent = closed ? "\u25B6" : "\u25BC"; });
  document.querySelectorAll("[data-gadd]").forEach(b => b.onclick = e => { e.stopPropagation(); catForm(null, b.dataset.gadd, m); });
  document.querySelectorAll("[data-gmenu]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const g = S.groups.find(x => x.id === b.dataset.gmenu);
    openMenu(b, [
      { label: "Add a category…", fn: () => catForm(null, g.id, m) },
      { label: "Edit group…", fn: () => groupForm(g) }
    ]);
  });
  /* Rollover, rename and delete were desktop-only icons in this row, which is
     how a phone lost them. One ⋯ carries them all on both. */
  document.querySelectorAll("[data-cmenu]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const c = S.cats.find(x => x.id === b.dataset.cmenu);
    const inc = !!S.groups.find(g => g.id === c.group_id)?.is_income;
    const toggle = (field, msg) => async () => {
      const was = !!c[field];
      c[field] = !was; keepPlace(paintBudget); toast(msg(!was));
      try { await rest(`categories?id=eq.${c.id}`, { method: "PATCH", body: { [field]: c[field] } }); }
      catch (err) { c[field] = was; keepPlace(paintBudget); toast(err.message); }
    };
    const items = [{ label: inc ? "Edit source…" : "Edit envelope…", fn: () => catForm(c, null, m) }];
    if (!inc) {
      items.push({ label: "Roll unspent over", hint: c.rollover ? "on" : "off",
        fn: toggle("rollover", on => on ? "Rolls over each month" : "Resets each month") });
    }
    if (!c.is_system) items.push(null, { label: "Delete…", danger: true, fn: () => catForm(c, null, m, true) });
    openMenu(b, items);
  });
  /* Clicking an envelope opens its sheet, where the budget is set. On desktop
     it lands straight in the number; on a phone that would pop the keyboard
     when you only wanted to look. */
  document.querySelectorAll("[data-env]").forEach(r => r.onclick = e => {
    if (e.target.closest(".benv-actions")) return;
    const c = S.cats.find(x => x.id === r.dataset.env);
    catForm(c, null, m, false, isPhone() || c.is_income ? undefined : "budget");
  });
}

function shiftMonth(m, d) { const [y,mo] = m.split("-").map(Number); return ym(new Date(y, mo-1+d, 1)); }

function portfolio() {
  const rows = S.holdings.map(h => {
    const tx = S.invtx.filter(t => t.holding_id === h.id);
    const buyQty = tx.filter(t=>t.type==="buy").reduce((s,t)=>s+ +t.quantity,0);
    const sellQty = tx.filter(t=>t.type==="sell").reduce((s,t)=>s+ +t.quantity,0);
    const buyCost = tx.filter(t=>t.type==="buy").reduce((s,t)=>s+Math.abs(+t.amount),0);
    const qty = buyQty - sellQty;
    const avg = buyQty > 0 ? buyCost / buyQty : 0;
    const cost = qty * avg;
    const value = h.current_price ? qty * +h.current_price : cost;
    return { h, qty, avg, cost, value, pl: value - cost };
  }).filter(r => r.qty > 0.000001 || S.invtx.some(t => t.holding_id === r.h.id));
  const dividends = S.invtx.filter(t=>t.type==="dividend").reduce((s,t)=>s+ +t.amount,0);
  return { rows, cost: rows.reduce((s,r)=>s+r.cost,0), marketValue: rows.reduce((s,r)=>s+r.value,0), pl: rows.reduce((s,r)=>s+r.pl,0), dividends };
}

/* ============ Forms ============ */

      <div class="field"><label>Currency</label><select id="fCur">${["VND","USD","EUR","SGD"].map(c=>`<option ${(a?.currency||"VND")===c?"selected":""}>${c}</option>`).join("")}</select></div>
    </div>

    <button id="fOnBudget" class="ro-card"></button>
    ${a ? `<label class="checkrow"><input type="checkbox" id="fClosed" ${a.is_closed?"checked":""}><span>Closed — hide it from pickers and totals</span></label>` : ""}

    <div class="m-foot">${a?'<button class="btn btn-danger" id="fDel">Delete</button>':""}<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" style="width:auto" id="fSave">Save account</button></div>`);

  const paintBudgetToggle = () => {

    b.className = "ro-card" + (onBudget ? " on" : "");

  el("fType").onchange = e => {

  el("fSave").onclick = guardBtn(async () => {
    const body = { name: el("fName").value.trim(), type: el("fType").value, currency: el("fCur").value, on_budget: onBudget };
    if (!body.name) return toast("Please give the account a name");
    const v = parseNum(el("fBal").value);
    const openSpace = S.activeSpace !== "all" ? S.activeSpace : S.spaces[0]?.id || null;
    // No payee — the built-in category already says what this is, and the
    // ledger falls back to the category name when a payee is missing.
    const openBody = accId => ({ account_id: accId, date: todayISO(), amount: v, payee: null,
      category_id: systemCat(openSpace)?.id || null, opening: true, cleared: true, space_id: openSpace });
    if (a) {
      body.is_closed = el("fClosed").checked;
      await rest(`accounts?id=eq.${a.id}`, { method: "PATCH", body });
      if (openTx && v !== +openTx.amount) {
        if (v === 0) await rest(`transactions?id=eq.${openTx.id}`, { method: "DELETE" });
        else await rest(`transactions?id=eq.${openTx.id}`, { method: "PATCH", body: { amount: v } });
      } else if (!openTx && v !== 0) {
        await rest("transactions", { method: "POST", body: openBody(a.id) });
      }
    } else {
